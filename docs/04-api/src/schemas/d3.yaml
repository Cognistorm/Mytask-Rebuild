# D3 — schemas for specs 05, 09, 14. STUB written by the P2-B4 foundation run; the D3 group run fills it.
# Map of SchemaName -> Schema. Names must start with one of the D3 schemaPrefixes in src/ownership.yaml
# (optionally preceded by "Admin"), except D3ErrorCode. Names in ../components/schemas.yaml are reserved.
# Reference shared schemas as '../components/schemas.yaml#/Money' and own ones as '#/MySchema'.

D3ErrorCode:
  type: string
  x-stub: true
  description: |
    Domain error codes of D3 (CONVENTIONS §7.3). The D3 run replaces this stub with
    `enum: [...]` plus `x-enumDescriptions` ("[HTTP status] meaning; messageKey t_..."), using only
    the D3 errorPrefixes from src/ownership.yaml, and removes `x-stub`.
