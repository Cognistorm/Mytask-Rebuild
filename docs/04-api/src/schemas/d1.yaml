# D1 — schemas for specs 00, 01, 02. STUB written by the P2-B4 foundation run; the D1 group run fills it.
# Map of SchemaName -> Schema. Names must start with one of the D1 schemaPrefixes in src/ownership.yaml
# (optionally preceded by "Admin"), except D1ErrorCode. Names in ../components/schemas.yaml are reserved.
# Reference shared schemas as '../components/schemas.yaml#/Money' and own ones as '#/MySchema'.

D1ErrorCode:
  type: string
  x-stub: true
  description: |
    Domain error codes of D1 (CONVENTIONS §7.3). The D1 run replaces this stub with
    `enum: [...]` plus `x-enumDescriptions` ("[HTTP status] meaning; messageKey t_..."), using only
    the D1 errorPrefixes from src/ownership.yaml, and removes `x-stub`.
