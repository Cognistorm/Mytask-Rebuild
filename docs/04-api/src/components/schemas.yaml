# Shared schemas (foundation, P2-B4 part 1). Owned by the solution-architect foundation run.
# Group runs (D1…D6) may $ref these schemas but must NOT edit this file.
# Need a change or a new shared schema? Write it in your handoff; the integration run adds it.
# Every name here is RESERVED: no group schema file may reuse it.
#
# Conventions (docs/04-api/CONVENTIONS.md):
#   - properties camelCase, enum values snake_case, schema names PascalCase
#   - nullable scalar: `type: [string, 'null']`; nullable $ref: `oneOf: [{$ref: …}, {type: 'null'}]`
#   - response objects list every property in `required` (absent = never; unknown = null)

# ───────────────────────── Primitives ─────────────────────────
Uuid:
  type: string
  format: uuid
  description: UUIDv7 generated by the API (data-model §1). Never shown to users as an order number.
  examples: ['01927b3e-6c1a-7d2e-9f10-3a4b5c6d7e8f']

Timestamp:
  type: string
  format: date-time
  pattern: 'Z$'
  description: ISO 8601 date-time in UTC with the `Z` suffix. Clients format it in `Asia/Tbilisi` or the device zone.
  examples: ['2026-09-28T10:00:00Z']

DateOnly:
  type: string
  format: date
  description: Calendar date `YYYY-MM-DD`, interpreted in `Asia/Tbilisi` unless the operation says otherwise.
  examples: ['2026-09-28']

Locale:
  type: string
  enum: [ka, en]
  description: Language code. `ka` (Georgian) is the default and the fallback (Q-023).

LocalizedString:
  type: object
  description: |
    A translatable text as edited by staff or an owner (both languages at once). Used in **write**
    requests and in **admin** reads. Public reads return the single resolved string plus `contentLocale`
    (CONVENTIONS §11). `ka` is required; `en` may be null (then readers get the Georgian text).
  required: [ka, en]
  properties:
    ka: {type: string}
    en: {type: [string, 'null']}

ContentLocale:
  type: string
  enum: [ka, en]
  description: |
    The language the returned content fields are actually in. Equals the requested `Accept-Language`
    unless the English translation is missing, in which case it is `ka` and clients show
    `t_content_shown_in_georgian` (ADR-006 §6, Q-023).

Currency:
  type: string
  const: GEL
  description: The only currency (P-13).

Money:
  type: object
  description: An amount of money. `amount` is an integer number of **tetri** (1 GEL = 100 tetri); no floats anywhere (ADR-003). May be negative only where the operation says so (e.g. migrated negative balances, ledger lines).
  required: [amount, currency]
  properties:
    amount:
      type: integer
      format: int64
      description: Integer tetri.
      examples: [10250]
    currency: {$ref: '#/Currency'}
  examples:
    - {amount: 10250, currency: GEL}

BasisPoints:
  type: integer
  minimum: 0
  maximum: 10000
  description: A percentage in basis points (250 = 2.5%). Applied with integer maths, rounded half up to the tetri (R-3.8).

CountryCode:
  type: string
  pattern: '^[A-Z]{2}$'
  description: ISO 3166-1 alpha-2 country code.

EmailAddress:
  type: string
  format: email
  maxLength: 254

HttpUrl:
  type: string
  format: uri
  pattern: '^https?://'

PlanCode:
  type: string
  enum: [standard, premium]
  description: User plan (spec 00 §2). Every user is buyer and freelancer (Q-013); the plan only changes limits and Premium features.

BillingPeriod:
  type: string
  enum: [monthly, yearly]

# ───────────────────────── Errors ─────────────────────────
Error:
  type: object
  description: |
    The one error body for every non-2xx response (CONVENTIONS §7). `code` is stable and machine-readable
    (clients branch on it). `message` is localized by `Accept-Language` from the spec's `t_*` key.
    `details` is always an object (possibly empty).
  required: [code, message, details]
  properties:
    code: {$ref: '#/ErrorCode'}
    message:
      type: string
      description: Human-readable, localized (ka|en). Never parsed by clients.
    details: {$ref: '#/ErrorDetails'}
  examples:
    - code: PLAN_LIMIT_REACHED
      message: თქვენი გეგმის ლიმიტი ამოწურულია
      details: {messageKey: t_plan_gig_limit_reached, limit: 1, settingId: S-001}

ErrorDetails:
  type: object
  description: Well-known optional members; operations may document additional members for specific codes.
  additionalProperties: true
  properties:
    messageKey:
      type: string
      pattern: '^t_[a-z0-9_]+$'
      description: The i18n key of `message` (packages/i18n), for clients that render from their own bundle.
    fields:
      type: array
      description: Field errors for `VALIDATION_FAILED`.
      items: {$ref: '#/FieldError'}
    permission:
      type: string
      description: Missing staff permission for `FORBIDDEN` on admin operations (spec 16 AC-9).
    settingId:
      type: string
      pattern: '^S-[0-9]{3}$'
      description: Register row behind `FEATURE_DISABLED` / `PLAN_LIMIT_REACHED` / limits.
    limit:
      type: integer
      description: The limit that was hit, when relevant.
    retryAfterSeconds:
      type: integer
      minimum: 0
    currentState:
      type: string
      description: Current status of the resource for `STATE_CONFLICT`.

FieldError:
  type: object
  description: |
    One invalid field of a `VALIDATION_FAILED` error (CONVENTIONS §7.1). `params` carries the values of the
    placeholders of `messageKey` (e.g. `{max: 80}` for `:max`), so clients that render from their own
    bundle get the same text as `message`.
    **Georgian fields** (spec 00 R-5.3/R-5.3a, PROPOSED P-136, scope Q-109; gig title/description D2,
    project title/description D5): `code = georgian_field_characters` when the normalised text contains
    characters outside the allowed set — `refusedCharacters` lists each refused character once, in order
    of first appearance, at most 10, and `params.chars` is the same list joined by a space (placeholder
    `:chars` of `t_validator_georgian_field_characters`); `code = georgian_letter_required` when only the
    "at least one Georgian letter" rule fails (`t_validator_georgian_letter_required`, P-37;
    `refusedCharacters` empty). English fields use `georgian_letters_not_allowed` (R-5.4, CONVENTIONS §11).
  required: [field, code, message]
  properties:
    field:
      type: string
      description: JSON pointer-like path of the request field, e.g. `title.ka`, `items[2].gigId`.
    code:
      type: string
      description: Validation code, e.g. `required`, `too_long`, `too_short`, `pattern`, `out_of_range`, `not_allowed`, `georgian_letters_not_allowed`, `georgian_field_characters`, `georgian_letter_required`.
    message: {type: string, description: Localized.}
    messageKey: {type: string, pattern: '^t_[a-z0-9_]+$'}
    params:
      type: object
      description: Placeholder values of `messageKey` (names without the leading colon); values are strings or integers.
      additionalProperties:
        type: [string, integer]
    refusedCharacters:
      type: array
      maxItems: 10
      description: Only for `code = georgian_field_characters` (empty for `georgian_letter_required`); omitted for other codes.
      items: {type: string, minLength: 1, maxLength: 2}

ErrorCode:
  description: |
    Every error code the API can return. Common codes are listed in `CommonErrorCode`; each group adds its
    domain codes (with its reserved prefixes, CONVENTIONS §7.3) to its own `D<n>ErrorCode` enum in
    `src/schemas/d<n>.yaml`. Clients must treat an unknown code like `INTERNAL_ERROR` for display purposes.
  anyOf:
    - {$ref: '#/CommonErrorCode'}
    - {$ref: '../schemas/d1.yaml#/D1ErrorCode'}
    - {$ref: '../schemas/d2.yaml#/D2ErrorCode'}
    - {$ref: '../schemas/d3.yaml#/D3ErrorCode'}
    - {$ref: '../schemas/d4.yaml#/D4ErrorCode'}
    - {$ref: '../schemas/d5.yaml#/D5ErrorCode'}
    - {$ref: '../schemas/d6.yaml#/D6ErrorCode'}

CommonErrorCode:
  type: string
  description: Cross-cutting error codes (HTTP status in brackets). See CONVENTIONS §7.
  enum:
    - VALIDATION_FAILED
    - UNAUTHENTICATED
    - FORBIDDEN
    - CSRF_CHECK_FAILED
    - ACCOUNT_RESTRICTED
    - REAUTH_REQUIRED
    - FEATURE_DISABLED
    - PREMIUM_REQUIRED
    - PLAN_LIMIT_REACHED
    - NOT_FOUND
    - STATE_CONFLICT
    - DUPLICATE
    - IDEMPOTENCY_KEY_REQUIRED
    - IDEMPOTENCY_KEY_REUSED
    - IDEMPOTENCY_IN_PROGRESS
    - BUSINESS_RULE_VIOLATION
    - INSUFFICIENT_FUNDS
    - FILE_NOT_READY
    - FILE_TYPE_NOT_ALLOWED
    - FILE_TOO_LARGE
    - FILE_PURPOSE_MISMATCH
    - RATE_LIMITED
    - APP_VERSION_UNSUPPORTED
    - MAINTENANCE
    - SERVICE_UNAVAILABLE
    - INTERNAL_ERROR
  x-enumDescriptions:
    VALIDATION_FAILED: '[400] Request body/params invalid or malformed. `details.fields` lists each field.'
    UNAUTHENTICATED: '[401] No valid access token (missing, expired, revoked, wrong audience). Clients refresh once, then send the user to login.'
    FORBIDDEN: '[403] Authenticated but not allowed (ownership, role, missing staff permission in `details.permission`).'
    CSRF_CHECK_FAILED: '[403] Cookie-authenticated unsafe request without `X-MyTask-Client: web|admin` or with a foreign `Origin` (ADR-002 §2).'
    ACCOUNT_RESTRICTED: '[403] The user is restricted (spec 01 R-A8); only restriction/appeal operations are allowed.'
    REAUTH_REQUIRED: '[403] Staff high-risk action without re-authentication in the last 15 minutes (spec 16 AC-7). Call `adminReauthenticate`, then retry.'
    FEATURE_DISABLED: '[403] A register toggle is OFF (spec 00 AC-11). `details.settingId` names it.'
    PREMIUM_REQUIRED: '[403] The action needs Premium (e.g. proposals, Q-020).'
    PLAN_LIMIT_REACHED: '[422] A plan limit S-001…S-007 is reached (`details.limit`, `details.settingId`).'
    NOT_FOUND: '[404] The resource does not exist or the caller may not know it exists.'
    STATE_CONFLICT: '[409] The resource is not in a state that allows this action (already decided, status changed, concurrent update). `details.currentState` when safe to reveal.'
    DUPLICATE: '[409] A unique value is already taken or the same thing was already submitted (e.g. second report).'
    IDEMPOTENCY_KEY_REQUIRED: '[400] Money operation called without `Idempotency-Key`.'
    IDEMPOTENCY_KEY_REUSED: '[422] Same `Idempotency-Key` sent with a different request body (ADR-003 §6).'
    IDEMPOTENCY_IN_PROGRESS: '[409] The first request with this key is still being processed; retry after `Retry-After`.'
    BUSINESS_RULE_VIOLATION: '[422] Generic rule refusal when no more specific code exists; `details.messageKey` carries the spec text.'
    INSUFFICIENT_FUNDS: '[422] Available balance (or points) too low (spec 05 AC-19/20, spec 14, spec 05 AC-42/43).'
    FILE_NOT_READY: '[422] A referenced file is not `ready` (still scanning or rejected, ADR-009 §3.6).'
    FILE_TYPE_NOT_ALLOWED: '[422] File type not allowed for this purpose (settings register).'
    FILE_TOO_LARGE: '[422] File size above the purpose limit (settings register).'
    FILE_PURPOSE_MISMATCH: '[422] A file uploaded for another purpose or by another owner was referenced.'
    RATE_LIMITED: '[429] Too many requests; see `Retry-After`.'
    APP_VERSION_UNSUPPORTED: '[426] Mobile app older than `X-Min-App-Version` (ADR-014 §5); the app asks the user to update.'
    MAINTENANCE: '[503] Maintenance mode S-121 is ON (spec 16 AC-70). Not returned for admin, webhooks or health.'
    SERVICE_UNAVAILABLE: '[503] A dependency is down; retry later.'
    INTERNAL_ERROR: '[500] Unexpected error; `X-Request-Id` identifies it in the logs.'

# ───────────────────────── Pagination ─────────────────────────
NextCursor:
  type: [string, 'null']
  description: Opaque cursor for the next page, or null when this is the last page. Pass it back unchanged as `?cursor=`.

CursorPage:
  type: object
  description: |
    Base shape of every list response (CONVENTIONS §8). Concrete lists are named `<Item>Page` and use
    `allOf: [{$ref: CursorPage}, {properties: {data: {type: array, items: {$ref: <Item>}}}}]`.
  required: [data, nextCursor]
  properties:
    data:
      type: array
      items: {}
    nextCursor: {$ref: '#/NextCursor'}
    totalCount:
      type: [integer, 'null']
      minimum: 0
      description: Only present when the operation documents that it returns a total (e.g. admin queue counters); otherwise omitted.

# ───────────────────────── People ─────────────────────────
ImageVariants:
  type: object
  description: Public, processed image (bucket `public-media`, ADR-009). URLs are stable CDN URLs; no auth needed.
  required: [fileId, thumb, medium, large, width, height]
  properties:
    fileId: {$ref: '#/Uuid'}
    thumb: {$ref: '#/HttpUrl'}
    medium: {$ref: '#/HttpUrl'}
    large: {$ref: '#/HttpUrl'}
    width: {type: [integer, 'null']}
    height: {type: [integer, 'null']}

UserSummary:
  type: object
  description: |
    Minimal public view of another user, embedded wherever a user appears (seller, buyer, author, other
    party). Owned by D1 for semantics. **Never masked**: where the username-masking rule applies (project
    owner shown to guests and non-Premium users, BR-015, spec 02 AC-41, spec 10 R-P6) the API returns
    `MaskedUserSummary` instead, which carries no id and no real username.
  required: [id, username, avatar, isPremium, isIdVerified, isOnline, countryCode, isDeleted]
  properties:
    id: {$ref: '#/Uuid'}
    username: {type: string}
    avatar:
      oneOf: [{$ref: '#/ImageVariants'}, {type: 'null'}]
    isPremium:
      type: boolean
      description: Shows the Premium / "Featured" mark (Q-069).
    isIdVerified:
      type: boolean
      description: KYC approved (spec 02 AC-36).
    isOnline:
      type: boolean
      description: Active in the last 10 minutes (BR-012).
    countryCode:
      oneOf: [{$ref: '#/CountryCode'}, {type: 'null'}]
    isDeleted:
      type: boolean
      description: Deleted accounts are shown with a neutral label (spec 08 "Deleted users").

MaskedUserSummary:
  type: object
  description: |
    A user shown under the username-masking rule (BR-015, spec 02 AC-41, spec 10 R-P6, Q-069b): the owner
    (client) of a project on project pages and project lists. For guests and for signed-in users who are
    neither Premium nor the owner, `displayUsername` is masked (`mytask` → `my**sk`), `usernameMasked` is
    true and `user` is **null** — the API never returns the real username or the user id to such viewers,
    so no profile link can be built. For the owner and Premium viewers `usernameMasked` is false and
    `user` is the full `UserSummary`. (Integration run: promoted from D5 `ProjectClient`; used by D5
    project reads and D2 `searchProjects`.)
  required: [displayUsername, usernameMasked, avatar, isIdVerified, countryCode, user]
  properties:
    displayUsername: {type: string}
    usernameMasked: {type: boolean}
    avatar:
      oneOf: [{$ref: '#/ImageVariants'}, {type: 'null'}]
    isIdVerified: {type: boolean}
    countryCode:
      oneOf: [{$ref: '#/CountryCode'}, {type: 'null'}]
    user:
      oneOf: [{$ref: '#/UserSummary'}, {type: 'null'}]
      description: Full summary only for the owner and Premium viewers.

ModerationOwnerSummary:
  type: object
  description: |
    Owner summary shown next to every moderation-queue item and on admin item details (spec 16 AC-19):
    account status, restriction, plan, KYC state, number of reports about the user and earlier staff
    rejections of items of the same kind. One shape for every queue (D1 portfolio/KYC/appeals, D2 gigs,
    D4 custom offers, D5 projects/proposals). Semantics owned by D1. (Integration run: replaces
    `AdminUserOwnerSummary`, `AdminGigOwnerSummary`, `AdminProjectOwnerSummary`.)
  required: [user, status, isRestricted, isDeleted, plan, kycStatus, reportCount, earlierRejectionCount]
  properties:
    user: {$ref: '#/UserSummary'}
    status: {$ref: '../schemas/d1.yaml#/UserStatus'}
    isRestricted: {type: boolean}
    isDeleted: {type: boolean}
    plan: {$ref: '#/PlanCode'}
    kycStatus: {$ref: '../schemas/d1.yaml#/KycState'}
    reportCount:
      type: integer
      minimum: 0
      description: Open (not yet decided) reports about this user and the user's gigs, projects and proposals (queue `adminListReports`).
    earlierRejectionCount:
      type: integer
      minimum: 0
      description: Earlier staff rejections of items of the same kind as the queue item (gigs, portfolio items, projects, proposals, offers, KYC, appeals).

StaffSummary:
  type: object
  description: A staff member as shown in admin views and audit entries. Users never see staff identities; to users staff appear as "MyTask".
  required: [id, username, fullName]
  properties:
    id: {$ref: '#/Uuid'}
    username: {type: string}
    fullName: {type: string}

ActorRef:
  type: object
  description: Who did something (timelines, audit, messages). `system` = background job (auto-release, expiry…).
  required: [type, user, staff]
  properties:
    type: {type: string, enum: [user, staff, system]}
    user:
      oneOf: [{$ref: '#/UserSummary'}, {type: 'null'}]
    staff:
      oneOf: [{$ref: '#/StaffSummary'}, {type: 'null'}]
      description: Only filled in admin responses; user-facing responses show staff as "MyTask" with `staff = null`.

# ───────────────────────── Catalog / item references ─────────────────────────
CategoryRef:
  type: object
  description: Reference to a gig category (any level) or project category / skill. Full objects are owned by D2.
  required: [id, slug, name, contentLocale]
  properties:
    id: {$ref: '#/Uuid'}
    slug: {type: string}
    name: {type: string}
    contentLocale: {$ref: '#/ContentLocale'}

GigRef:
  type: object
  description: Minimal gig reference (cart lines, order items, reviews, reports). Full gig objects are owned by D2.
  required: [id, uid, slug, title, contentLocale, thumbnail]
  properties:
    id: {$ref: '#/Uuid'}
    uid:
      type: string
      description: Legacy public id (20 chars) used in `/service/{slug}` (P-33).
    slug: {type: string}
    title: {type: string}
    contentLocale: {$ref: '#/ContentLocale'}
    thumbnail:
      oneOf: [{$ref: '#/ImageVariants'}, {type: 'null'}]

ProjectRef:
  type: object
  description: Minimal project reference. Full project objects are owned by D5.
  required: [id, pid, slug, title, contentLocale]
  properties:
    id: {$ref: '#/Uuid'}
    pid:
      type: string
      pattern: '^[0-9]{6}$'
      description: Legacy public number used in `/project/{pid}/{slug}`.
    slug: {type: string}
    title: {type: string}
    contentLocale: {$ref: '#/ContentLocale'}

WorkItemType:
  type: string
  enum: [order_item, contract_payment, custom_offer]
  description: The three things a buyer pays for and that own one escrow each (data-model §3.I).

WorkItemRef:
  type: object
  description: |
    Reference to a paid unit of work (gig order item, project contract payment, custom offer). Used by
    payments, transactions, HOLD lists, refunds, unblock requests, reviews and notifications to link to
    the item without depending on another group's full schema. `displayId` is what users see
    (order item uid, project pid, offer uid).
  required: [type, id, displayId, title, escrowId, orderId, contractId, project, gig]
  properties:
    type: {$ref: '#/WorkItemType'}
    id:
      $ref: '#/Uuid'
      description: order item id, contract payment id or custom offer id (by `type`).
    displayId: {type: string}
    title:
      type: string
      description: Snapshot title (gig title, project title, offer description excerpt).
    escrowId:
      oneOf: [{$ref: '#/Uuid'}, {type: 'null'}]
      description: Null while awaiting payment (no escrow exists before a verified payment, ADR-003 §7).
    orderId:
      oneOf: [{$ref: '#/Uuid'}, {type: 'null'}]
      description: Set for `order_item`.
    contractId:
      oneOf: [{$ref: '#/Uuid'}, {type: 'null'}]
      description: Set for `contract_payment`.
    project:
      oneOf: [{$ref: '#/ProjectRef'}, {type: 'null'}]
    gig:
      oneOf: [{$ref: '#/GigRef'}, {type: 'null'}]

# ───────────────────────── Escrow (shared by D3, D4, D5) ─────────────────────────
EscrowKind:
  type: string
  enum: [gig_order_item, contract_payment, custom_offer, legacy_hold]

EscrowStatus:
  type: string
  enum: [funded, released, refunded]
  description: data-model §4.2. `funded` = money is on HOLD for the freelancer.

EscrowCloseReason:
  type: string
  enum: [completed_by_buyer, auto_release, admin_release, unblock_approved, dispute_release, canceled_before_start, refund_accepted_by_seller, refund_accepted_by_admin, dispute_refund, legacy_settlement]

AutoReleasePauseReason:
  type: string
  enum: [revision_requested, refund_open, dispute_open, auto_release_off]
  description: Why the 72h auto-release clock is not running (spec 06 AC-29…; `auto_release_off` = S-025 is OFF, derived, not stored).

EscrowSummary:
  type: object
  description: |
    The protected unit of money and work behind every paid item (data-model §3.I). Embedded by D4 (order
    items, custom offers) and D5 (contracts). Escrow operations (`/escrows/…`: deliveries, revision
    requests, completion) are owned by D4 and shared by all three item types.
  required: [id, kind, status, amount, fundedAt, closedAt, closeReason, revisionsAllowed, revisionsUsed, deliveryCount, lastDeliveredAt, autoReleaseAt, autoReleasePausedReason, refundOpen, disputeOpen]
  properties:
    id: {$ref: '#/Uuid'}
    kind: {$ref: '#/EscrowKind'}
    status: {$ref: '#/EscrowStatus'}
    amount:
      $ref: '#/Money'
      description: Freelancer amount P′ held (funded amount). Buyers never see an escrow balance of their own (Q-008).
    fundedAt: {$ref: '#/Timestamp'}
    closedAt:
      oneOf: [{$ref: '#/Timestamp'}, {type: 'null'}]
    closeReason:
      oneOf: [{$ref: '#/EscrowCloseReason'}, {type: 'null'}]
    revisionsAllowed: {type: integer, minimum: 0}
    revisionsUsed: {type: integer, minimum: 0}
    deliveryCount: {type: integer, minimum: 0}
    lastDeliveredAt:
      oneOf: [{$ref: '#/Timestamp'}, {type: 'null'}]
    autoReleaseAt:
      oneOf: [{$ref: '#/Timestamp'}, {type: 'null'}]
      description: Deadline of the automatic release (S-026 snapshot), null when not running.
    autoReleasePausedReason:
      oneOf: [{$ref: '#/AutoReleasePauseReason'}, {type: 'null'}]
    refundOpen: {type: boolean}
    disputeOpen: {type: boolean}

EscrowActions:
  type: object
  description: |
    What the caller may do on the escrow now (computed by the API for the caller; clients never re-derive rules,
    architecture.md §2). Shared by D4 order items, custom offers and escrows and D5 contract payment lines (integration run: promoted from D4). `…AvailableAt` explains a disabled button (spec 13 AC-1, AC-23).
  required: [canDeliver, canRequestRevision, revisionsLeft, canComplete, canRequestRefund, refundAvailableAt, canRequestUnblock, unblockAvailableAt]
  properties:
    canDeliver:
      type: boolean
      description: 'Freelancer; item in progress or revision requested (also while a dispute is open: evidence, spec 13 AC-13).'
    canRequestRevision:
      type: boolean
      description: Buyer; delivered, revisions left, no open dispute (spec 06 AC-25, AC-27).
    revisionsLeft: {type: integer, minimum: 0}
    canComplete:
      type: boolean
      description: Buyer; delivered and no open dispute (spec 06 AC-30…AC-32).
    canRequestRefund:
      type: boolean
      description: Buyer; eligible and no refund request yet (spec 13 AC-1…AC-4).
    refundAvailableAt:
      oneOf: [{$ref: '#/Timestamp'}, {type: 'null'}]
      description: Set while in progress before the expected delivery date (button disabled until then).
    canRequestUnblock:
      type: boolean
      description: Freelancer; spec 13 AC-23 conditions met now.
    unblockAvailableAt:
      oneOf: [{$ref: '#/Timestamp'}, {type: 'null'}]
      description: Latest delivery + S-028 hours while that time is in the future and unblock requests are available (text t_unblock_request_72_hour_wait).

# ───────────────────────── Payments (shared; endpoints owned by D3) ─────────────────────────
PaymentPurpose:
  type: string
  enum: [gig_order, contract_payment, custom_offer, topup, subscription, subscription_renewal]
  description: data-model §3.J. `subscription_renewal` is created only by the renewal job.

PaymentMethod:
  type: string
  enum: [bog_card, wallet, bank_transfer]
  description: Points are not a payment method (Q-052); Premium with points has its own operation (D3).

PaymentStatus:
  type: string
  enum: [created, pending, paid, paid_unapplied, failed, expired, canceled, rejected]
  description: data-model §4.3. Only `paid` and `paid_unapplied` have money effects.

PaymentSummary:
  type: object
  description: Minimal payment view embedded by other groups (e.g. an order awaiting payment shows its last payment). Full payment and receipt schemas are owned by D3.
  required: [id, purpose, method, status, total, createdAt, paidAt]
  properties:
    id: {$ref: '#/Uuid'}
    purpose: {$ref: '#/PaymentPurpose'}
    method: {$ref: '#/PaymentMethod'}
    status: {$ref: '#/PaymentStatus'}
    total: {$ref: '#/Money'}
    createdAt: {$ref: '#/Timestamp'}
    paidAt:
      oneOf: [{$ref: '#/Timestamp'}, {type: 'null'}]

FeeLine:
  type: object
  description: One fee computed by the Commission & Fee module (ADR-005 §6), snapshotted with its rule version. Used in quotes, receipts, withdrawals and admin previews.
  required: [feeCode, payer, amount, feeRuleVersionId]
  properties:
    feeCode:
      type: string
      description: fee_rules.code, e.g. `card_surcharge.bog`, `withdrawal.standard`, `gig_order.commission`.
    payer: {type: string, enum: [buyer, freelancer]}
    amount: {$ref: '#/Money'}
    rate:
      oneOf: [{$ref: '#/BasisPoints'}, {type: 'null'}]
      description: Percent rules only; null for fixed fees.
    feeRuleVersionId: {$ref: '#/Uuid'}

CheckoutTarget:
  description: |
    What a checkout pays for. The discriminator `purpose` selects the variant. Used by D3's
    `createCheckoutQuote` and `createPayment`. D4 and D5 do not define their own pay endpoints: they
    reference these operations (CONVENTIONS §5.4).
  oneOf:
    - {$ref: '#/GigOrderCheckoutTarget'}
    - {$ref: '#/ContractPaymentCheckoutTarget'}
    - {$ref: '#/CustomOfferCheckoutTarget'}
    - {$ref: '#/TopupCheckoutTarget'}
    - {$ref: '#/SubscriptionCheckoutTarget'}
  discriminator:
    propertyName: purpose
    mapping:
      gig_order: '#/GigOrderCheckoutTarget'
      contract_payment: '#/ContractPaymentCheckoutTarget'
      custom_offer: '#/CustomOfferCheckoutTarget'
      topup: '#/TopupCheckoutTarget'
      subscription: '#/SubscriptionCheckoutTarget'

GigOrderCheckoutTarget:
  type: object
  description: |
    `source = cart`: check out the caller's server-side cart (spec 06 AC-6…AC-9; the cart lines are
    re-validated). `source = order`: pay again for an existing order still awaiting payment, at its
    stored prices (spec 06 AC-11); `orderId` required.
  required: [purpose, source]
  properties:
    purpose: {type: string, const: gig_order}
    source: {type: string, enum: [cart, order]}
    orderId:
      $ref: '#/Uuid'
      description: Required when `source = order`.

ContractPaymentCheckoutTarget:
  type: object
  description: The one escrow payment of an accepted project contract (spec 11 "One escrow payment").
  required: [purpose, contractPaymentId]
  properties:
    purpose: {type: string, const: contract_payment}
    contractPaymentId: {$ref: '#/Uuid'}

CustomOfferCheckoutTarget:
  type: object
  description: Accept-and-pay of a sent custom offer (spec 12 "Buyer's answer").
  required: [purpose, customOfferId]
  properties:
    purpose: {type: string, const: custom_offer}
    customOfferId: {$ref: '#/Uuid'}

TopupCheckoutTarget:
  type: object
  description: Wallet top-up of `amount` A (credited amount; limits S-023/S-024 apply to A, spec 05 AC-21/22).
  required: [purpose, amount]
  properties:
    purpose: {type: string, const: topup}
    amount: {$ref: '#/Money'}

SubscriptionCheckoutTarget:
  type: object
  description: Premium purchase by card (spec 09; ADR-016 for mobile, S-126). A promo code travels as the top-level `promoCode` of the quote / payment request (never inside the target), so every purpose can answer `PROMO_NOT_APPLICABLE` (spec 05 AC-40).
  required: [purpose, plan, billingPeriod]
  properties:
    purpose: {type: string, const: subscription}
    plan: {type: string, const: premium}
    billingPeriod: {$ref: '#/BillingPeriod'}

# ───────────────────────── Chat references (endpoints owned by D5) ─────────────────────────
ConversationKind:
  type: string
  enum: [direct, order_item, project, custom_offer, refund]
  description: data-model §3.N / spec 08 R-M2.

ConversationRef:
  type: object
  description: Link from a resource to its thread (order item delivery thread, project thread, offer thread, refund/dispute thread). Messages are read and written through D5's `/conversations/{conversationId}/messages`.
  required: [id, kind, unreadCount]
  properties:
    id: {$ref: '#/Uuid'}
    kind: {$ref: '#/ConversationKind'}
    unreadCount:
      type: integer
      minimum: 0
      description: For the caller; 0 in admin responses.

# ───────────────────────── Reviews reference (endpoints owned by D2) ─────────────────────────
ReviewRef:
  type: object
  description: Embedded on order items, contracts and offers to show whether a review exists (spec 07). Full review objects are owned by D2.
  required: [id, rating, authorRole]
  properties:
    id: {$ref: '#/Uuid'}
    rating: {type: integer, minimum: 1, maximum: 5}
    authorRole: {type: string, enum: [buyer, freelancer]}

RatingSummary:
  type: object
  description: |
    Average and count of visible reviews (spec 07 R-V5, P-56) — the one rating shape of the whole API
    (gig cards, gig page, profile blocks, sellers lists, proposal cards, home best sellers). The exact
    average is kept on the server (filters and sorting use it, spec 03 AC-9); the API returns it as an
    integer in **tenths**, rounded half up, which is exactly the one-decimal display value of P-56
    (4.33 → `43`, shown "4.3"). No floats in the contract (CONVENTIONS §9.1). Null when `count` is 0
    (clients show `t_no_reviews_yet`).
  required: [count, averageTenths]
  properties:
    count: {type: integer, minimum: 0}
    averageTenths:
      type: [integer, 'null']
      minimum: 10
      maximum: 50
      description: Average stars × 10, half up (43 = 4.3). Null without reviews.

RatingStarCounts:
  type: object
  description: Number of visible reviews per star value (spec 07 AC-11, AC-12, AC-14; spec 02 AC-10). Hidden reviews are never counted.
  required: [five, four, three, two, one]
  properties:
    five: {type: integer, minimum: 0}
    four: {type: integer, minimum: 0}
    three: {type: integer, minimum: 0}
    two: {type: integer, minimum: 0}
    one: {type: integer, minimum: 0}

RatingBlock:
  description: One rating block with its star breakdown ("As a freelancer" / "As a client", spec 02 AC-10, spec 07 AC-11, AC-12).
  allOf:
    - $ref: '#/RatingSummary'
    - type: object
      required: [starCounts]
      properties:
        starCounts: {$ref: '#/RatingStarCounts'}

# ───────────────────────── Reports (created by domain groups, queue owned by D6) ─────────────────────────
ReportTargetType:
  type: string
  enum: [user, gig, project, proposal]
  description: The four reportable things (spec 16 AC-28, one queue P-118). Creation endpoints live with the owning resource (CONVENTIONS §5.5).

# ───────────────────────── Staff actions (shared request bodies) ─────────────────────────
StaffReasonRequest:
  type: object
  description: Body for staff decisions that need a reason (reject, remove, hide, ban…). Shown to the owner unless the operation says it is internal (spec 16 AC-19).
  required: [reason]
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 1000

StaffOptionalNoteRequest:
  type: object
  description: Body for staff decisions where a note is optional (approve, publish…).
  properties:
    note:
      type: [string, 'null']
      maxLength: 1000

# ───────────────────────── Files (ADR-009; endpoints in the foundation file f0-files.yaml) ─────────────────────────
FilePurpose:
  type: string
  description: |
    Upload purpose (data-model §3.Q). The purpose decides bucket, allowed types and size (settings
    register S-077…S-099, S-037…S-040) and who may attach the file where. User purposes use
    `createFileUpload`; staff purposes (`category_image`, `blog_image`, `home_logo`) use
    `adminCreateFileUpload`.
  enum: [avatar, gig_image, gig_thumbnail, gig_document, portfolio_image, category_image, blog_image, project_thumbnail, project_file, delivery, chat_attachment, offer_attachment, appeal_file, kyc_document, home_logo]

FileStatus:
  type: string
  enum: [pending, scanning, ready, rejected, deleted]

FileUploadRequest:
  type: object
  required: [purpose, fileName, sizeBytes, contentType]
  properties:
    purpose: {$ref: '#/FilePurpose'}
    fileName:
      type: string
      minLength: 1
      maxLength: 255
    sizeBytes:
      type: integer
      format: int64
      minimum: 1
    contentType:
      type: string
      maxLength: 127
      examples: [image/jpeg]
    context:
      type: [object, 'null']
      description: |
        Optional context the policy needs, e.g. `{escrowId}` for a delivery (only the freelancer of that
        escrow may upload), `{conversationId}` for a chat attachment. Keys are camelCase ids.
      additionalProperties: {type: string}

FileUploadTicket:
  type: object
  description: A presigned POST (direct upload to S3-compatible storage, `quarantine/` prefix). The client sends a `multipart/form-data` POST to `url` with every `fields` entry followed by the file field `file`, then calls `completeFileUpload`.
  required: [file, upload]
  properties:
    file: {$ref: '#/File'}
    upload:
      type: object
      required: [url, method, fields, expiresAt]
      properties:
        url: {$ref: '#/HttpUrl'}
        method: {type: string, const: POST}
        fields:
          type: object
          additionalProperties: {type: string}
        expiresAt: {$ref: '#/Timestamp'}

File:
  type: object
  description: |
    An uploaded file. Only `ready` files can be attached (ADR-009 §3.6). Public images expose `image`
    (CDN variants); private files are downloaded through `getFileDownload` (302 to a short-lived
    signed URL after a policy check).
  required: [id, purpose, status, fileName, contentType, sizeBytes, rejectReason, image, createdAt, readyAt]
  properties:
    id: {$ref: '#/Uuid'}
    purpose: {$ref: '#/FilePurpose'}
    status: {$ref: '#/FileStatus'}
    fileName: {type: string}
    contentType:
      type: string
      description: Detected type once scanned; declared type before.
    sizeBytes: {type: integer, format: int64}
    rejectReason:
      type: [string, 'null']
      description: Localized reason when `rejected` (type mismatch, virus, too large).
    image:
      oneOf: [{$ref: '#/ImageVariants'}, {type: 'null'}]
      description: Set for ready public images only.
    createdAt: {$ref: '#/Timestamp'}
    readyAt:
      oneOf: [{$ref: '#/Timestamp'}, {type: 'null'}]

SignedUrl:
  type: object
  description: A short-lived presigned download URL (ADR-009 §4). Never cache it; request a new one when expired.
  required: [url, expiresAt]
  properties:
    url: {$ref: '#/HttpUrl'}
    expiresAt: {$ref: '#/Timestamp'}

Attachment:
  type: object
  description: A private file attached to something (delivery, message, offer, project, appeal). Download with `getFileDownload` (users) or the owning group's admin download operation (staff).
  required: [fileId, fileName, contentType, sizeBytes]
  properties:
    fileId: {$ref: '#/Uuid'}
    fileName: {type: string}
    contentType: {type: string}
    sizeBytes: {type: integer, format: int64}

# ───────────────────────── Realtime ─────────────────────────
RealtimeEnvelope:
  type: object
  description: |
    Every Socket.IO event payload is wrapped in this envelope (docs/04-api/realtime.md). `data` is the
    event's payload schema named `<EventName>Event` in the owning group's schema file.
  required: [event, id, occurredAt, data]
  properties:
    event:
      type: string
      pattern: '^[a-z_]+(\.[a-z_]+)+$'
      examples: [message.created]
    id:
      $ref: '#/Uuid'
      description: Event id (deduplicate on reconnect).
    occurredAt: {$ref: '#/Timestamp'}
    data:
      type: object

FileProcessedEvent:
  type: object
  description: 'Foundation event `file.processed` (room `user:{ownerUserId}` or `staff:{staffId}`): the scan of an upload finished (`ready` or `rejected`).'
  required: [file]
  properties:
    file: {$ref: '#/File'}
