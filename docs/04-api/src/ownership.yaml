# Ownership map for the parallel P2-B4 group runs (machine-readable; enforced by scripts/build-root.mjs
# and scripts/check-contract.mjs). Human explanation: docs/04-api/CONVENTIONS.md §4 and §5.
# Owned by the foundation/integration architect run. Group runs must NOT edit this file.
#
# Path ownership: a path belongs to the group whose prefix is the LONGEST match
# (`/webhooks/bog` → D3 even though nobody owns `/webhooks`). A prefix matches the path itself and
# everything below it (`/gigs` matches `/gigs`, `/gigs/{gigId}`, `/gigs/{gigId}/reports`).
# Admin rule (CONVENTIONS §4.2): the group that owns a resource also owns `/admin/<resource>`.
# Nested cross-group paths are not allowed: use a filter (`?userId=`, `?gigId=`) on your own list instead.

groups:
  F0:
    title: Foundation (shared infrastructure, written in part 1)
    pathFile: f0-files.yaml
    schemaFile: null            # shared schemas live in components/schemas.yaml
    specs: []
    pathPrefixes: [/files, /admin/files]
    errorPrefixes: []
    schemaPrefixes: []

  D1:
    title: Platform settings (public), auth, accounts, profiles, dashboards, KYC
    pathFile: d1-platform-auth-profiles.yaml
    schemaFile: d1.yaml
    eventFile: d1.yaml
    specs: ['00', '01', '02']
    pathPrefixes:
      - /health
      - /config
      - /i18n
      - /auth
      - /me
      - /users
      - /portfolio-items
      - /kyc
      - /restriction-appeals
      - /admin/users
      - /admin/portfolio-items
      - /admin/kyc
      - /admin/restrictions
      - /admin/restriction-appeals
      - /admin/ip-bans
    errorPrefixes: [AUTH_, ACCOUNT_, USER_, PROFILE_, PORTFOLIO_, KYC_, RESTRICTION_, APPEAL_, IP_BAN_, EMAIL_, PASSWORD_, TWO_FACTOR_, SESSION_]
    schemaPrefixes: [Auth, Login, Logout, Register, Registration, Session, Device, TwoFactor, Password, Social, Email, Me, Account, User, Profile, Portfolio, Kyc, Restriction, Appeal, IpBan, Dashboard, PublicConfig, I18n, Health, Availability, UsernameMask]

  D2:
    title: Categories, search, gigs, reviews, content and SEO
    pathFile: d2-catalog-gigs-reviews-content.yaml
    schemaFile: d2.yaml
    eventFile: d2.yaml
    specs: ['03', '04', '07', '17']
    pathPrefixes:
