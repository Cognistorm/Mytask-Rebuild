# Operations other groups may reference by name BEFORE they exist (coverage rows, descriptions).
# The owning group MUST create each one with exactly this operationId, method and path.
reservedOperations:
  # F0 (already written in src/paths/f0-files.yaml)
  createFileUpload:            {group: F0, method: post,   path: /files}
  getFile:                     {group: F0, method: get,    path: '/files/{fileId}'}
  deleteFile:                  {group: F0, method: delete, path: '/files/{fileId}'}
  completeFileUpload:          {group: F0, method: post,   path: '/files/{fileId}/complete'}
  getFileDownload:             {group: F0, method: get,    path: '/files/{fileId}/download'}
  adminCreateFileUpload:       {group: F0, method: post,   path: /admin/files}
  adminGetFile:                {group: F0, method: get,    path: '/admin/files/{fileId}'}
  adminCompleteFileUpload:     {group: F0, method: post,   path: '/admin/files/{fileId}/complete'}
  # D1
  getHealth:                   {group: D1, method: get,    path: /health}
  getPublicConfig:             {group: D1, method: get,    path: /config/public}
  getI18nBundle:               {group: D1, method: get,    path: '/i18n/{locale}'}
  login:                       {group: D1, method: post,   path: /auth/login}
  refreshSession:              {group: D1, method: post,   path: /auth/refresh}
  logout:                      {group: D1, method: post,   path: /auth/logout}
  getMe:                       {group: D1, method: get,    path: /me}
  getUserProfile:              {group: D1, method: get,    path: '/users/{username}'}
  adminGetUser:                {group: D1, method: get,    path: '/admin/users/{userId}'}
  adminListUsers:              {group: D1, method: get,    path: /admin/users}
  # D2
  createReview:                {group: D2, method: post,   path: /reviews}
  listReviews:                 {group: D2, method: get,    path: /reviews}
  resolveRedirect:             {group: D2, method: get,    path: /redirects/resolve}
  # D3
  createCheckoutQuote:         {group: D3, method: post,   path: /checkout/quote}
  createPayment:               {group: D3, method: post,   path: /payments}
  getPayment:                  {group: D3, method: get,    path: '/payments/{paymentId}'}
  handleBogWebhook:            {group: D3, method: post,   path: /webhooks/bog}
  # D4
  getEscrow:                   {group: D4, method: get,    path: '/escrows/{escrowId}'}
  listEscrowDeliveries:        {group: D4, method: get,    path: '/escrows/{escrowId}/deliveries'}
  createEscrowDelivery:        {group: D4, method: post,   path: '/escrows/{escrowId}/deliveries'}
  createEscrowRevisionRequest: {group: D4, method: post,   path: '/escrows/{escrowId}/revision-requests'}
  completeEscrow:              {group: D4, method: post,   path: '/escrows/{escrowId}/complete'}
  createRefundRequest:         {group: D4, method: post,   path: /refund-requests}
  createUnblockRequest:        {group: D4, method: post,   path: /unblock-requests}
  adminListEscrows:            {group: D4, method: get,    path: /admin/escrows}
  adminReleaseEscrow:          {group: D4, method: post,   path: '/admin/escrows/{escrowId}/release'}
  adminRefundEscrow:           {group: D4, method: post,   path: '/admin/escrows/{escrowId}/refund'}
  # D5
  getConversation:             {group: D5, method: get,    path: '/conversations/{conversationId}'}
  listConversationMessages:    {group: D5, method: get,    path: '/conversations/{conversationId}/messages'}
  createConversationMessage:   {group: D5, method: post,   path: '/conversations/{conversationId}/messages'}
  adminGetConversation:        {group: D5, method: get,    path: '/admin/conversations/{conversationId}'}
  adminListConversationMessages:  {group: D5, method: get,  path: '/admin/conversations/{conversationId}/messages'}
  adminCreateConversationMessage: {group: D5, method: post, path: '/admin/conversations/{conversationId}/messages'}
  # D6
  adminLogin:                  {group: D6, method: post,   path: /admin/auth/login}
  adminRefreshSession:         {group: D6, method: post,   path: /admin/auth/refresh}
  adminLogout:                 {group: D6, method: post,   path: /admin/auth/logout}
  adminReauthenticate:         {group: D6, method: post,   path: /admin/auth/reauth}
  adminGetMe:                  {group: D6, method: get,    path: /admin/me}
  adminListSettings:           {group: D6, method: get,    path: /admin/settings}
  adminUpdateSetting:          {group: D6, method: patch,  path: '/admin/settings/{key}'}
  adminListReports:            {group: D6, method: get,    path: /admin/reports}
  listNotifications:           {group: D6, method: get,    path: /notifications}
  ingestAnalyticsEvents:       {group: D6, method: post,   path: /analytics/events}

# Spec 16 (admin panel) ACs implemented by a group other than D6. D6 writes coverage/16.md with a
# DELEGATED row for each; the listed group writes coverage/16-<group>.md with the real rows.
# AC-19 (generic queue rules) and AC-31 (user page tabs, via ?userId= filters) apply to every group
# that owns an admin list; each such group adds its own AC-19/AC-31 rows.
spec16Delegations:
  D1: [19, 21, 27, 29, 30, 31, 32, 33, 34, 35]
  D2: [19, 20, 25, 26, 31, 60, 61, 62, 63]
  D3: [31, 32, 36, 37, 42, 43, 44, 45, 57, 58, 59]
  D4: [19, 24, 31, 38, 39, 40, 41]
  D5: [19, 22, 23, 31, 38, 65]

