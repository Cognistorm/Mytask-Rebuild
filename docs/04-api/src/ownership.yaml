      - /project-categories
      - /skills
      - /countries
      - /search
      - /sellers
      - /hire
      - /gigs
      - /favorites
      - /reviews
      - /pages
      - /blog
      - /contact-messages
      - /newsletter
      - /home
      - /seo
      - /sitemaps
      - /redirects
      - /outbound-links
      - /admin/gigs
      - /admin/reviews
      - /admin/categories
      - /admin/project-categories
      - /admin/skills
      - /admin/countries
      - /admin/pages
      - /admin/blog
      - /admin/blog-comments
      - /admin/newsletter
      - /admin/support-messages
      - /admin/home
      - /admin/redirects
    errorPrefixes: [CATEGORY_, SKILL_, COUNTRY_, SEARCH_, GIG_, FAVORITE_, REVIEW_, PAGE_, BLOG_, COMMENT_, CONTACT_, NEWSLETTER_, SEO_, SITEMAP_, REDIRECT_, OUTBOUND_, HOME_]
    schemaPrefixes: [Category, ProjectCategory, Skill, Country, Search, Seller, Hire, Gig, Favorite, Review, Page, Blog, Comment, Contact, SupportMessage, Newsletter, Home, Seo, Sitemap, Redirect, Outbound]

  D3:
    title: Payments, wallet, BOG webhook, subscriptions, points, referrals, promo codes, withdrawals
    pathFile: d3-payments-subscriptions-withdrawals.yaml
    schemaFile: d3.yaml
    eventFile: d3.yaml
    specs: ['05', '09', '14']
    pathPrefixes:
      - /checkout
      - /payments
      - /webhooks/bog
      - /wallet
      - /saved-cards
      - /billing-profile
      - /plans
      - /subscriptions
      - /points
      - /referrals
      - /promo-codes
      - /withdrawals
      - /payout-methods
      - /admin/payments
      - /admin/bank-transfers
      - /admin/ledger
      - /admin/reconciliation
      - /admin/legacy-holds
      - /admin/withdrawals
      - /admin/plans
