    errorPrefixes: [NOTIFICATION_, PUSH_, PREFERENCE_, ANALYTICS_, STAFF_, ROLE_, PERMISSION_, AUDIT_, SETTING_, FEE_, TRANSLATION_, CUSTOM_CODE_, REPORT_, SYSTEM_, EXPORT_, WEBHOOK_SENDGRID_]
