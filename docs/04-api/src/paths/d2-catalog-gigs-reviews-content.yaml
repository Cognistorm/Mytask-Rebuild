  get:
    operationId: listBlogComments
    summary: Published comments of an article
    description: Newest first, 40 per page (clients send `limit=40`), with the stored full name, avatar and date (spec 17 AC-18). S-117 or S-118 OFF → 403 FEATURE_DISABLED (no comment section).
    tags: [Blog]
    security: []
