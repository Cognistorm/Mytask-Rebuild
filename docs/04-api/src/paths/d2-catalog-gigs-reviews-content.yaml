    operationId: confirmNewsletterSubscription
    summary: Confirm a newsletter address with the emailed token
    description: 'Called by the `/newsletter/verify?token=…` page (the legacy `?id=…` value is sent as `token`). Valid token → confirmed, EV-119 `NewsletterApproved` (with unsubscribe link), `t_newsletter_confirmed`. Invalid, used or expired → 422 NEWSLETTER_TOKEN_INVALID (`t_newsletter_link_invalid`; legacy tokens were not migrated, EC-5) (spec 17 AC-31).'
    tags: [Newsletter]
    security: []
    x-permission: {audience: public}
