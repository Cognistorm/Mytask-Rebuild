    operationId: createContactMessage
    summary: Send a contact-form message
    description: |
      Stores name, email, subject, message, user id if signed in, page language (`Accept-Language`), IP and
      user agent; answers `t_your_message_support_received_success`; sends EV-116 to every S-100 address
      with the message text (spec 17 AC-23, AC-24). Accepted from banned or logged-out users (EC-8). Web
      sends `captchaToken` while S-061 is ON (missing or low score → `400 VALIDATION_FAILED` field `captchaToken`, messageKey `t_validator_recaptcha`, same as D1 auth forms); mobile relies on the
