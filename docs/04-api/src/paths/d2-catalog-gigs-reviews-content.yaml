# ═════════════════════════ Newsletter (spec 17 E) ═════════════════════════
/newsletter/subscriptions:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: createNewsletterSubscription
    summary: Sign up for the newsletter (double opt-in)
    description: |
      Invalid email → 400 field `email` `t_pls_enter_valid_email_address` (AC-29). Otherwise always the same
      answer `t_we_sent_verification_link_newsletter` whatever the address state: new, pending or
      unsubscribed → a new token valid 7 days (earlier ones stop working) and EV-118 in the page language;
      confirmed → no email (AC-30, P-131). S-120 OFF → 403 FEATURE_DISABLED (AC-28). At most 3 sign-ups per
      email and 10 per IP per hour → 429. Web only (no sign-up in the app, P-131).
    tags: [Newsletter]
    security: []
    x-permission: {audience: public, toggles: [S-120]}
    x-covers: ['17 AC-28', '17 AC-29', '17 AC-30']
    x-notifications: [EV-118]
    x-rate-limit: 3 requests / 1 h per email and 10 / 1 h per IP
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d2.yaml#/NewsletterSubscriptionCreateRequest'}
    responses:
      '202':
        description: Accepted (same body in every case).
        content:
          application/json:
            schema: {$ref: '../schemas/d2.yaml#/NewsletterSubscriptionResult'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

