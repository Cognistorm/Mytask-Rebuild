    parameters:
      - {name: slug, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 160}}
    responses:
      '200':
        description: The page.
        content:
          application/json:
            schema: {$ref: '../schemas/d2.yaml#/PageDetail'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

