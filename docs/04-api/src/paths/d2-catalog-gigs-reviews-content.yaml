          schema: {$ref: '../schemas/d2.yaml#/NewsletterTokenRequest'}
    responses:
      '200':
        description: Confirmed.
        content:
          application/json:
            schema: {$ref: '../schemas/d2.yaml#/NewsletterTokenResult'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/newsletter/unsubscriptions:
  parameters:
