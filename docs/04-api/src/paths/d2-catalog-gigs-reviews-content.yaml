      layout `landing` (AC-46). Unknown or inactive slug → 404 (the web then asks `resolveRedirect` for
      an old slug, AC-10). External-link pages return `externalUrl` and the web answers 302 (AC-7).
      English without English content → Georgian text, `contentLocale: ka`, 200 (AC-4). Terms and
      Privacy carry the clause flag and "Last updated" (AC-11). Mobile renders the same content natively (AC-13).
    tags: [Content]
