      to the article; restricted/banned → 403, spec 01 AC-19). Plain text 1–1,500. S-074 ON → `published`
      (`t_ur_comment_has_been_successfully_added`); OFF → `pending` (`t_ur_comment_will_be_published_soon`)
      and EV-115 to every S-100 address. S-118 is enforced on the server (fixes D-17-3). At most 5 per user
      per 10 minutes → 429 RATE_LIMITED `t_too_many_requests_try_later` (spec 17 AC-18, AC-19).
