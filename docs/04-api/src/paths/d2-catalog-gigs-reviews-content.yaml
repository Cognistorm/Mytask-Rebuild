# ═════════════════════════ SEO: sitemap, redirects, outbound links (spec 17 A, H, I) ═════════════════════════
/sitemaps:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: getSitemapIndex
    summary: Sitemap index data
    description: |
      Parts of url-map §9 with their last change (spec 17 AC-43). Read by the Next.js route handler of
      `/sitemap.xml` (cached 1 hour, ADR-008 §6). S-116 OFF → 404 NOT_FOUND, and the web serves
      `/sitemap.xml` as 404 and omits the robots `Sitemap:` line (AC-44). Non-production environments are
      handled by the web (AC-40).
    tags: [SEO]
    security: []
    x-permission: {audience: public, notes: 'S-116 OFF → 404 (not 403), spec 17 AC-44'}
    x-covers: ['17 AC-43', '17 AC-44']
    x-settings: [S-116]
    responses:
      '200':
        description: The parts.
        content:
          application/json:
            schema: {$ref: '../schemas/d2.yaml#/SitemapIndex'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/sitemaps/{part}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: part
      in: path
      required: true
      schema: {$ref: '../schemas/d2.yaml#/SitemapPartName'}
  get:
    operationId: getSitemapPart
    summary: One sitemap part (≤ 10,000 URLs)
    description: |
      Georgian paths with `lastModifiedAt` and whether English content exists (the `en` alternate is listed
      only then, spec 17 AC-4, AC-43). Only public, indexable items: active gigs of listable owners,
      projects active/completed, active CMS pages, published articles, categories, hire skills with at
      least one listable user, profiles of active/verified users with an active gig, a public portfolio
      item or a visible review (AC-41, P-133). Feature-disabled areas (blog S-117 OFF, projects S-075 OFF)
      are left out. Changes appear within 1 hour. S-116 OFF or unknown part → 404.
    tags: [SEO]
    security: []
    x-permission: {audience: public, notes: 'S-116 OFF → 404'}
    x-covers: ['17 AC-4', '17 AC-41', '17 AC-43', '17 AC-44']
    x-settings: [S-075, S-116, S-117]
    responses:
      '200':
        description: The part.
        content:
          application/json:
            schema: {$ref: '../schemas/d2.yaml#/SitemapPart'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/redirects/resolve:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: resolveRedirect
    summary: Resolve an old or legacy URL (web middleware look-up)
    description: |
      The data-dependent part of the redirect table (url-map §10; the static rules live in the web
      middleware). Answers in one hop:
      - gig slug → current slug by uid (301; 404 when missing/not public) (spec 04 AC-33, P-33, url-map §4.1);
      - project `/project/{pid}[/{slug}]` → current slug by pid; portfolio slug by uid (spec 17 AC-3);
      - old slugs of CMS pages, blog articles and gig categories after staff slug changes → current URL
        (301, spec 17 AC-10, EC-3);
      - legacy dashboard deep links with numeric ids (`/account/orders/requirements?orderId=&itemId=`,
        `/account/reviews/create/{id}`, `/seller/orders/details/{id}`, `/inbox/{legacyUserId}`, …) → the new
        uid paths (url-map §5);
      - removed features → 410 where url-map §6 says so.
      `location` keeps the language prefix of `path`; the web re-adds tracking parameters.
    tags: [SEO]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission: {audience: optional-user, ownership: 'none (dashboard look-ups resolve only items the signed-in caller takes part in; otherwise 404)'}
    x-covers: ['17 AC-2', '17 AC-3', '17 AC-10', '04 AC-33']
    parameters:
      - name: path
        in: query
        required: true
        description: The requested path with its query string, e.g. `/en/service/old-slug-B1FC0AABEEF8071D2AC2`.
        schema: {type: string, minLength: 1, maxLength: 2000, pattern: '^/'}
    responses:
      '200':
        description: The resolution.
        content:
          application/json:
            schema: {$ref: '../schemas/d2.yaml#/RedirectResolution'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}

/outbound-links/verify:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: verifyOutboundLink
    summary: Check a /redirect interstitial link
    description: |
      The `/redirect?to=&sig=` page (spec 17 AC-47, P-134) shows the destination only if `to` is http/https and
      `sig` is the server signature of it; otherwise 422 OUTBOUND_LINK_INVALID (`t_redirect_link_invalid`, also
      for legacy encrypted values).
      **Mandatory rules for every client (SEC-19; the signature proves only that the URL was well-formed, since
      anyone may sign a URL, so these rules are what keeps `/redirect` from being an open redirect):**
      1. The page **never redirects by itself** (no meta refresh, no script redirect, no timer, no HTTP 3xx);
         only the user's click on Continue opens the destination (web: `rel="noopener noreferrer nofollow"`,
         mobile: the warning dialog, then the system browser).
      2. It shows the **full destination**, with the host decoded from punycode and shown prominently
         (`host`), so look-alike domains are visible.
      3. Only `http`/`https` destinations are accepted (the API refuses anything else).
      4. The page is `noindex, nofollow` and excluded from the sitemap (url-map).
      Stored content should preferably be linkified on the server (hrefs already signed) rather than by clients.
    tags: [SEO]
    security: []
    x-permission: {audience: public}
    x-covers: ['17 AC-47']
    parameters:
      - {name: to, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 2000}}
      - {name: sig, in: query, required: false, schema: {type: string, maxLength: 200}}
    responses:
      '200':
        description: Valid link.
        content:
          application/json:
            schema: {$ref: '../schemas/d2.yaml#/OutboundLinkVerification'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/outbound-links/signatures:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: createOutboundLinkSignatures
    summary: Sign external links found in plain-text user content
    description: |
      Staff HTML content (pages, blog) is returned with external links already rewritten to signed
      `/redirect` hrefs. For plain-text user content that clients linkify (profile texts, messages,
      descriptions), clients send the detected http/https URLs (≤ 50) and render the returned hrefs
      (spec 17 AC-47). Mobile shows the same warning dialog before opening the system browser. Anyone may sign
      any http/https URL, so a signature proves nothing about who made the link; this is acceptable **only**
      because the interstitial rules of `verifyOutboundLink` are mandatory (never redirects by itself, full
      punycode-decoded destination with the host prominent, http/https only, noindex; SEC-19). Server-side
      linkified text is preferred for stored content.
    tags: [SEO]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission: {audience: optional-user, ownership: none}
    x-covers: ['17 AC-47']
    x-rate-limit: 60 requests / 1 min per user or IP
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d2.yaml#/OutboundLinkSignatureRequest'}
    responses:
      '200':
        description: Signed hrefs in request order.
        content:
          application/json:
            schema: {$ref: '../schemas/d2.yaml#/OutboundLinkSignatureList'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}
