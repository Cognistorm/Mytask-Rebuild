# ═════════════════════════ Admin: reconciliation (spec 05 AC-44…AC-47, PROPOSED P-135; spec 16 AC-44) ═════════════════════════
/admin/reconciliation/runs:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: adminListReconciliationRuns
    summary: List nightly reconciliation runs (newest run day first)
    description: |
      One row per run day: run day, start and end, status (`t_admin_recon_status_*`), checks, differences and
      unreviewed differences; filters status and run-day range; empty → `t_admin_recon_no_runs` (spec 05
      AC-47). Runs are created only by the worker job `ledger-reconcile` at S-128 (default 03:00 Georgian
