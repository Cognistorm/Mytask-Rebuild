      spec 16 AC-7; see D3 handoff Q). A negative residual cannot be released if it would take Available
      below 0 → `422 INSUFFICIENT_FUNDS` (I-5; see D3 handoff Q).
      Errors: 400 VALIDATION_FAILED; 403 REAUTH_REQUIRED; 404 NOT_FOUND; 409 STATE_CONFLICT (already
      settled), IDEMPOTENCY_IN_PROGRESS; 422 INSUFFICIENT_FUNDS, IDEMPOTENCY_KEY_REUSED.
    tags: [Admin Ledger]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    x-money: true
    x-permission:
      audience: staff
      permission: ledger.adjust
      stepUp: true
      ownership: none
    x-audit: legacy_hold.release
    x-covers: ['16 AC-44']
    x-emits: [wallet.balance_changed]
    requestBody:
