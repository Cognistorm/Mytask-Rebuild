  get:
    operationId: adminListLedgerJournals
    summary: Ledger viewer — look up journals (read-only)
    description: |
      Journals with their debit/credit lines, newest first, looked up by user (`userId`: any entry on one of
      the user's accounts or escrows), item (`paymentId`, `escrowId`, `withdrawalId`, `adjustmentId`,
      `subscriptionId`), reference (`idempotencyRef` exact or prefix) or type (spec 16 AC-45). Nothing can
      be edited. Also the "ledger lines" of the user page (AC-31).
    tags: [Admin Ledger]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
