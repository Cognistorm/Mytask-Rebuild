/admin/ledger/adjustments:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: adminCreateLedgerAdjustment
    summary: Post a balance adjustment (credit or debit of Available)
    description: |
      One journal between the user's Available and `platform:adjustments` (MM-05-07 / MM-05-08,
      `adjustment:{adjustmentId}`); audit with who, when, amount, reason and IP; the user sees a "Balance
      correction" line with the public note and gets EV-30 `t_balance_adjusted` (spec 05 AC-41, P-12, P-41).
      A debit larger than Available → `422 INSUFFICIENT_FUNDS` messageKey `t_adjustment_would_go_negative`
      (AC-42). Double click → one journal (`Idempotency-Key`, EC-9). HOLD cannot be adjusted (R-P11).
      Re-authentication within 15 minutes (spec 16 AC-7).
      Errors: 400 VALIDATION_FAILED; 403 REAUTH_REQUIRED, FORBIDDEN; 404 NOT_FOUND (user); 409
      IDEMPOTENCY_IN_PROGRESS; 422 INSUFFICIENT_FUNDS, IDEMPOTENCY_KEY_REUSED.
    tags: [Admin Ledger]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    x-money: true
    x-permission:
      audience: staff
      permission: ledger.adjust
      stepUp: true
      ownership: none
    x-audit: ledger.adjustment
    x-covers: ['05 AC-41', '05 AC-42', '16 AC-32']
    x-notifications: [EV-30]
    x-emits: [wallet.balance_changed]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/AdjustmentCreateRequest'}
    responses:
      '201':
        description: Adjustment posted.
        headers:
          Idempotent-Replayed: {$ref: '../components/headers.yaml#/IdempotentReplayed'}
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminAdjustment'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
  get:
    operationId: adminListLedgerAdjustments
    summary: List balance adjustments (newest first)
    tags: [Admin Ledger]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/AdminLimit'
      - $ref: '../components/parameters.yaml#/UserIdFilter'
      - $ref: '../components/parameters.yaml#/CreatedFrom'
      - $ref: '../components/parameters.yaml#/CreatedTo'
    x-permission:
      audience: staff
      permission: payments.read
      ownership: none
    x-covers: ['16 AC-32']
    responses:
      '200':
        description: Page of adjustments.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminAdjustmentPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

