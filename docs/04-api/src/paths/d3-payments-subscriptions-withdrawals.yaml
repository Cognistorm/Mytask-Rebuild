  get:
    operationId: getCurrentSubscription
    summary: My subscription (status, dates, next charge, renewal card, actions)
    description: |
      Plan and period, state (active / canceled — active until / none), start and end, next charge date and
      amount at the current price when it will renew, renewal card (masked), source, and the Cancel / Resume
      / Subscribe flags (spec 09 AC-18). Premium stops when `endsAt` passes, whatever the source (AC-19,
