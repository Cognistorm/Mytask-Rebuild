      - {name: escrowId, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: withdrawalId, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: adjustmentId, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: subscriptionId, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: accountId, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: idempotencyRef, in: query, required: false, description: 'Exact reference or prefix ending with `*` (e.g. `bog:123*`).', schema: {type: string, maxLength: 200}}
      - name: type
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../schemas/d3.yaml#/LedgerJournalType'}
    x-permission:
      audience: staff
      permission: payments.read
      ownership: none
    x-covers: ['16 AC-31', '16 AC-45']
    responses:
      '200':
        description: Page of journals.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminLedgerJournalPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

