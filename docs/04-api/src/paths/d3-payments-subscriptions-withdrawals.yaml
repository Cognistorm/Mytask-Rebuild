      `handleBogWebhook` / job `bog-reconcile` (spec 05 AC-13, spec 16 AC-36, P-119). Idempotent: a payment
      already settled posts nothing again (AC-14). Never trusts the browser. Stored as a `staff_check` event
      and audited.
      Errors: 404 NOT_FOUND; 409 IDEMPOTENCY_IN_PROGRESS; 422 BUSINESS_RULE_VIOLATION (not a card payment).
