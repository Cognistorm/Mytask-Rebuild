    summary: Plans page data (Standard and Premium, monthly and yearly)
    description: |
      Standard and Premium with prices S-008/S-009, yearly monthly-equivalent and saving %, feature lists
      (editable content, R-2.6), each plan's withdrawal fee from S-010/S-011 (not hard-coded), the monthly
      points price S-045 (spec 09 AC-1) and the caller's button state (`viewer`: guest, no Premium, active
