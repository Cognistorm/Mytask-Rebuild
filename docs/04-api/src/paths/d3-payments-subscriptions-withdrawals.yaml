/subscriptions/points-purchase:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: purchaseSubscriptionWithPoints
    summary: Buy one month of Premium with points
    description: |
      Monthly Premium only. The server takes S-045 points (default 100) — any number sent by the client is
      ignored (R-006) — in one transaction with the subscription (PM-09-02, `points_purchase:{subscriptionId}`);
      Premium runs for 1 calendar month, no card saved, no auto-renew; EV-50 sent **once** (spec 09 AC-8).
      Fewer points than S-045 → `422 INSUFFICIENT_FUNDS` messageKey `t_insufficient_points`,
      `details.pointsNeeded` (AC-9). Running Premium → `422 SUBSCRIPTION_ALREADY_ACTIVE` (AC-6). Wallet
      money never buys Premium and points buy nothing else (spec 05 AC-3, R-P1). Also available in the app
      while S-126 is OFF (spec 09 AC-7).
      Errors: 400 VALIDATION_FAILED (yearly or other plan); 409 IDEMPOTENCY_IN_PROGRESS, STATE_CONFLICT; 422
      INSUFFICIENT_FUNDS, SUBSCRIPTION_ALREADY_ACTIVE, IDEMPOTENCY_KEY_REUSED.
    tags: [Subscriptions]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    x-money: true
    x-permission:
      audience: user
      ownership: self
    x-covers: ['05 AC-3', '09 AC-6', '09 AC-7', '09 AC-8', '09 AC-9', '09 AC-21']
    x-settings: [S-045]
    x-notifications: [EV-50]
    x-emits: [subscription.changed, points.balance_changed]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/SubscriptionPointsPurchaseRequest'}
    responses:
      '201':
        description: Premium activated (`t_subscription_purchased_successfully`).
        headers:
          Idempotent-Replayed: {$ref: '../components/headers.yaml#/IdempotentReplayed'}
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/Subscription'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/subscriptions/{subscriptionId}/cancel:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: subscriptionId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: cancelSubscription
    summary: Cancel auto-renewal (Premium stays until the end date)
    description: |
      Switches auto-renewal off; Premium stays until `endsAt`; state "Canceled — active until :date";
      `SubscriptionCancelled` (EV-54) (spec 09 AC-16). No refund. After the reminder, no charge happens
      (EC-3).
      Errors: 404 NOT_FOUND; 409 STATE_CONFLICT (already canceled, ended, or not a card subscription).
    tags: [Subscriptions]
    x-permission:
      audience: user
      ownership: subscription owner only; others get 404
    x-covers: ['09 AC-16']
    x-notifications: [EV-54]
    x-emits: [subscription.changed]
    responses:
      '200':
        description: The subscription (`t_subscription_canceled_successfully`).
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/Subscription'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/subscriptions/{subscriptionId}/resume:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: subscriptionId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: resumeSubscription
    summary: Resume auto-renewal of a canceled, still running subscription
    description: |
      Allowed while the subscription has not ended and the saved card still exists; renewal (and its
      reminder) then happen as normal (spec 09 AC-17, P-58).
      Errors: 404 NOT_FOUND; 409 STATE_CONFLICT (not canceled by the user, or ended); 422
      BUSINESS_RULE_VIOLATION (no saved renewal card).
    tags: [Subscriptions]
    x-permission:
      audience: user
      ownership: subscription owner only; others get 404
    x-covers: ['09 AC-17']
    x-emits: [subscription.changed]
    responses:
      '200':
        description: The subscription (`t_auto_renewal_resumed`).
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/Subscription'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

