      permission: payments.read
      ownership: none
      notes: 'payments.read per the spec 16 catalogue ("withdrawals and refunds lists"); spec 14 AC-13 / 16 AC-42 name withdrawals.approve for the screen — see D3 handoff Q.'
    x-covers: ['14 AC-13', '16 AC-31', '16 AC-42']
