/admin/bank-transfers:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: adminListBankTransfers
    summary: Staff list of bank-transfer payments (orders and top-ups)
    description: |
      Bank-transfer payments, pending first, oldest first, with filters status and purpose (`gig_order`,
      `topup`) (spec 16 AC-43). Still usable when S-021 is OFF while transfers are pending (spec 05 EC-8);
      the admin hides the menu otherwise. `totalCount` = pending count for the queue counter.
    tags: [Admin Payments]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/AdminLimit'
      - $ref: '../components/parameters.yaml#/UserIdFilter'
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../components/schemas.yaml#/PaymentStatus'}
      - name: purpose
        in: query
        required: false
        schema:
          type: string
          enum: [gig_order, topup]
    x-permission:
      audience: staff
      permission: payments.offline.approve
      ownership: none
    x-covers: ['16 AC-43']
    responses:
      '200':
        description: Page of bank-transfer payments.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminPaymentPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/admin/bank-transfers/{paymentId}/confirm:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: paymentId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: adminConfirmBankTransfer
    summary: Confirm that a bank transfer arrived
    description: |
      Order: paid exactly like a card payment (MM-05-04 `bank:{paymentId}:confirmed`; HOLD funded, spec 06
      notifications EV-33/EV-34), buyer gets EV-25 `t_ur_payment_has_been_received_offline` (spec 05 AC-25).
      Top-up: A credited to Available (MM-05-05), EV-23 (AC-26). Compare-and-set `pending → paid`; if the
      order can no longer take it (e.g. deleted), the amount is credited to Available as unapplied. Works
      while S-021 is OFF (EC-8). Audited.
      Errors: 404 NOT_FOUND; 409 STATE_CONFLICT (already decided), IDEMPOTENCY_IN_PROGRESS; 422
      IDEMPOTENCY_KEY_REUSED, BUSINESS_RULE_VIOLATION (not a bank transfer).
    tags: [Admin Payments]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    x-money: true
    x-permission:
      audience: staff
      permission: payments.offline.approve
      ownership: none
    x-audit: bank_transfer.confirm
    x-covers: ['05 AC-25', '05 AC-26', '16 AC-43']
    x-notifications: [EV-23, EV-25, EV-33, EV-34]
    x-emits: [payment.status_changed, wallet.balance_changed]
    requestBody:
      required: false
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/BankTransferConfirmRequest'}
    responses:
      '200':
        description: The payment, now paid.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminPayment'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/admin/bank-transfers/{paymentId}/reject:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: paymentId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: adminRejectBankTransfer
    summary: Reject a bank transfer (reason required)
    description: |
      Order: canceled, nothing moves, buyer gets EV-26 `t_bank_transfer_rejected` with the reason (spec 05
      AC-25, P-42). Top-up: rejected, user gets EV-27 `DepositRejected` with the reason (AC-26). Payment
      `pending → rejected` (compare-and-set). Posts no journal. Audited.
      Errors: 400 VALIDATION_FAILED; 404 NOT_FOUND; 409 STATE_CONFLICT, IDEMPOTENCY_IN_PROGRESS; 422
      IDEMPOTENCY_KEY_REUSED.
    tags: [Admin Payments]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    x-money: true
    x-permission:
      audience: staff
      permission: payments.offline.approve
      ownership: none
    x-audit: bank_transfer.reject
    x-covers: ['05 AC-25', '05 AC-26', '16 AC-43']
    x-notifications: [EV-26, EV-27]
    x-emits: [payment.status_changed]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../components/schemas.yaml#/StaffReasonRequest'}
    responses:
      '200':
        description: The payment, now rejected.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminPayment'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

# ═════════════════════════ Admin: ledger viewer, balances, adjustments (spec 16 AC-31, AC-32, AC-45) ═════════════════════════
/admin/ledger/journals:
