      receives Premium for that many months as a gift when their account becomes active (spec 09 AC-26).
      Errors: 400 VALIDATION_FAILED; 409 DUPLICATE (code already has a benefit).
    tags: [Admin Subscriptions]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: promo_codes.write
      ownership: none
    x-audit: referral_benefit.create
    x-covers: ['09 AC-26', '16 AC-58']
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/ReferralBenefitCreateRequest'}
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminReferralBenefit'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/admin/referral-benefits/{referralBenefitId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: referralBenefitId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  patch:
    operationId: adminUpdateReferralBenefit
    summary: Edit a referral-code benefit
    description: 'Name, Premium months, active. Gifts already granted are not changed. Errors: 400 VALIDATION_FAILED; 404 NOT_FOUND.'
    tags: [Admin Subscriptions]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: promo_codes.write
      ownership: none
    x-audit: referral_benefit.update
    x-covers: ['09 AC-26', '16 AC-58']
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/ReferralBenefitUpdateRequest'}
    responses:
      '200':
        description: The benefit.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminReferralBenefit'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  delete:
    operationId: adminDeleteReferralBenefit
    summary: Delete a referral-code benefit
    description: 'Removes the benefit for future activations; gifts already granted stay (legacy Filament CRUD, spec 09 Screens). Audited. Errors: 404 NOT_FOUND.'
    tags: [Admin Subscriptions]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: promo_codes.write
      ownership: none
    x-audit: referral_benefit.delete
    x-covers: ['16 AC-58']
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
