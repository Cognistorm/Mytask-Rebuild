# ═════════════════════════ Payout details and withdrawals ═════════════════════════
/payout-methods/bank-account:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: getPayoutDetails
    summary: Get the caller's payout details
    description: Holder name and IBAN, or the migrated free text shown read-only as "Previous details" and still usable for manual payouts (spec 14 AC-1, AC-2, P-62).
    tags: [Withdrawals]
    x-permission:
      audience: restricted-user
      ownership: self
    x-covers: ['14 AC-1', '14 AC-2']
    responses:
      '200':
        description: Payout details (all null when none).
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/PayoutDetails'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
  put:
    operationId: putPayoutDetails
    summary: Save payout details (holder name + Georgian IBAN, password confirmed)
    description: |
      Holder name 3–100 characters; IBAN must be a valid Georgian IBAN (`GE`, 22 characters, check digits,
      spaces ignored) → otherwise `400 VALIDATION_FAILED` field `iban` messageKey `t_iban_invalid` (spec 14
      AC-1). Needs the current password (not for accounts without one, spec 02 AC-29) → wrong password `422
      PAYOUT_PASSWORD_INCORRECT` (AC-3, P-63). Saving replaces the migrated text; pending requests keep their
      copied details (EC-4). Sends `PayoutDetailsChanged` + in-app notice (EV-114).
      Errors: 400 VALIDATION_FAILED; 422 PAYOUT_PASSWORD_INCORRECT; 429 RATE_LIMITED (global limits).
    tags: [Withdrawals]
    x-permission:
      audience: user
      ownership: self
    x-covers: ['14 AC-1', '14 AC-3']
    x-notifications: [EV-114]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/PayoutDetailsPutRequest'}
    responses:
      '200':
        description: Saved.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/PayoutDetails'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/withdrawals/quote:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: createWithdrawalQuote
    summary: Withdraw form data and live fee preview
    description: |
      Returns Available, minimum S-031, period rule S-032, the caller's plan now and its fee rule (S-010 /
      S-011), the payout details that will be used, and for `amount` the fee F (half up) and "You will
      receive" A − F (spec 14 AC-5, AC-8). `eligibility` gives the first failing rule in the order of AC-6
      (no payout details → `PAYOUT_DETAILS_REQUIRED` / `t_add_payout_details_first`, AC-4; nothing available
      → `t_nothing_to_withdraw`, AC-11). Stores nothing. Called while the user types.
      Errors: 400 VALIDATION_FAILED.
    tags: [Withdrawals]
    x-permission:
      audience: user
      ownership: self
    x-covers: ['14 AC-4', '14 AC-5', '14 AC-6', '14 AC-8', '14 AC-11', '05 AC-37']
    x-settings: [S-010, S-011, S-031, S-032]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/WithdrawalQuoteRequest'}
    responses:
      '200':
        description: Form data and preview.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/WithdrawalQuote'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/withdrawals:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: createWithdrawal
    summary: Request a withdrawal of amount A
    description: |
      Rules in this order, each with its message (spec 14 AC-6): amount valid (integer tetri > 0, else `400
      VALIDATION_FAILED` `t_validator_regex`); payout details present (`422 PAYOUT_DETAILS_REQUIRED`, AC-4);
      A ≤ Available (`422 INSUFFICIENT_FUNDS` `t_withdrawal_money_not_enough`; a zero or negative migrated
      balance refuses any amount, AC-11); no other pending/processing request (`409
      WITHDRAWAL_PENDING_EXISTS`); period S-032 since the creation of the latest **paid** request (`422
      WITHDRAWAL_PERIOD_NOT_ELAPSED`; rejected requests do not count, EC-3); A ≥ S-031 (`422
      WITHDRAWAL_BELOW_MINIMUM`); A − F > 0 (`422 WITHDRAWAL_PAYOUT_TOO_LOW`).
      Then in one transaction (AC-7): status `pending`; F from the fee rule of the caller's plan **now**
      (percent half up or fixed) with its version, plan and payout details copied onto the request; journal
      MM-14-01 (`withdrawal:{id}:request`): A leaves Available, Withdrawn +A. EV-110 to S-100, EV-111 to the
      user (`t_ur_withdrawal_request_under_review`). Later plan or fee changes never touch the request (AC-9,
      EC-1). Two parallel requests: one wins, the other gets `WITHDRAWAL_PENDING_EXISTS` or
      `INSUFFICIENT_FUNDS`; the balance never goes below 0 (AC-10, spec 05 EC-4). KYC is not required
      (AC-12). With S-033 = `bog_payout` (future) the request is sent to the payout provider and becomes
      `processing` (AC-17).
      Errors: 400 VALIDATION_FAILED, IDEMPOTENCY_KEY_REQUIRED; 409 WITHDRAWAL_PENDING_EXISTS,
      IDEMPOTENCY_IN_PROGRESS; 422 PAYOUT_DETAILS_REQUIRED, INSUFFICIENT_FUNDS, WITHDRAWAL_PERIOD_NOT_ELAPSED,
      WITHDRAWAL_BELOW_MINIMUM, WITHDRAWAL_PAYOUT_TOO_LOW, IDEMPOTENCY_KEY_REUSED.
    tags: [Withdrawals]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    x-money: true
    x-permission:
      audience: user
      ownership: self
      notes: 'Restricted users are refused (403 ACCOUNT_RESTRICTED). No KYC requirement (Q-048).'
    x-covers: ['14 AC-4', '14 AC-6', '14 AC-7', '14 AC-8', '14 AC-10', '14 AC-11', '14 AC-12', '14 AC-17', '05 AC-30', '05 AC-37']
    x-settings: [S-010, S-011, S-031, S-032, S-033, S-100]
    x-notifications: [EV-110, EV-111]
    x-emits: [wallet.balance_changed]
    x-jobs: [payout-sync]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/WithdrawalCreateRequest'}
    responses:
      '201':
        description: Request created.
        headers:
          Idempotent-Replayed: {$ref: '../components/headers.yaml#/IdempotentReplayed'}
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/Withdrawal'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
  get:
    operationId: listWithdrawals
    summary: List the caller's withdrawals (newest first)
    description: Date, amount requested, fee, payout, status (Pending, Processing, Paid, Rejected), rejection reason, paid date and reference (spec 14 AC-18). Empty → `t_no_withdrawals_yet`.
    tags: [Withdrawals]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../schemas/d3.yaml#/WithdrawalStatus'}
    x-permission:
      audience: restricted-user
      ownership: self
    x-covers: ['14 AC-18']
    responses:
      '200':
        description: Page of withdrawals.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/WithdrawalPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}

/withdrawals/{withdrawalId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: withdrawalId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: getWithdrawal
    summary: Get one of the caller's withdrawals
    description: The stored fee, payout, plan and fee-rule version never change after creation (spec 14 AC-9; spec 05 AC-39).
    tags: [Withdrawals]
