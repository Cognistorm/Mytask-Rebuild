/admin/withdrawals/{withdrawalId}/mark-paid:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: withdrawalId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: adminMarkWithdrawalPaid
    summary: Mark a withdrawal as paid (after the manual bank transfer)
    description: |
      Compare-and-set `pending → paid` (the first of two staff wins; the second gets `409 STATE_CONFLICT`
      messageKey `t_withdrawal_already_processed`, spec 14 AC-16) with journal MM-14-02
      (`withdrawal:{id}:paid`, `withdrawal:{id}:outcome`), optional bank reference and payout date, audit,
      then EV-112 (`PaymentApproved` + `t_withdrawal_amount_paid`) after the commit (AC-14). Re-authentication
      within 15 minutes (spec 16 AC-7).
      Errors: 400 VALIDATION_FAILED; 403 REAUTH_REQUIRED; 404 NOT_FOUND; 409 STATE_CONFLICT,
      IDEMPOTENCY_IN_PROGRESS; 422 IDEMPOTENCY_KEY_REUSED.
    tags: [Admin Withdrawals]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    x-money: true
    x-permission:
      audience: staff
      permission: withdrawals.approve
      stepUp: true
      ownership: none
    x-audit: withdrawal.mark_paid
    x-covers: ['14 AC-14', '14 AC-16', '16 AC-42']
    x-notifications: [EV-112]
    x-emits: [withdrawal.status_changed]
    requestBody:
      required: false
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/WithdrawalMarkPaidRequest'}
    responses:
      '200':
        description: The withdrawal, now paid.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminWithdrawal'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/admin/withdrawals/{withdrawalId}/reject:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: withdrawalId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: adminRejectWithdrawal
    summary: Reject a withdrawal (reason required; money returns to Available)
    description: |
      Compare-and-set `pending|processing → rejected` with journal MM-14-03 (`withdrawal:{id}:reject`,
      `withdrawal:{id}:outcome`): the full amount A (including the fee) returns to Available and Withdrawn
      decreases by A; reason required (≤ 500), shown to the user; audit; EV-113 (`PaymentRejected` +
      `t_withdrawal_amount_rejected` with the reason) (spec 14 AC-15, P-64). Second staff action → `409
      STATE_CONFLICT` `t_withdrawal_already_processed` (AC-16). With a payout provider (future), staff can
      still reject before it is sent (AC-17). Re-authentication within 15 minutes (spec 16 AC-7).
      Errors: 400 VALIDATION_FAILED; 403 REAUTH_REQUIRED; 404 NOT_FOUND; 409 STATE_CONFLICT,
      IDEMPOTENCY_IN_PROGRESS; 422 IDEMPOTENCY_KEY_REUSED.
    tags: [Admin Withdrawals]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    x-money: true
    x-permission:
      audience: staff
      permission: withdrawals.approve
      stepUp: true
      ownership: none
    x-audit: withdrawal.reject
    x-covers: ['14 AC-15', '14 AC-16', '14 AC-17', '16 AC-42']
    x-notifications: [EV-113]
    x-emits: [withdrawal.status_changed, wallet.balance_changed]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/WithdrawalRejectRequest'}
    responses:
      '200':
        description: The withdrawal, now rejected.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminWithdrawal'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

