# D3 — paths for specs 05 (payments and wallet), 09 (subscriptions, points, referrals, promo codes),
# 14 (withdrawals) and the spec 16 admin screens delegated to D3 (CONVENTIONS §4.3).
# Written by the P2-B4 D3 group run (2026-09-29). Conventions: docs/04-api/CONVENTIONS.md.
# Reserved operations written here: createCheckoutQuote, createPayment, getPayment, handleBogWebhook (§5.1).
# One checkout for every purpose (§5.4): gig orders (D4 cart / order), contract payments (D5), custom
# offers (D4), wallet top-ups and Premium all go through createCheckoutQuote + createPayment.

# ═════════════════════════ Checkout and payments ═════════════════════════
/checkout/quote:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: createCheckoutQuote
    summary: Compute the server-side checkout breakdown for any purpose
    description: |
      Builds the quote for one `CheckoutTarget` (CONVENTIONS §5.4). Clients only display these numbers
      (spec 05 AC-5). Nothing is stored except the quote hash returned as `quoteId`.
      Per purpose:
      - `gig_order` / `source = cart`: re-validates every cart line (gig active and listable, owner
        available and not restricted, buyer is not the owner, upgrades exist; spec 06 AC-6). Failing lines
        are removed from the cart and reported in `notices`; prices and delivery times are re-read from
        current gig data, never from the cart. `source = order`: an order still awaiting payment, at its
        stored prices (spec 06 AC-11); if a gig is no longer orderable → `422 CHECKOUT_ITEMS_NO_LONGER_AVAILABLE`.
      - `contract_payment`: proposal amount P + client commission Fb if S-014 is ON (spec 11 AC-26); only
        the project owner (client) — others get `404` (spec 11 AC-27).
      - `custom_offer`: offer price P + buyer fee Fb if S-017 is ON (spec 12 AC-13); only the offer's
        buyer; a withdrawn, declined, rejected or expired offer (also past `expiresAt` before the sweeper
        ran) → `409 CHECKOUT_TARGET_NOT_PAYABLE` (spec 12 AC-17, AC-18).
      - `topup`: amount A with the card fee and the credited amount (spec 05 AC-21); A outside
        S-023…S-024 → `422 TOPUP_AMOUNT_OUT_OF_RANGE` (AC-22, limits apply to A, P-39).
      - `subscription`: Premium list price S-008/S-009, promo discount, **no** surcharge (spec 05 AC-7,
        Q-070), `pointsOption` for monthly (spec 09 AC-3, AC-8, AC-9), auto-renew notice data
        (`subscription`), zero-total flag (spec 09 AC-30). Running Premium → `422 SUBSCRIPTION_ALREADY_ACTIVE`
        (spec 09 AC-6).
      Methods (spec 05 R-P1, AC-1…AC-4): Card (S-019), Wallet (S-020; never for top-up or Premium),
      Bank transfer (S-021; gig orders and top-ups only). Methods switched OFF are returned with
      `isAvailable = false` and `unavailableReason.code = feature_disabled`; wallet with Available below
      the total (including a negative migrated balance) with `insufficient_funds` (AC-19, AC-30). The card
      surcharge S-012 applies to the surcharge base (prices + buyer fees), half up (AC-6, R-P5); fees come
      from the Commission & Fee module with their rule versions (AC-37, AC-38). Promo codes only on
      promo-eligible services (today Premium): elsewhere `422 PROMO_NOT_APPLICABLE` (AC-40); on Premium the
      code is checked (spec 09 AC-28) and the discount computed (AC-29; percent half up, fixed = min(fixed, price)).
      Mobile (`X-MyTask-Client: ios|android`) with S-126 OFF: the card method of a `subscription` quote is
      returned unavailable (`mobile_card_purchase_disabled`, spec 09 AC-7).
      Errors: 400 VALIDATION_FAILED; 404 NOT_FOUND (target not visible to the caller); 409
      CHECKOUT_TARGET_NOT_PAYABLE; 422 CHECKOUT_CART_EMPTY, CHECKOUT_ITEMS_NO_LONGER_AVAILABLE,
      TOPUP_AMOUNT_OUT_OF_RANGE, SUBSCRIPTION_ALREADY_ACTIVE, PROMO_INVALID, PROMO_WRONG_PLAN,
      PROMO_ALREADY_USED, PROMO_FULLY_REDEEMED, PROMO_NOT_APPLICABLE; 403 FEATURE_DISABLED (S-022 OFF for
      top-ups).
    tags: [Checkout]
    parameters:
      - $ref: '../components/parameters.yaml#/XMyTaskClient'
    x-permission:
      audience: user
      ownership: 'per target: own cart / buyer of the order; client (project owner) of the contract payment; buyer of the custom offer; self for top-up and Premium. Others get 404'
      notes: 'Restricted users are refused (403 ACCOUNT_RESTRICTED). Top-up needs S-022 ON (403 FEATURE_DISABLED).'
    x-covers: ['05 AC-1', '05 AC-2', '05 AC-3', '05 AC-4', '05 AC-5', '05 AC-6', '05 AC-7', '05 AC-8', '05 AC-19', '05 AC-21', '05 AC-22', '05 AC-37', '05 AC-38', '05 AC-40', '09 AC-3', '09 AC-6', '09 AC-9', '09 AC-28', '09 AC-29', '09 AC-32', '09 AC-37', '06 AC-6', '06 AC-11', '11 AC-26', '11 AC-27', '12 AC-13', '12 AC-17', '12 AC-18']
    x-settings: [S-008, S-009, S-012, S-013, S-014, S-015, S-017, S-018, S-019, S-020, S-021, S-022, S-023, S-024, S-042, S-043, S-045, S-047, S-048, S-049, S-050, S-126]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/CheckoutQuoteRequest'}
    responses:
      '200':
        description: The quote.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/CheckoutQuote'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/payments:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: createPayment
    summary: Pay for a checkout target (card, wallet or bank transfer)
    description: |
      One payment per press of "Pay" (`Idempotency-Key`; a second press with the same key returns the same
      payment, spec 05 AC-9). The server recomputes the quote for `target` + `method`; if the total differs
      from `quoteId` → `409 QUOTE_CHANGED` with the new quote in `details.quote`, nothing started (AC-8). A
      payment already started keeps its fees. The payment row stores purpose, payer, lines, fees with
      rule versions, surcharge, discount, total and the billing snapshot (data-model §3.J).

      **By method**
      - `bog_card`: creates the BOG order for exactly `total` in GEL with real data only (our payment id as
        external order id, basket lines with real names, locale, callback URL, return URLs
        `/payments/{id}/result` or the app bounce URL chosen from `X-MyTask-Client`; no dummy values,
        credentials from `.env`; spec 05 AC-16, url-map §7). Returns `201` with `status = pending` and
        `nextAction.type = redirect`. The item is **not** paid yet: no escrow, no ledger entry (R-P6); it
        becomes paid only through the verified path of `handleBogWebhook` / job `bog-reconcile` (AC-10, AC-13).
      - `wallet`: in one database transaction, locks the buyer's Available balance, posts MM-05-02
        (`payment:{paymentId}:wallet`), marks the item paid and funds the freelancer's HOLD; returns `201`
        with `status = paid`, `nextAction.type = completed` (AC-18). Available below the total (incl. a
        migrated negative balance) → `422 INSUFFICIENT_FUNDS` messageKey `t_insufficient_funds_in_your_account`;
        concurrent payments cannot take the balance below 0 (AC-19, AC-20, AC-30). No split payments.
      - `bank_transfer` (S-021 ON; gig orders and top-ups only): creates the order as awaiting bank transfer
        (or a pending top-up), no surcharge, no money moves; `nextAction.type = bank_transfer` with the S-125
        instructions and the reference; EV-24 to S-100 for orders (spec 05 AC-24, AC-26).

      **Effects per purpose when paid** (same service for wallet, verified card and confirmed bank transfer)
      - `gig_order`: `source = cart` creates one order with one item per gig and the full snapshot (title,
        freelancer, base price, upgrades, delivery time, revisions allowed, fees and versions, P) and empties
        the cart (spec 06 AC-7); card payments create it as awaiting payment, invisible to the freelancer
        (spec 06 AC-9). `source = order` pays again at the stored prices (spec 06 AC-11). Paid → items
        "Waiting for order details", HOLD +P′ per item, "orders in queue" +1, EV-33/EV-34 (+ EV-35 for card)
        (spec 06 AC-8, AC-10).
      - `contract_payment`: contract → in progress, HOLD +P′, expected delivery date = payment time + days,
        EV-72 (spec 11 AC-28, AC-29). A contract already paid or canceled → wallet `409
        CHECKOUT_TARGET_NOT_PAYABLE` (`t_order_status_changed`); a late card payment is credited to the
        wallet as unapplied (spec 11 AC-30).
      - `custom_offer`: offer → in progress, HOLD +P′, EV-86 (spec 12 AC-14, AC-15); after expiry / withdrawal
        a verified card payment becomes unapplied (spec 12 AC-19).
      - `topup`: A credited to Available, S to surcharge revenue, EV-23 (spec 05 AC-23).
      - `subscription`: Premium starts now for 1 month / 1 year, the card is saved as renewal card from the
        verified payment details, price and version stored, EV-50 (spec 09 AC-4). Promo: one redemption is
        reserved at start (cap and per-user limit never exceeded), final on verification, released on
        failure/expiry (spec 09 AC-31); first period only (AC-32). **Zero total** (100% promo): `method` must
        be `bog_card`; Premium activates at once without BOG, no card saved, no auto-renew (MM-09-03), `201`
        with `status = paid` (spec 09 AC-30). Mobile clients (`X-MyTask-Client: ios|android`) while S-126 is
        OFF → `403 FEATURE_DISABLED` `details.settingId = S-126` (spec 09 AC-7, ADR-016 §3). Running Premium
        → `422 SUBSCRIPTION_ALREADY_ACTIVE` (spec 09 AC-6).

      A method switched OFF → `403 FEATURE_DISABLED` with its `settingId` (S-019/S-020/S-021; S-022 for
      top-ups; spec 05 AC-4); payments already started finish normally (EC-5).
      Errors: 400 VALIDATION_FAILED, IDEMPOTENCY_KEY_REQUIRED; 403 FEATURE_DISABLED, ACCOUNT_RESTRICTED; 404
      NOT_FOUND; 409 QUOTE_CHANGED, CHECKOUT_TARGET_NOT_PAYABLE, IDEMPOTENCY_IN_PROGRESS; 422
      INSUFFICIENT_FUNDS, CHECKOUT_METHOD_NOT_AVAILABLE, CHECKOUT_CART_EMPTY, CHECKOUT_ITEMS_NO_LONGER_AVAILABLE,
      TOPUP_AMOUNT_OUT_OF_RANGE, SUBSCRIPTION_ALREADY_ACTIVE, PROMO_*, IDEMPOTENCY_KEY_REUSED; 503
      SERVICE_UNAVAILABLE when BOG cannot create the order (nothing charged).
    tags: [Payments]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
      - $ref: '../components/parameters.yaml#/XMyTaskClient'
    x-money: true
    x-permission:
      audience: user
      ownership: 'same as createCheckoutQuote: own cart / buyer of the order; project owner of the contract payment; buyer of the custom offer; self for top-up and Premium. Others get 404'
      notes: 'Method toggles S-019/S-020/S-021 and S-022 (top-up) are checked per request (403 FEATURE_DISABLED); S-126 for mobile Premium by card.'
    x-covers: ['05 AC-1', '05 AC-2', '05 AC-3', '05 AC-4', '05 AC-6', '05 AC-8', '05 AC-9', '05 AC-14', '05 AC-16', '05 AC-18', '05 AC-19', '05 AC-20', '05 AC-21', '05 AC-22', '05 AC-24', '05 AC-26', '05 AC-30', '05 AC-38', '05 AC-40', '09 AC-4', '09 AC-6', '09 AC-7', '09 AC-28', '09 AC-30', '09 AC-31', '09 AC-32', '06 AC-7', '06 AC-8', '06 AC-9', '06 AC-10', '06 AC-11', '11 AC-27', '11 AC-28', '11 AC-29', '11 AC-30', '12 AC-14', '12 AC-15', '12 AC-17', '12 AC-18']
    x-settings: [S-008, S-009, S-012, S-019, S-020, S-021, S-022, S-023, S-024, S-042, S-047, S-048, S-049, S-050, S-100, S-125, S-126]
    x-notifications: [EV-24, EV-33, EV-34, EV-50, EV-72, EV-86]
    x-emits: [payment.status_changed, wallet.balance_changed, subscription.changed]
    x-jobs: [bog-reconcile]
    x-rate-limit: 20 requests / 10 min per user
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/PaymentCreateRequest'}
    responses:
      '201':
        description: Payment created (card pending with a redirect, wallet paid, bank transfer pending with instructions, or zero-total Premium paid). A replay returns the same body with `Idempotent-Replayed`.
        headers:
          Idempotent-Replayed: {$ref: '../components/headers.yaml#/IdempotentReplayed'}
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/Payment'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}
  get:
    operationId: listPayments
    summary: List the caller's own payments (newest first)
    description: |
      The caller's payments as payer, newest first. Used by My subscription for past Premium payments
      (`?purpose=subscription&purpose=subscription_renewal`, spec 09 AC-18) and by receipts lists.
    tags: [Payments]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: purpose
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../components/schemas.yaml#/PaymentPurpose'}
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../components/schemas.yaml#/PaymentStatus'}
    x-permission:
      audience: restricted-user
      ownership: self (payer)
    x-covers: ['09 AC-18']
    responses:
      '200':
        description: Page of payments.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/PaymentPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}

/payments/{paymentId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: paymentId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: getPayment
    summary: Get a payment (result page polling and receipt)
    description: |
      Read-only. The web result page `/payments/{id}/result` and the app screen behind
      `mytask://payments/{id}/result` poll this operation (every few seconds up to 60 s, then
      `t_payment_still_processing`); opening, refreshing or forging those URLs never changes state (spec 05
      AC-11, AC-12, url-map §7, ADR-004 §3). `status` goes pending → paid | paid_unapplied | failed |
      expired (| rejected for bank transfers); `target` links to the order, contract, offer, wallet or
      subscription; "Try again" is a new `createPayment` for the same target. Also the receipt of a card
      payment: breakdown, card brand and mask, BOG order reference, billing snapshot (spec 05 AC-33). A
      payment confirmed later by the callback or the background check shows its new status when reopened
      (spec 09 AC-5).
      Errors: 404 NOT_FOUND (not the payer).
    tags: [Payments]
    x-permission:
      audience: restricted-user
      ownership: payer only; others get 404
    x-covers: ['05 AC-11', '05 AC-12', '05 AC-13', '05 AC-15', '05 AC-33', '09 AC-5', '09 AC-18']
    responses:
      '200':
        description: The payment.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/Payment'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/webhooks/bog:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: handleBogWebhook
    summary: BOG payment callback (trigger for a verified status check)
    description: |
      BOG's callback (URL `https://mytask.ge/api/v1/webhooks/bog`, ADR-004 §3, CONVENTIONS §10).
      1. The raw body and headers are stored in `payment_events` (`event_kind = callback`) before anything
         else; the handler answers **200 with an empty body** quickly and processes asynchronously (job
         `bog-callback`). Unknown BOG order ids are logged (`result = unknown_order`) and still answered 200
         (no retry storm). A body that is not JSON → 400.
      2. `Callback-Signature` is checked by the adapter hook `verifyCallback` only if the lead developer
         confirms that our merchant receives signed callbacks (Q-087 table in ADR-004); otherwise the callback
         is only a trigger.
      3. Processing **always** calls BOG payment details (`getPaymentDetails`) and applies the payment only if
         BOG reports it successful for the same order, amount and currency (spec 05 AC-10). Then one database
         transaction: payment compare-and-set `pending → paid`, journal `bog:{bogOrderId}:paid`
         (`payment:{id}:settle`), business effect of `createPayment` (item paid + HOLD funded, wallet
         credited, Premium activated/renewed, promo redemption final). If the item can no longer take the
         payment (order deleted, offer expired/withdrawn, contract already paid, Premium already running) the
         full amount goes to the buyer's Available as unapplied (`paid_unapplied`, MM-05-06, EV-29; spec 05
         AC-15, spec 09 EC-1, spec 11 AC-30, spec 12 AC-19). An amount mismatch is never applied; it stays for
         staff (`amount_mismatch`, alert to S-100; spec 05 EC-3). Failed/expired payments release the promo
         reservation and post nothing.
      4. Replays (BOG retries, the 5-minute reconciliation, staff "Check status") are no-ops: one journal per
         BOG payment (spec 05 AC-14).
      5. Not rate-limited per user; BOG's IPs are exempt; maintenance mode does not block it (spec 16 AC-70).
    tags: [Webhooks]
    security: []
    parameters:
      - name: Callback-Signature
        in: header
        required: false
        description: Optional signature header, verified by the `verifyCallback` hook only if BOG signs our callbacks (Q-087). The exact header name is confirmed by the lead developer.
        schema:
          type: string
          maxLength: 2048
    x-permission:
      audience: webhook
      notes: 'verified by provider callback + server-side status check (getPaymentDetails); signature hook optional (ADR-004 §3)'
    x-covers: ['05 AC-10', '05 AC-14', '05 AC-15', '05 AC-23', '09 AC-4', '09 AC-5', '09 AC-31', '06 AC-9', '06 AC-10', '11 AC-29', '11 AC-30', '12 AC-15', '12 AC-19']
    x-notifications: [EV-23, EV-29, EV-33, EV-34, EV-35, EV-50, EV-51, EV-72, EV-86]
    x-jobs: [bog-callback, bog-reconcile]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/BogWebhookPayload'}
    responses:
      '200':
        description: Received and stored (empty body), including unknown order ids and duplicates.
      '400': {$ref: '../components/responses.yaml#/BadRequest'}

# ═════════════════════════ Wallet ═════════════════════════
/wallet:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: getWallet
    summary: Get the caller's balances (Earnings tiles)
    description: |
      Available, HOLD/Pending, Withdrawn, Net income and Used for purchases, all from the ledger (spec 05
      AC-27, R-P7, P-44; data-model §5.4). Buyers never see pending or escrow amounts of their own (AC-29).
      A migrated negative Available is returned as is (`isNegative`, AC-30).
    tags: [Wallet]
    x-permission:
      audience: restricted-user
      ownership: self
    x-covers: ['05 AC-27', '05 AC-29', '05 AC-30']
    responses:
      '200':
        description: Balances.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/WalletBalances'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}

/wallet/holds:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: listWalletHolds
    summary: List the caller's items with money on HOLD
    description: |
      Every open escrow where the caller is the freelancer (gig order items, contract payments, custom
      offers, a migrated legacy hold), with amount, item status, delivery date and, when S-025 is ON, the
      auto-release date or the pause reason; `holdTotal` equals the HOLD figure (spec 05 AC-28). Oldest
      funded first.
    tags: [Wallet]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    x-permission:
      audience: restricted-user
      ownership: self (freelancer of the escrows)
    x-covers: ['05 AC-28']
    x-settings: [S-025]
    responses:
      '200':
        description: Page of HOLD items plus the total.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/HoldItemPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}

/wallet/transactions:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: listWalletTransactions
    summary: List the caller's transactions (every money movement)
    description: |
      Every ledger movement that touched the caller's Available or HOLD balance, plus the informational
      lines of their own card payments and paid withdrawals, newest first, **40 per page** (cursor; spec 05
      AC-31). Types `t_txn_type_*`, linked item, signed amount, affected balance. Filters by type and date
      range (AC-32); empty → `t_no_transactions_yet`. Balance corrections show the public note only (P-41,
      AC-41). Withdrawal requested / paid / rejected lines (spec 14 AC-19). Migrated legacy deposits,
      withdrawals and orders appear read-only with their original dates and amounts, plus the opening-balance
      line (AC-34, ADR-003 §11). Card-payment lines link to the receipt (`getPayment`, AC-33).
    tags: [Wallet]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - name: limit
        in: query
        required: false
        description: Page size (default 40, spec 05 AC-31).
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 40
      - name: type
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../schemas/d3.yaml#/TransactionType'}
      - $ref: '../components/parameters.yaml#/CreatedFrom'
      - $ref: '../components/parameters.yaml#/CreatedTo'
    x-permission:
      audience: restricted-user
      ownership: self
    x-covers: ['05 AC-31', '05 AC-32', '05 AC-34', '05 AC-41', '14 AC-19', '05 AC-23']
    responses:
      '200':
        description: Page of transactions.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/TransactionPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}

# ═════════════════════════ Saved cards and billing profile ═════════════════════════
/saved-cards:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: listSavedCards
    summary: List the caller's saved cards
    description: Brand, masked number, expiry, default and renewal marks (spec 05 AC-35). Empty → `t_no_saved_cards`.
    tags: [Saved Cards]
    x-permission:
      audience: restricted-user
      ownership: self
    x-covers: ['05 AC-35']
    responses:
      '200':
        description: The saved cards.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/SavedCardList'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}

/saved-cards/{savedCardId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: savedCardId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  delete:
    operationId: deleteSavedCard
    summary: Delete a saved card (also at BOG)
    description: |
      Removes the card here and at BOG (adapter `deleteSavedCard`; if BOG has no such call the card is only
      deleted locally and never charged again, ADR-004). If it is the Premium renewal card, the client first
      shows `t_delete_card_renewal_warning` (`SavedCard.isRenewalCard`, `renewalEndsAt`); after deletion the
      subscription does not renew and ends at its end date (spec 05 AC-35, P-45; spec 09 EC-4). A renewal
      charge already running finishes (spec 05 EC-7).
      Errors: 404 NOT_FOUND.
    tags: [Saved Cards]
    x-permission:
      audience: user
      ownership: card owner only; others get 404
    x-covers: ['05 AC-35']
    x-emits: [subscription.changed]
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
