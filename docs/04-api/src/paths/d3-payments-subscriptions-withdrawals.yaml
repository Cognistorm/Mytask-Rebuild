    summary: A user's points history (staff view with internal reasons)
    tags: [Admin Ledger]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/AdminLimit'
      - name: userId
        in: query
        required: true
        description: The user whose points history is shown (spec 16 AC-31).
        schema: {type: string, format: uuid}
    x-permission:
      audience: staff
      permission: payments.read
      ownership: none
    x-covers: ['16 AC-31']
    responses:
      '200':
        description: Page of points history.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminPointsHistoryEntryPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/admin/points/referrals:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: adminListReferrals
    summary: Referrals (by referrer or referred user)
    description: 'Referrals with status, credited points journal and benefit subscription; `userId` matches the referrer or the referred user (spec 16 AC-31 "Subscriptions and referrals"). Placed under `/admin/points` because D3 owns no `/admin/referrals` prefix (see D3 handoff request).'
    tags: [Admin Subscriptions]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/AdminLimit'
      - $ref: '../components/parameters.yaml#/UserIdFilter'
      - $ref: '../components/parameters.yaml#/CreatedFrom'
      - $ref: '../components/parameters.yaml#/CreatedTo'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [pending, verified, cancelled]
    x-permission:
      audience: staff
      permission: users.read
      ownership: none
    x-covers: ['16 AC-31']
    responses:
      '200':
        description: Page of referrals.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminReferralPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

# ═════════════════════════ Admin: promo codes (spec 09 AC-27…AC-33; spec 16 AC-58) ═════════════════════════
/admin/promo-codes:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: adminListPromoCodes
    summary: List promo codes
    tags: [Admin Subscriptions]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/AdminLimit'
      - {name: q, in: query, required: false, description: Code or name (partial)., schema: {type: string, maxLength: 100}}
      - {name: isActive, in: query, required: false, schema: {type: boolean}}
    x-permission:
      audience: staff
      permission: promo_codes.write
      ownership: none
    x-covers: ['09 AC-33', '16 AC-58']
    responses:
      '200':
        description: Page of promo codes with used / cap counts.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminPromoCodePage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
  post:
    operationId: adminCreatePromoCode
    summary: Create a promo code (Premium only)
    description: |
      Code (unique, case-insensitive, 4–20 of A–Z 0–9 "-"), internal name, discount S-047 (percent 1–100 or
      fixed GEL > 0), applies to S-048 (Premium monthly and/or yearly), uses per user S-049 (default 1),
      total cap S-050 (required), active, optional valid-from / valid-until (spec 09 AC-27, P-59, P-10).
      Errors: 400 VALIDATION_FAILED; 409 DUPLICATE (code taken).
    tags: [Admin Subscriptions]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: promo_codes.write
      ownership: none
    x-audit: promo_code.create
    x-covers: ['09 AC-27', '16 AC-58']
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/PromoCodeCreateRequest'}
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminPromoCode'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/admin/promo-codes/{promoCodeId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: promoCodeId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: adminGetPromoCode
    summary: Get a promo code with used / cap counts
    tags: [Admin Subscriptions]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: promo_codes.write
      ownership: none
    x-covers: ['09 AC-33', '16 AC-58']
    responses:
      '200':
        description: The code.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminPromoCode'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  patch:
    operationId: adminUpdatePromoCode
    summary: Edit a promo code
    description: |
      Before the first redemption every field may change. After it only `isActive`, `validUntil` and
      `maxTotalRedemptions` (not below redemptions so far) → other fields `422 BUSINESS_RULE_VIOLATION` with
      `details.fields` (spec 09 AC-27, P-59). Changes under the row lock used by redemptions (AC-31, EC-6).
      Errors: 400 VALIDATION_FAILED; 404 NOT_FOUND; 422 BUSINESS_RULE_VIOLATION.
    tags: [Admin Subscriptions]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: promo_codes.write
      ownership: none
    x-audit: promo_code.update
    x-covers: ['09 AC-27', '16 AC-58']
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d3.yaml#/PromoCodeUpdateRequest'}
    responses:
      '200':
        description: The code.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminPromoCode'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
  delete:
    operationId: adminDeletePromoCode
    summary: Delete an unused promo code
    description: 'Only before its first redemption (reservations included); afterwards `409 STATE_CONFLICT` — deactivate it instead (`isActive = false`) so redemptions stay visible (spec 09 AC-33; see D3 handoff Q). Audited.'
    tags: [Admin Subscriptions]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: promo_codes.write
      ownership: none
    x-audit: promo_code.delete
    x-covers: ['16 AC-58']
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/admin/promo-codes/{promoCodeId}/redemptions:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: promoCodeId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: adminListPromoCodeRedemptions
    summary: List a promo code's redemptions
    description: User, date, period, discount given, redemption and payment status (spec 09 AC-33).
    tags: [Admin Subscriptions]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/AdminLimit'
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../schemas/d3.yaml#/PromoRedemptionStatus'}
    x-permission:
      audience: staff
      permission: promo_codes.write
      ownership: none
    x-covers: ['09 AC-33', '16 AC-58']
    responses:
      '200':
        description: Page of redemptions.
        content:
          application/json:
            schema: {$ref: '../schemas/d3.yaml#/AdminPromoRedemptionPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

# ═════════════════════════ Admin: referral-code benefits (spec 09 AC-26; spec 16 AC-58) ═════════════════════════
/admin/referral-benefits:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: adminListReferralBenefits
    summary: List referral-code benefits
    tags: [Admin Subscriptions]
    security: [{staffBearer: []}, {staffCookie: []}]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/AdminLimit'
      - {name: isActive, in: query, required: false, schema: {type: boolean}}
