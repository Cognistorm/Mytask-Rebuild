/admin/kyc/{kycId}/files/{fileId}/download:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: kycId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
    - name: fileId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: adminGetKycFileDownload
    summary: Open a KYC image (short-lived signed link, audited)
    description: 'Staff with `kyc.review` only (spec 02 AC-39, spec 16 AC-27): 302 to a presigned GET valid 1–2 minutes from the private `kyc` bucket (ADR-009 §2), or `?mode=json` → `SignedUrl`. Every view writes the audit log (spec 16 AC-14). A file not attached to this verification → `404`.'
    tags: [Admin KYC]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission: {audience: staff, permission: kyc.review, ownership: 'file attached to this verification; otherwise 404'}
