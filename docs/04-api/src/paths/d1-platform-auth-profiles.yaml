    summary: Remove "unavailable until" early
    description: The user can receive orders and offer requests again (spec 02 AC-23).
    tags: [Profiles]
    x-permission: {audience: user, ownership: self}
    x-covers: ['02 AC-23']
    x-jobs: [availability-reset]
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

# ═════════════════════════════════════ Public profiles ═════════════════════════════════════
/users/{username}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: username
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 60}
  get:
    operationId: getUserProfile
    summary: Public profile
    description: |
      `/profile/{username}` (spec 02 AC-8). Only for status active/verified and not deleted; pending, banned,
      deleted or an old username after a rename → `404` (AC-9, EC-4). A restricted user's profile stays
      visible (R-P3). Two rating blocks, as freelancer and as client (AC-10, Q-062). Button flags for "Contact
      me" (chat, D5; guests log in first, AC-11), "Request an offer" (D4, S-034 ON and user available, AC-12),
      own profile → "Edit profile" (AC-13). Gigs: D2 `GET /gigs?sellerUsername=` (6 per page); portfolio:
      `listPortfolioItems`.
    tags: [Profiles]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission: {audience: optional-user, ownership: 'none (public data); flags depend on the viewer'}
    x-covers: ['02 AC-8', '02 AC-9', '02 AC-10', '02 AC-12', '02 AC-13', '17 AC-41']
    x-settings: [S-034, S-123]
    responses:
      '200':
        description: The profile.
        content:
          application/json:
            schema: {$ref: '../schemas/d1.yaml#/UserProfile'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/users/{username}/reports:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: username
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 60}
  post:
    operationId: createUserReport
    summary: Report a user profile
    description: |
      Reason required, ≤ 1,500 (spec 02 AC-14). A second report by the same person replaces the first
      (`200`, same report id); the first answers `201`. `Admin/ProfileReported` goes to every S-100 address
      (EV-13); the report appears in D6's reports queue. Reporting yourself → `403 FORBIDDEN`. Guests get
      `401` and the client shows `t_u_must_login_to_report_this_profile`. Unknown/hidden profile → `404`.
      Anti-abuse limit (SEC-23, CONVENTIONS §14): 10 reports per user per hour across the four report
      operations → `429 RATE_LIMITED`.
    tags: [Profiles]
    x-permission: {audience: user, ownership: 'any signed-in user except the profile owner'}
    x-covers: ['02 AC-14']
    x-settings: [S-100]
    x-notifications: [EV-13]
    x-rate-limit: 10 reports per user per hour, shared by createUserReport, createGigReport, createProjectReport and createProposalReport (SEC-23)
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d1.yaml#/UserReportCreateRequest'}
    responses:
      '200':
        description: Earlier report replaced (`t_profile_has_been_successfully_reported`).
        content:
          application/json:
            schema: {$ref: '../schemas/d1.yaml#/UserReport'}
      '201':
        description: Reported (`t_profile_has_been_successfully_reported`).
        content:
          application/json:
            schema: {$ref: '../schemas/d1.yaml#/UserReport'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

# ═════════════════════════════════════ Portfolio ═════════════════════════════════════
/portfolio-items:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: listPortfolioItems
    summary: A user's portfolio items
    description: |
      `/profile/{username}/portfolio` and the profile preview (spec 02 AC-28): only `active` items of that user,
      newest first. When the caller is that user, pending items (marked "Pending") and rejected items (marked
      `t_portfolio_status_rejected` with `rejectionReason`, spec 02 AC-42) are included, for the Selling →
      Portfolio page (web and mobile). Unknown/hidden profile → `404`.
    tags: [Portfolio]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission: {audience: optional-user, ownership: 'none; the owner also sees own pending/rejected items'}
    x-covers: ['02 AC-28', '02 AC-42']
    parameters:
      - name: username
        in: query
        required: true
        schema: {type: string, minLength: 1, maxLength: 60}
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: Items.
        content:
          application/json:
            schema: {$ref: '../schemas/d1.yaml#/PortfolioItemPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  post:
    operationId: createPortfolioItem
    summary: Create a portfolio item
    description: |
      Title 3–100, description ≥ 10, thumbnail and 1 to S-089 gallery images (purpose `portfolio_image`,
      JPG/PNG ≤ S-090 MB), optional project and video links (URL ≤ 120) (spec 02 AC-24). Slug = title slug +
      unique id. S-071 OFF → `pending` and `Admin/PendingPortfolio` to every S-100 address (EV-14); S-071 ON →
      `active` at once, no admin email (AC-25). Open to every user (R-P1).
    tags: [Portfolio]
    x-permission: {audience: user, ownership: 'caller becomes the owner (own files only)'}
    x-covers: ['02 AC-24', '02 AC-25']
    x-settings: [S-071, S-089, S-090, S-100]
    x-notifications: [EV-14]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d1.yaml#/PortfolioItemCreateRequest'}
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema: {$ref: '../schemas/d1.yaml#/PortfolioItem'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/portfolio-items/lookup:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: lookupPortfolioItem
    summary: Find a portfolio item by public uid or slug
    description: 'For `/profile/{username}/portfolio/{slug}` (spec 02 AC-28): `slug` (the uid is its suffix) or `uid`; exactly one. Returns the same schema as `getPortfolioItem`; if `slug` differs from the current one the web answers 301 by uid (url-map §4.3). Pending/rejected items → `404` except for the owner.'
    tags: [Portfolio]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission: {audience: optional-user, ownership: 'none for active items; owner only for pending/rejected (others 404)'}
    x-covers: ['02 AC-28']
    parameters:
      - name: uid
        in: query
        required: false
        schema: {type: string, maxLength: 20}
      - name: slug
        in: query
        required: false
        schema: {type: string, maxLength: 200}
    responses:
      '200':
        description: The item.
        content:
          application/json:
            schema: {$ref: '../schemas/d1.yaml#/PortfolioItem'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/portfolio-items/{portfolioItemId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: portfolioItemId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: getPortfolioItem
    summary: Get a portfolio item
    description: Thumbnail, gallery, description and links (spec 02 AC-28). Pending/rejected → `404` except for the owner, who also gets `rejectionReason` and `rejectedAt` of a rejected item (spec 02 AC-42).
    tags: [Portfolio]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission: {audience: optional-user, ownership: 'none for active items; owner only for pending/rejected (others 404)'}
    x-covers: ['02 AC-28', '02 AC-42']
    responses:
      '200':
        description: The item.
        content:
          application/json:
