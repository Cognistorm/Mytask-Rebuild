    operationId: adminGetUser
    summary: User page — overview
    description: |
      Overview tab (spec 16 AC-31): profile, status, language, registration, last activity, last login IP
      country, email-deliverability warning (spec 15 AC-11). Other tabs: `adminListKycVerifications`,
      `adminListRestrictions`, `adminListUserSessions` (D1) and the owners' admin lists with `?userId=`
      (balances/transactions/points/subscriptions/referrals D3 with `payments.read`; orders and custom offers
      D4; gigs and reviews D2; projects, proposals and conversations D5 with `chat.read`; reports and history
      D6). Deleted users are returned too (with the Restore banner data).
