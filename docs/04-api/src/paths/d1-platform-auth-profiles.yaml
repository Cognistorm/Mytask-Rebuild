  get:
    operationId: adminListUsers
    summary: Search users
    description: |
      Partial matches on username, email and full name, exact matches on legacy id and user id (`q`); filters
      status (active, pending, verified, banned, deleted — `deleted` is the "Deleted users" list), restricted,
      Premium, KYC status, registration date range, country; 50 per page, newest first (spec 16 AC-30).
      `totalCount` is returned.
    tags: [Admin Users]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission: {audience: staff, permission: users.read, ownership: none}
    x-covers: ['16 AC-30', '16 AC-34']
    parameters:
      - name: q
        in: query
        required: false
        schema: {type: string, minLength: 1, maxLength: 254}
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {type: string, enum: [pending, active, verified, banned, deleted]}
      - name: isRestricted
        in: query
        required: false
        schema: {type: boolean}
      - name: isPremium
        in: query
        required: false
        schema: {type: boolean}
      - name: kycStatus
        in: query
        required: false
        schema: {$ref: '../schemas/d1.yaml#/KycState'}
      - name: countryCode
        in: query
        required: false
        schema: {$ref: '../components/schemas.yaml#/CountryCode'}
      - $ref: '../components/parameters.yaml#/CreatedFrom'
      - $ref: '../components/parameters.yaml#/CreatedTo'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/AdminLimit'
