      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  patch:
    operationId: adminUpdateUser
    summary: Edit a user's username, name, headline, about or country
    description: Staff edits of spec 16 AC-32 (`users.edit`), same validation as the user forms. There is no field for a password, a balance, the account type or a level (AC-33). Audited with before/after values.
    tags: [Admin Users]
    security: [{staffBearer: []}, {staffCookie: []}]
