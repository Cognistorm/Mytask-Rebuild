# ═════════════════════════════════════ KYC ═════════════════════════════════════
/kyc:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: createKycVerification
    summary: Submit an ID verification
    description: |
      Document type + front (+ back, not for passports) + selfie, all `ready` files of purpose `kyc_document`
      (JPG/JPEG/PNG ≤ 5 MB) uploaded by the caller (spec 02 AC-36). Creates a `pending` verification and sends
      `Admin/NewIdVerificationPending` to every S-100 address (EV-16). With S-122 = manual it waits for staff
      review; the provider sits behind an interface (AC-40). Refused with `409 STATE_CONFLICT` while a
      verification is pending or verified (AC-38); after a decline the user may submit again without limit
      (EC-8). KYC is never required for other actions (AC-40).
    tags: [KYC]
    x-permission: {audience: user, ownership: self (own files only)}
    x-covers: ['02 AC-36', '02 AC-38', '02 AC-40']
    x-settings: [S-100, S-122]
    x-notifications: [EV-16]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d1.yaml#/KycVerificationCreateRequest'}
    responses:
      '201':
        description: Submitted.
        content:
          application/json:
            schema: {$ref: '../schemas/d1.yaml#/KycVerification'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

# ═════════════════════════════════════ Restriction appeals ═════════════════════════════════════
/restriction-appeals:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: createRestrictionAppeal
    summary: Appeal a restriction
    description: |
      Only for an own restriction in status `pending` (else `409 STATE_CONFLICT`; a rejected restriction
      cannot be appealed again, AC-49). Message required ≤ 1,500; when the restriction has `filesRequired`,
      1 to S-091 files of purpose `appeal_file`, each ≤ S-092 MB of the types in S-093 (spec 01 AC-47). The
      appeal is saved, the restriction becomes `submitted`, and `Admin/NewRestrictionAppeal` goes to every S-100
      address (EV-08). Appeal files are private; only staff download them (R-A8). Allowed for restricted users.
    tags: [Restrictions]
    x-permission: {audience: restricted-user, ownership: owner of the restriction; others 404}
    x-covers: ['01 AC-19', '01 AC-47']
    x-settings: [S-091, S-092, S-093, S-100]
    x-notifications: [EV-08]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d1.yaml#/RestrictionAppealCreateRequest'}
    responses:
      '201':
        description: Appeal received (`t_restriction_submitted`).
        content:
          application/json:
            schema: {$ref: '../schemas/d1.yaml#/Restriction'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

