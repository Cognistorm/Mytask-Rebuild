/custom-offers/{customOfferId}/cancel:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: customOfferId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: cancelCustomOffer
    summary: Cancel a paid offer before the first delivery (freelancer)
    description: |
      Spec 12 AC-29/AC-30 (P-94, MM-12-05): only a paid offer **without any delivery** (`in_progress`,
      no delivery). In one transaction (ref `escrow:{id}:refund`): offer `canceled`, P back to the
      buyer's Available balance (card fee and buyer fee not returned, Q-011), the freelancer's HOLD −P′,
      an open refund request closed (`closedBy = system`, spec 13 EC-5), a pending unblock request
      closed; the buyer is notified (EV-92). The buyer never cancels a paid offer (route: refund request).
      Errors: `409` STATE_CONFLICT (already delivered, completed, refunded; messageKey t_order_status_changed).
    tags: [Custom Offers]
    x-permission:
      audience: user
      ownership: author (freelancer) of the offer; the buyer gets 403, others 404
    x-covers: ['12 AC-29', '12 AC-30']
    x-money: true
    x-notifications: [EV-92]
    x-emits: [offer.updated, escrow.updated, refund.updated, wallet.balance_changed]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The canceled offer.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/CustomOffer'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

