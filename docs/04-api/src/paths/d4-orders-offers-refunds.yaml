      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

# ═════════════════════════ Custom offers (spec 12) ═════════════════════════
/custom-offers:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: listCustomOffers
    summary: List offers received (buyer) or sent (freelancer)
    description: |
      `role=buyer`: Buying → Offers "Received offers" (spec 12 AC-31; offers pending approval are not
      shown to the buyer). `role=freelancer`: Selling → Offers "Sent offers" with the expiry of sent
      ones (AC-32). Newest first; filter by status.
    tags: [Custom Offers]
    x-permission:
      audience: user
      ownership: offers where the caller is the buyer (role=buyer) or the author (role=freelancer)
    x-covers: ['12 AC-31', '12 AC-32']
    parameters:
      - name: role
        in: query
        required: true
        schema: {type: string, enum: [buyer, freelancer]}
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../schemas/d4.yaml#/CustomOfferStatus'}
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: A page of offers.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/CustomOfferPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
  post:
    operationId: createCustomOffer
    summary: Send a custom offer (freelancer)
    description: |
      Spec 12 AC-6…AC-11 (R-C2, R-C3). The caller is the author/freelancer; the recipient must share a
      direct conversation with them (`conversationId`) or the offer answers the recipient's open request
      (`requestId`, which becomes `answered`, AC-5). Refused when the recipient is banned, restricted,
      deleted, pending or the caller (AC-10), when S-034 is OFF (AC-1) and when S-007 is ON and the
      freelancer's counted offers reach S-005/S-006 (AC-2, P-9). Snapshot of every field and the fee
      rule versions; status `sent` with expiry = now + S-036 days (stored, AC-9, AC-20), or
      `pending_approval` while S-035 is ON (AC-11; notifies S-100, EV-81). The offer card appears in the
      direct conversation (D5); the buyer is notified (EV-80).
      Errors: `403` FEATURE_DISABLED (S-034); `422` PLAN_LIMIT_REACHED (messageKey
      t_plan_offer_limit_reached), OFFER_USER_UNAVAILABLE, BUSINESS_RULE_VIOLATION (no direct
      conversation and no open request of the recipient; see D4 handoff Q), FILE_*; `409`
      STATE_CONFLICT (request no longer open).
    tags: [Custom Offers]
    x-permission:
      audience: user
      ownership: the caller becomes the author (freelancer); recipient per R-C2
      toggles: [S-034]
    x-covers: ['12 AC-1', '12 AC-2', '12 AC-5', '12 AC-6', '12 AC-7', '12 AC-9', '12 AC-10', '12 AC-11', '12 AC-20']
    x-settings: [S-005, S-006, S-007, S-017, S-018, S-034, S-035, S-036, S-037, S-038, S-039, S-040, S-041]
    x-notifications: [EV-80, EV-81]
    x-emits: [offer.updated, offer.request_updated, message.created]
    x-jobs: [offer-expiry]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d4.yaml#/CustomOfferCreateRequest'}
    responses:
      '201':
        description: The sent (or pending-approval) offer.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/CustomOffer'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/custom-offers/preview:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: previewCustomOffer
    summary: Compute "You receive" and "Buyer pays" for the offer form
    description: Server-side fee computation for the typed price (spec 12 AC-8, P-6; S-017, S-018). No card fee (added only at card checkout). Nothing is stored.
    tags: [Custom Offers]
    x-permission:
      audience: user
