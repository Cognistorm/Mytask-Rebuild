            schema: {$ref: '../schemas/d4.yaml#/UnblockRequestPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
  post:
    operationId: createUnblockRequest
    summary: Ask MyTask to release the funds of a delivered item (freelancer)
    description: |
      Spec 13 AC-23/AC-24, spec 06 AC-45 (P-5, P-103): only while S-025 is OFF or S-029 is ON; a
      delivered item (gig order item, contract payment or custom offer) with no open refund request or
      dispute, at least S-028 hours since its latest delivery, and no pending request for it. Amount =
      the escrow balance now (display only). S-100 staff are notified (EV-104).
      Errors: `403` UNBLOCK_NOT_AVAILABLE; `422` UNBLOCK_TOO_EARLY, UNBLOCK_NO_DELIVERY,
      BUSINESS_RULE_VIOLATION (refund request or dispute open); `409` UNBLOCK_ALREADY_PENDING.
    tags: [Unblock Requests]
    x-permission:
      audience: user
      ownership: freelancer of the escrow (`escrowId`); others get 404
      notes: available only while S-025 is OFF or S-029 is ON (else 403 UNBLOCK_NOT_AVAILABLE)
    x-covers: ['06 AC-36', '06 AC-45', '13 AC-23', '13 AC-24', '13 AC-28']
    x-settings: [S-025, S-028, S-029]
    x-notifications: [EV-104]
    x-emits: [unblock.updated]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d4.yaml#/UnblockRequestCreateRequest'}
    responses:
      '201':
        description: The pending unblock request.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/UnblockRequest'}
