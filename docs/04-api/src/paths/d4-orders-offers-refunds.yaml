      transaction: request `pending` with seller deadline = now + S-030 days (stored, AC-9), escrow
      `refundOpen` and auto-release paused (`refund_open`, 06 AC-34), a pending unblock request closed
      (AC-27), the refund thread created (D5); the freelancer is notified (EV-93). Gig items before the
      start are canceled instead (`cancelOrderItem`).
      Errors: `409` REFUND_ALREADY_REQUESTED; `422` REFUND_NOT_ELIGIBLE.
