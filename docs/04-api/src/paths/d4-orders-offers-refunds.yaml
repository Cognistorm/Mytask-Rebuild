  get:
    operationId: getCustomOffer
    summary: Get a custom offer (card, offer page)
    description: |
      The offer card in chat and the offer page (spec 12 AC-12, AC-33; spec 08 AC-27): full offer,
      attachments (signed links via `getFileDownload`), expiry, escrow state, thread reference, "Late"
      (AC-23), reviews (AC-35) and the caller's actions. Readable (read-only actions) also while S-034
      is OFF. Offers pending approval are invisible to the buyer (AC-11). Others get 404.
