    summary: Find a custom offer by its public uid
    description: For `/account/offers/{uid}`, `/seller/offers/{uid}` and `/checkout/offer/{uid}` (url-map §3). Same result and access rule as `getCustomOffer`.
    tags: [Custom Offers]
