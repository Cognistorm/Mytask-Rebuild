    description: |
      Admin → Escrows (spec 16 AC-39): every open HOLD (default `status=funded`) with item, freelancer,
      buyer, amount, status, delivered at, auto-release deadline or the pause reason (revision, refund
      request, dispute, auto-release OFF). `totalAmount` sums all matching escrows; with the default
      filter it equals the platform HOLD balance. Newest first.
      `overdue=true` (safest reading of AC-39, see D4 handoff Q): funded escrows whose auto-release
      deadline has passed (e.g. while S-025 is OFF) or whose item is past its expected delivery date
      without a delivery.
    tags: [Admin Escrows]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
