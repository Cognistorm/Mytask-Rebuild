/admin/escrows/{escrowId}/release:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: escrowId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: adminReleaseEscrow
    summary: '"Release funds": pay a paid, unfinished item to the freelancer'
    description: |
      Spec 13 AC-29 (P-5, MM-13-05), spec 16 AC-38: any funded escrow **without an open dispute**
      (disputes are decided with `adminResolveDispute`). Same release service and ref
      (`escrow:{id}:release`) as the buyer's completion: item `completed` (`completedBy = staff`,
      close reason `admin_release`; gig sales +1, queue −1), escrow balance → the freelancer's Available
      balance, an open refund request `closed` (`closedBy = staff`), a pending unblock request
      `approved`; both parties notified with the public note (EV-106). A second attempt changes nothing
      and gets `409` (AC-31). Step-up re-authentication (spec 16 AC-7). Audited with amounts and reasons.
      Errors: `409` STATE_CONFLICT (already released/refunded; messageKey t_order_status_changed); `422` DISPUTE_OPEN.
    tags: [Admin Escrows]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: escrow.release
      stepUp: true
      ownership: none
    x-covers: ['12 AC-28', '12 AC-34', '13 AC-29', '13 AC-31', '16 AC-38', '11 AC-38']
    x-money: true
    x-audit: escrow.release
    x-notifications: [EV-106]
    x-emits: [escrow.updated, order.item_updated, offer.updated, refund.updated, unblock.updated, wallet.balance_changed, contract.status_changed]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d4.yaml#/EscrowStaffActionRequest'}
    responses:
      '200':
        description: The released escrow.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/AdminEscrow'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/admin/escrows/{escrowId}/refund:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: escrowId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: adminRefundEscrow
    summary: '"Refund buyer": refund a paid, unfinished item to the buyer''s wallet'
    description: |
      Spec 13 AC-30 (MM-13-06), spec 16 AC-38: any funded escrow, with or without a refund request.
      Same refund service and ref (`escrow:{id}:refund`) as the seller's acceptance: item `refunded`
      (gig queue −1), P to the buyer's Available balance (card fee and buyer fees not returned), an open
      request `accepted_by_admin`, a pending unblock request `closed`; both parties notified with the
      public note (EV-109). A second attempt gets `409` (AC-31). Step-up re-authentication (spec 16
      AC-7). Audited. With an open dispute, staff decide it with `adminResolveDispute` instead
      (`422` DISPUTE_OPEN; see D4 handoff Q).
      Errors: `409` STATE_CONFLICT (messageKey t_order_status_changed); `422` DISPUTE_OPEN.
    tags: [Admin Escrows]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: escrow.refund
      stepUp: true
      ownership: none
    x-covers: ['12 AC-34', '13 AC-30', '13 AC-31', '16 AC-38', '00 AC-15']
    x-money: true
    x-audit: escrow.refund
    x-notifications: [EV-109, EV-108]
    x-emits: [escrow.updated, order.item_updated, offer.updated, refund.updated, unblock.updated, wallet.balance_changed, contract.status_changed]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d4.yaml#/EscrowStaffActionRequest'}
    responses:
      '200':
        description: The refunded escrow.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/AdminEscrow'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

