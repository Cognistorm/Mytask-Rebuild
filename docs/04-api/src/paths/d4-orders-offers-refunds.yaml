      permission: payments.read
      ownership: none
    x-covers: ['16 AC-31', '16 AC-39']
    parameters:
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../components/schemas.yaml#/EscrowStatus'}
          default: [funded]
      - name: kind
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../components/schemas.yaml#/EscrowKind'}
      - name: pausedReason
