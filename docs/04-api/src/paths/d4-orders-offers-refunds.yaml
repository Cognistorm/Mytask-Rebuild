/admin/disputes/{disputeId}/resolve:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: disputeId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: adminResolveDispute
    summary: Decide a dispute (refund the buyer or release to the freelancer)
    description: |
      Spec 13 AC-16…AC-18, AC-20 (P-102), final in the product.
      `refund_to_buyer` (MM-13-02, ref `escrow:{id}:refund`): item `refunded`, P to the buyer's Available
      balance, request `accepted_by_admin`; EV-102.
      `release_to_freelancer` (MM-13-03, ref `escrow:{id}:release`): item `completed` (gig sales +1,
      queue −1), escrow balance to the freelancer, request `rejected_by_admin`; both may review; EV-103.
      In both: dispute `resolved`, the refund thread becomes read-only, a pending unblock request is
      closed, the public note goes to both parties; audited with staff, time, decision, amounts and
      reasons. Step-up re-authentication (spec 16 AC-7). The first decision wins; a concurrent decision
      or buyer action gets `409` (AC-20, AC-31).
      Errors: `409` STATE_CONFLICT (messageKey t_order_status_changed).
    tags: [Admin Disputes]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: refunds.resolve
      stepUp: true
      ownership: none
    x-covers: ['06 AC-35', '13 AC-16', '13 AC-17', '13 AC-18', '13 AC-20', '13 AC-31', '16 AC-40', '00 AC-15']
    x-money: true
    x-audit: dispute.resolve
    x-notifications: [EV-102, EV-103, EV-108]
    x-emits: [refund.updated, escrow.updated, order.item_updated, offer.updated, unblock.updated, wallet.balance_changed, contract.status_changed]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d4.yaml#/DisputeResolveRequest'}
    responses:
      '200':
        description: The resolved dispute.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/AdminDispute'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

