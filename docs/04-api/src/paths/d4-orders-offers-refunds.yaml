      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: declineCustomOffer
    summary: Decline a sent offer (buyer)
    description: |
      Spec 12 AC-16: a `sent` offer becomes `declined` with an optional reason (≤ 500); the freelancer
      is notified (EV-83). No money moves.
      Errors: `409` STATE_CONFLICT (not `sent`); `422` OFFER_NO_LONGER_AVAILABLE (expired).
    tags: [Custom Offers]
    x-permission:
      audience: user
      ownership: recipient (buyer) of the offer; the author gets 403, others 404
    x-covers: ['12 AC-16']
    x-notifications: [EV-83]
    x-emits: [offer.updated]
    requestBody:
      required: false
      content:
        application/json:
          schema: {$ref: '../schemas/d4.yaml#/CustomOfferDeclineRequest'}
    responses:
      '200':
        description: The declined offer.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/CustomOffer'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/custom-offers/{customOfferId}/withdraw:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: customOfferId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: withdrawCustomOffer
    summary: Withdraw an unpaid offer (freelancer)
    description: |
      Spec 12 AC-17 (P-94): a `sent` (or `pending_approval`) offer becomes `withdrawn`; the buyer is
      notified (EV-84). Refused while a card payment for it is pending (EC-2). No money moves.
      Errors: `409` OFFER_PAYMENT_IN_PROGRESS, STATE_CONFLICT (already paid, declined, expired…).
    tags: [Custom Offers]
    x-permission:
      audience: user
      ownership: author (freelancer) of the offer; the recipient gets 403, others 404
    x-covers: ['12 AC-17']
    x-notifications: [EV-84]
    x-emits: [offer.updated]
    responses:
      '200':
