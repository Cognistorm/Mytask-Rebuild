            schema: {$ref: '../schemas/d4.yaml#/RevisionRequest'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/escrows/{escrowId}/complete:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: escrowId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: completeEscrow
    summary: Complete the item and release the money (buyer)
    description: |
      "Complete order" / "Complete project" (spec 06 AC-30…AC-32, 11 AC-36…AC-38, 12 AC-25/AC-26).
      Only on a delivered item (not in progress, not revision requested) without an open dispute. In
      one transaction (MM-06-03 / MM-11-03 / MM-12-03, ref `escrow:{id}:release`): item `completed`
      (`completedBy = buyer`; contract → project completed), the escrow balance H → the freelancer's
      Available balance, gig queue −1 and sales +1 (gig orders), an open refund request closed
      (`closedBy = system`, spec 13 AC-14), a pending unblock request closed (13 AC-27); notifications
      EV-42/43, EV-75, EV-90. The client then opens the review form (D2 `createReview`). The same ref
      is used by the auto-release sweeper and the staff tools, so a concurrent completion posts once
      and the loser gets `409` (06 AC-39, 11 AC-38, 12 AC-28, 13 AC-31).
      Errors: `422` DISPUTE_OPEN; `409` STATE_CONFLICT (messageKey t_order_status_changed).
    tags: [Escrows]
    x-permission:
      audience: user
      ownership: buyer of the escrow; the freelancer gets 403, others 404
    x-covers: ['06 AC-30', '06 AC-31', '06 AC-32', '06 AC-39', '11 AC-36', '11 AC-37', '11 AC-38', '12 AC-25', '12 AC-26', '12 AC-28', '13 AC-13', '13 AC-14', '13 AC-27', '13 AC-31', '00 AC-14']
    x-money: true
    x-notifications: [EV-42, EV-43, EV-75, EV-90, EV-108]
    x-emits: [escrow.updated, order.item_updated, offer.updated, refund.updated, unblock.updated, wallet.balance_changed, contract.status_changed]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The released escrow.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/Escrow'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
