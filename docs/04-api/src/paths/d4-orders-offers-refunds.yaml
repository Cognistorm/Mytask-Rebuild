# D4 — paths for specs 06 (cart, gig orders), 12 (custom offers), 13 (refunds, disputes, unblock) and the
# shared escrow lifecycle /escrows/{escrowId} (deliveries, revision requests, completion) that serves gig
# order items, project contract payments (D5) and custom offers (data-model §3.I, CONVENTIONS §5.2).
# Written by the P2-B4 D4 group run (2026-09-29).
#
# Not here, by design (CONVENTIONS §5.3, §5.4):
#   - paying (cart checkout, "Pay" again, accept-and-pay of an offer): D3 `createCheckoutQuote` / `createPayment`
#     with the shared CheckoutTarget; return pages poll D3 `getPayment`.
#   - thread messages (delivery, offer, refund threads): D5 conversations (`ConversationRef` on items).
#   - timers: worker sweepers (ADR-008), never HTTP: `escrow-auto-release`, `refund-auto-reject`, `offer-expiry`.
# Every money-moving operation (x-money) uses the ledger refs `escrow:{id}:release` / `escrow:{id}:refund`,
# which are mutually exclusive: each escrow is paid out exactly once (spec 13 R-R5, ADR-003 §5–§6).

# ═════════════════════════ Cart (spec 06 AC-1…AC-6) ═════════════════════════
/cart:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: getCart
    summary: Get the caller's cart (re-validated, priced)
    description: |
      The account cart shared by web and mobile (P-47). Every read re-checks each line against current
      data (spec 06 AC-6): gig active and listable, owner available and not restricted, caller not the
      owner, upgrades exist. Failing lines/upgrades are removed and reported once in `notices`. Prices
      and delivery times always come from current gig data.
    tags: [Cart]
    x-permission:
      audience: user
      ownership: self (own cart)
    x-covers: ['06 AC-1', '06 AC-3', '06 AC-4', '06 AC-6']
    responses:
      '200':
        description: The cart.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/Cart'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/cart/items/{gigId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: gigId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  put:
    operationId: putCartItem
    summary: Add a gig to the cart or replace its line
    description: |
      Quantity is always 1 (P-46). Adding the same gig again replaces its line with the new upgrade
      choice (spec 06 AC-1). Refused when the gig is not orderable, the seller is unavailable or
      restricted, or the caller owns the gig (AC-2, spec 04 AC-29/AC-30).
      Errors: `422` CART_ITEM_NOT_ORDERABLE, CART_UPGRADE_NOT_FOUND; `404` unknown or hidden gig.
    tags: [Cart]
    x-permission:
      audience: user
      ownership: self (own cart); the gig must not be the caller's own
    x-covers: ['06 AC-1', '06 AC-2', '06 AC-4', '04 AC-29', '04 AC-30']
    x-emits: [cart.updated]
    requestBody:
      required: false
      content:
        application/json:
          schema: {$ref: '../schemas/d4.yaml#/CartItemPutRequest'}
    responses:
      '200':
        description: The updated cart.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/Cart'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
  delete:
    operationId: deleteCartItem
    summary: Remove a gig from the cart
    tags: [Cart]
    x-permission:
      audience: user
      ownership: self (own cart); a gig that is not in the cart gives 404
    x-covers: ['06 AC-3']
    x-emits: [cart.updated]
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/cart/merge:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: mergeCart
    summary: Merge the device (guest) cart into the account cart after login
    description: |
      Called once right after login/registration (spec 06 AC-4, AC-5). For a gig present in both carts
      the newer line wins (`addedAt`). Lines that are not orderable are dropped and reported in
      `notices` (AC-6). The client then clears its device cart.
    tags: [Cart]
    x-permission:
      audience: user
      ownership: self (own cart)
    x-covers: ['06 AC-4']
    x-emits: [cart.updated]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d4.yaml#/CartMergeRequest'}
    responses:
      '200':
        description: The merged cart.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/Cart'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/cart/preview:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: previewCart
    summary: Price and validate a guest cart kept on the device
    description: |
      Guests keep their cart on the device (P-47); this operation returns it as a priced `Cart` with the
      same checks as `getCart` (spec 06 AC-3, AC-6), so clients never compute totals. Nothing is
      stored. A signed-in caller also gets the "own gig" check (AC-2).
    tags: [Cart]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission:
      audience: optional-user
      ownership: none (nothing stored)
    x-covers: ['06 AC-1', '06 AC-2', '06 AC-3', '06 AC-6']
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d4.yaml#/CartPreviewRequest'}
    responses:
      '200':
        description: The priced guest cart (`updatedAt` null).
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/Cart'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}

# ═════════════════════════ Gig orders (spec 06) ═════════════════════════
/orders/items:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: listOrderItems
    summary: List the caller's order items as buyer or as freelancer
    description: |
      `role=buyer`: Buying → Orders (spec 06 AC-42), including items of orders awaiting payment.
      `role=freelancer`: Selling → Orders (AC-43), paid items only (awaiting-payment orders never
      appear). Newest first. Each item carries its next actions (`actions`, `escrowActions`).
    tags: [Orders]
    x-permission:
      audience: user
      ownership: items where the caller is the buyer (role=buyer) or the freelancer (role=freelancer)
    x-covers: ['06 AC-11', '06 AC-42', '06 AC-43']
    parameters:
      - name: role
        in: query
        required: true
        schema: {type: string, enum: [buyer, freelancer]}
      - name: filter
        in: query
        required: false
        schema: {$ref: '../schemas/d4.yaml#/OrderItemListFilter'}
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: A page of order items.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/OrderItemPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/orders/items/lookup:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: lookupOrderItem
    summary: Find an order item by its public uid (or legacy id)
    description: |
      For the pages `/account/orders/{itemUid}` and `/seller/orders/{itemUid}` and for the 301s of the
      legacy URLs (`?orderId=&itemId=`, `/seller/orders/details/{id}`, url-map §3). Exactly one of `uid`
      or `legacyItemId`. Same result and access rule as `getOrderItem`.
    tags: [Orders]
    x-permission:
      audience: user
      ownership: buyer or freelancer of the item (the freelancer only once paid); others get 404
    x-covers: ['06 AC-44']
    parameters:
      - name: uid
        in: query
        required: false
        schema: {type: string, maxLength: 40}
      - name: legacyItemId
        in: query
        required: false
        schema: {type: integer, format: int64, minimum: 1}
    responses:
      '200':
        description: The order item.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/OrderItem'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/orders/{orderId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: orderId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: getOrder
    summary: Get an order (all its items) as its buyer
    description: |
      The order created by D3 `createPayment` from the cart, with the snapshot of every item (spec 06
      AC-7) and its payment state (AC-8, AC-9, AC-11). Freelancers read their own items with
      `getOrderItem` (an order may contain items of several freelancers, EC-5).
    tags: [Orders]
    x-permission:
      audience: user
      ownership: buyer of the order; others get 404
    x-covers: ['06 AC-7', '06 AC-8', '06 AC-11', '06 AC-44']
    responses:
      '200':
        description: The order.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/Order'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  delete:
    operationId: deleteOrder
    summary: Delete an order that is still awaiting payment
    description: |
      "Delete" of spec 06 AC-11/AC-12: only while the order is awaiting payment; the order becomes
      `deleted` (kept for audit) and **no money moves** (fixes R-005, R-014). A card payment verified
      later becomes an unapplied payment in the buyer's wallet (EC-2, spec 05 AC-15, D3).
      Errors: `409` STATE_CONFLICT (already paid or deleted; messageKey t_order_status_changed).
    tags: [Orders]
    x-permission:
      audience: user
      ownership: buyer of the order; others get 404
    x-covers: ['06 AC-11', '06 AC-12']
    x-emits: [order.item_updated]
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/orders/{orderId}/items/{orderItemId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: orderId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
    - name: orderItemId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: getOrderItem
    summary: Get an order item (buyer or freelancer page)
    description: |
      The buyer and freelancer order-item pages (spec 06 screens): snapshot header (price, upgrades,
      delivery time, revisions allowed and left), status, order details, escrow state (deliveries via
      `listEscrowDeliveries`), thread reference, refund state, reviews and the caller's actions.
      Anyone else gets 404 (AC-44).
    tags: [Orders]
    x-permission:
      audience: user
      ownership: buyer or freelancer of the item (the freelancer only once paid); others get 404
    x-covers: ['06 AC-7', '06 AC-13', '06 AC-25', '06 AC-27', '06 AC-29', '06 AC-41', '06 AC-44']
    responses:
      '200':
        description: The order item.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/OrderItem'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/orders/{orderId}/items/{orderItemId}/requirements:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: orderId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
    - name: orderItemId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  put:
    operationId: putOrderItemRequirements
    summary: Send or edit the order details (buyer)
    description: |
      "Send order details" (spec 06 AC-13, P-48): required formatted text, 1–5,000 characters,
      sanitised (profile `user_text_links`, CONVENTIONS §19). Editable until the freelancer starts; read-only afterwards (AC-14). Each save notifies
      the freelancer (AC-15, EV-36).
      Errors: `409` STATE_CONFLICT (not paid yet: messageKey t_we_are_waiting_for_payment_first; already
      started: t_u_cant_submit_requirements_for_item).
    tags: [Orders]
    x-permission:
      audience: user
      ownership: buyer of the item; others get 404
    x-covers: ['06 AC-13', '06 AC-14', '06 AC-15']
    x-notifications: [EV-36]
    x-emits: [order.item_updated]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d4.yaml#/OrderItemRequirementsPutRequest'}
    responses:
      '200':
        description: The updated order item.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/OrderItem'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/orders/{orderId}/items/{orderItemId}/start:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: orderId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
    - name: orderItemId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: startOrderItem
    summary: Start work on a paid item (freelancer)
    description: |
      Spec 06 AC-16/AC-17: refused without order details; otherwise status `in_progress`, start time
      stored, expected delivery = start + delivery days + upgrades' extra days (snapshot); buyer notified
      (EV-37). The confirmation dialog is client-side.
      Errors: `422` ORDER_REQUIREMENTS_MISSING; `409` STATE_CONFLICT (not `paid`; messageKey t_order_status_changed).
    tags: [Orders]
    x-permission:
      audience: user
      ownership: freelancer of the item; others get 404
    x-covers: ['06 AC-16', '06 AC-17']
    x-notifications: [EV-37]
    x-emits: [order.item_updated]
    responses:
      '200':
        description: The started order item.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/OrderItem'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/orders/{orderId}/items/{orderItemId}/cancel:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: orderId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
    - name: orderItemId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: cancelOrderItem
    summary: Cancel a paid item before the start (buyer or freelancer)
    description: |
      Spec 06 AC-18/AC-19 (MM-06-05): only a **paid, not started** item. In one transaction: item
      `canceled`, escrow refunded (`escrow:{id}:refund`): P back to the buyer's Available balance (card
      fee and buyer-paid fees are not returned), the freelancer's HOLD −P′, gig queue −1, an open refund
      request closed, the other side notified (EV-38 / EV-39). Awaiting-payment orders have nothing to
      cancel: use `deleteOrder` (AC-12). In progress, delivered or in revision: refused, the buyer's
      route is a refund request (AC-20). A concurrent cancel by the other side moves the money once;
      the loser gets `409` (AC-21).
      Errors: `409` STATE_CONFLICT (messageKey t_order_status_changed).
    tags: [Orders]
    x-permission:
      audience: user
      ownership: buyer or freelancer of the item; others get 404
    x-covers: ['06 AC-12', '06 AC-18', '06 AC-19', '06 AC-20', '06 AC-21']
    x-money: true
    x-notifications: [EV-38, EV-39]
    x-emits: [order.item_updated, escrow.updated, wallet.balance_changed]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The canceled order item.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/OrderItem'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

# ═════════════════════════ Escrows: delivery, revision, completion (specs 06, 11, 12, 13) ═════════════════════════
/escrows/{escrowId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: escrowId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: getEscrow
    summary: Get an escrow (work, timer and actions of a paid item)
    description: |
      One escrow per paid gig order item, contract payment or custom offer (data-model §3.I). Shows
      revisions allowed/used (snapshot), deliveries count, the auto-release deadline (null while
      paused, with `autoReleasePausedReason`), S-025 state, refund/unblock state and the caller's actions
      (revision, completion, refund, unblock availability). The policy follows the item type: buyer =
      order buyer, contract client or offer recipient; freelancer = seller, contract freelancer or offer
      author.
    tags: [Escrows]
    x-permission:
      audience: user
      ownership: buyer or freelancer of the escrow; others get 404
    x-covers: ['06 AC-25', '06 AC-29', '06 AC-32', '06 AC-33', '06 AC-36', '06 AC-45', '11 AC-37', '11 AC-39', '12 AC-26', '12 AC-27', '13 AC-1', '13 AC-2', '13 AC-3', '13 AC-23', '00 AC-18']
    x-settings: [S-025, S-026, S-028, S-029]
    responses:
      '200':
        description: The escrow.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/Escrow'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/escrows/{escrowId}/deliveries:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: escrowId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: listEscrowDeliveries
    summary: List the deliveries of an escrow (history, oldest first)
    description: Every delivery stays in the history (append-only, spec 06 AC-23, R-O9). Oldest first (numbered 1, 2, 3…).
    tags: [Escrows]
    x-permission:
      audience: user
      ownership: buyer or freelancer of the escrow; others get 404
    x-covers: ['06 AC-23', '11 AC-32', '12 AC-33']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: A page of deliveries.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/DeliveryPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  post:
    operationId: createEscrowDelivery
    summary: Deliver work (freelancer)
    description: |
      Shared by gig order items (spec 06 AC-22…AC-24), contracts (11 AC-32) and custom offers
      (12 AC-21). Allowed when the item is in progress or has a revision requested (also while a
      dispute is open: stored as evidence, no timer, spec 13 AC-13). Stores delivery N+1 (message
      ≤ 2,500, at most one `ready` `delivery` file uploaded with `createFileUpload` context
      `{escrowId}`, S-086/S-087), item status `delivered`, `lastDeliveredAt`; unless a refund request
      or dispute is open, `autoReleaseAt` = now + S-026 hours (a fresh full period on every
      re-delivery, stored with the hours used; later S-026 changes do not move it, 06 AC-28, AC-38).
      Notifies the buyer (EV-40 / EV-73 / EV-87) with the automatic completion date while S-025 is ON.
      Errors: `409` STATE_CONFLICT (already delivered and no revision requested: messageKey
      t_looks_like_u_already_uploaded_completed_work; completed/refunded/canceled:
      t_u_cant_send_delivered_work_anymore_status_wrong); `422` FILE_NOT_READY, FILE_PURPOSE_MISMATCH.
    tags: [Escrows]
    x-permission:
      audience: user
      ownership: freelancer of the escrow; the buyer gets 403, others 404
    x-covers: ['06 AC-22', '06 AC-23', '06 AC-28', '06 AC-38', '11 AC-32', '12 AC-21', '13 AC-13', '13 AC-14']
    x-settings: [S-025, S-026, S-086, S-087]
    x-notifications: [EV-40, EV-73, EV-87]
    x-emits: [escrow.updated, order.item_updated, offer.updated, contract.status_changed]
    x-jobs: [escrow-auto-release]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d4.yaml#/DeliveryCreateRequest'}
    responses:
      '201':
        description: The new delivery.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/Delivery'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/escrows/{escrowId}/revision-requests:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: escrowId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: listEscrowRevisionRequests
    summary: List the revision requests of an escrow (oldest first)
    description: Lets the freelancer page highlight the latest revision message (spec 06 screens, 11 AC-42).
    tags: [Escrows]
    x-permission:
      audience: user
      ownership: buyer or freelancer of the escrow; others get 404
    x-covers: ['06 AC-26']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: A page of revision requests.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/RevisionRequestPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  post:
    operationId: createEscrowRevisionRequest
    summary: Request a revision (buyer)
    description: |
      Spec 06 AC-25…AC-27 (P-50), 11 AC-33, 12 AC-22: only on a delivered item with revisions used <
      revisions allowed (snapshot) and no open dispute. In one transaction: status
      `revision_requested`, revisions used +1, auto-release deadline removed (paused
      `revision_requested`), expected delivery date unchanged; the message is also shown in the item
      thread (D5 system event); the freelancer is notified (EV-41 / EV-74 / EV-88). If the sweeper
      locked the escrow first, the request loses with `409` and the item is completed (EC-7).
      Errors: `422` REVISION_LIMIT_REACHED, DISPUTE_OPEN; `409` STATE_CONFLICT (messageKey t_order_status_changed).
    tags: [Escrows]
    x-permission:
      audience: user
      ownership: buyer of the escrow; the freelancer gets 403, others 404
    x-covers: ['06 AC-26', '06 AC-27', '11 AC-33', '12 AC-22', '13 AC-13', '00 AC-19']
    x-notifications: [EV-41, EV-74, EV-88]
    x-emits: [escrow.updated, order.item_updated, offer.updated, message.created, contract.status_changed]
    x-jobs: [escrow-auto-release]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d4.yaml#/RevisionRequestCreateRequest'}
    responses:
      '201':
        description: The revision request.
        content:
