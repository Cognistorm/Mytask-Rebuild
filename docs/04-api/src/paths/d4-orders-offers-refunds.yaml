/admin/unblock-requests/{unblockRequestId}/approve:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: unblockRequestId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: adminApproveUnblockRequest
    summary: Approve an unblock request (release the escrow)
    description: |
      Spec 13 AC-25 (MM-13-04; one action for list and detail, fixes R-012): in one transaction the item
      is completed exactly like a buyer completion (ref `escrow:{id}:release`, close reason
      `unblock_approved`; gig sales +1, queue −1), the request `approved`; the freelancer (EV-105) and
      the buyer (EV-106) are notified; both may review. If the item was already released (e.g. the
      re-enabled auto-release won, AC-28) the request is closed and `409` returned. Step-up
      re-authentication (spec 16 AC-7). Audited.
      Errors: `409` STATE_CONFLICT (messageKey t_order_status_changed).
    tags: [Admin Disputes]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: escrow.release
      stepUp: true
      ownership: none
    x-covers: ['13 AC-25', '13 AC-28', '13 AC-31', '16 AC-41']
    x-money: true
    x-audit: unblock_request.approve
    x-notifications: [EV-105, EV-106]
    x-emits: [unblock.updated, escrow.updated, order.item_updated, offer.updated, wallet.balance_changed, contract.status_changed]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The approved request.
        content:
          application/json:
            schema: {$ref: '../schemas/d4.yaml#/AdminUnblockRequest'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

