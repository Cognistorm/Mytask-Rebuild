  post:
    operationId: acceptRefundRequest
    summary: Accept a pending refund request (freelancer)
    description: |
      Spec 13 AC-6 (MM-13-01, ref `escrow:{id}:refund`): in one transaction the item becomes `refunded`
      (gig queue −1), P returns to the buyer's Available balance (H + reversal of freelancer-paid fees;
      card fee and buyer fees are not returned), the escrow closes (`refund_accepted_by_seller`), the
      request becomes `accepted_by_seller`, the thread becomes read-only, a pending unblock request is
      closed (AC-27); the buyer is notified (EV-94). A race with the sweeper or the buyer closing gives
      `409` (EC-1, AC-20).
      Errors: `409` STATE_CONFLICT (messageKey t_order_status_changed).
