  post:
    operationId: closeRefundRequest
    summary: Close a pending refund request (buyer)
    description: |
      Spec 13 AC-10/AC-11: request `closed` (`closedBy = buyer`), `refundOpen` removed; on a delivered
      item (not in revision) a fresh S-026 period starts now (06 AC-35); the freelancer is notified
      (EV-97). A race with a staff decision or the seller's answer gives `409` (AC-20).
      Errors: `409` STATE_CONFLICT (not pending; messageKey t_order_status_changed).
