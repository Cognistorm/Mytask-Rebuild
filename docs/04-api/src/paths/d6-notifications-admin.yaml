      - $ref: '../components/parameters.yaml#/CreatedTo'
      - $ref: '../components/parameters.yaml#/UserIdFilter'
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../schemas/d6.yaml#/NotificationDeliveryStatus'}
      - name: channel
        in: query
        required: false
        schema: {type: string, enum: [email, push, sms]}
      - name: eventId
        in: query
        required: false
        schema: {$ref: '../schemas/d6.yaml#/NotificationEventId'}
