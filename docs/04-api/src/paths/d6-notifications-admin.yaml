# D6 — paths for specs 15 (notifications) and 16 (admin platform: staff auth, staff/roles, audit,
# dashboard, reports queue, settings, fee rules, custom code, translations, analytics, system).
# Written by the P2-B4 D6 group run (2026-09-29). Conventions: docs/04-api/CONVENTIONS.md.
# Staff operations: exactly one permission (or '@self', CONVENTIONS §6.1); high-risk ones carry stepUp (spec 16 AC-7).

# ═════════════════════════════════ Notification centre (spec 15) ═════════════════════════════════
/notifications:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: listNotifications
    summary: List own notifications (read and unread, newest first)
    description: |
      Notification centre and bell dropdown (spec 15 AC-13, P-107): read and unread rows, newest first,
      20 per page (the web dropdown asks `limit=10`). Texts are keys + params, rendered by the client in
      the reader's current language as plain text (AC-15, EC-1). `targetPath` is locale-free (AC-5).
      Rows older than 12 months are deleted nightly (AC-17). Restricted users still see their notifications.
    tags: [Notifications]
    x-permission:
      audience: restricted-user
      ownership: self (own notifications only)
    x-covers: ['15 AC-5', '15 AC-13']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: unreadOnly
        in: query
        required: false
        schema: {type: boolean, default: false}
    responses:
      '200':
        description: A page of notifications plus the unread count.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/NotificationPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}

/notifications/unread-count:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: getNotificationUnreadCount
    summary: Bell count and app-icon badge count
    description: Unread notifications (the bell shows `99+` above 99) and the badge = unread notifications + conversations with unseen messages (spec 15 AC-12, AC-25). Realtime updates arrive as `notification.created`, `notification.read`, `badge.updated`; after reconnect or app resume clients re-read this.
    tags: [Notifications]
    x-permission:
      audience: restricted-user
      ownership: self
    x-covers: ['15 AC-12', '15 AC-25']
    responses:
      '200':
        description: Counters.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/NotificationUnreadCount'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}

/notifications/read-all:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: markAllNotificationsRead
    summary: Mark all own notifications as read
    description: '"Mark all as read" (`t_mark_all_as_read`, spec 15 AC-14, P-107). Every open tab and device updates through `notification.read` and `badge.updated`. Idempotent.'
    tags: [Notifications]
    x-permission:
      audience: restricted-user
      ownership: self
    x-covers: ['15 AC-14']
    x-emits: [notification.read, badge.updated]
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/NotificationReadAllResult'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/notifications/{notificationId}/read:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: notificationId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: markNotificationRead
    summary: Mark one notification as read
    description: Tapping a notification or "Mark as read" (`t_mark_as_read`, spec 15 AC-14). Idempotent (already read → same result). Works also when the target no longer exists (AC-16). Another user's notification → 404.
    tags: [Notifications]
    x-permission:
      audience: restricted-user
      ownership: recipient of the notification; others get 404
    x-covers: ['15 AC-14']
    x-emits: [notification.read, badge.updated]
    responses:
      '200':
        description: The notification, now read.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/Notification'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

# ═════════════════════════════════ Preferences (spec 15 AC-27…AC-30) ═════════════════════════════════
/notification-preferences:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: getNotificationPreferences
    summary: Get own notification preferences
    description: The four switchable categories with their Email / Push switches (ON by default for new and migrated users, AC-29) and the locked "Always on" group (spec 15 AC-27, P-106).
    tags: [Notifications]
    x-permission:
      audience: user
      ownership: self
    x-covers: ['15 AC-27', '15 AC-29']
    x-settings: [S-101]
    responses:
      '200':
        description: Preferences.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/NotificationPreferences'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
  patch:
    operationId: updateNotificationPreferences
    summary: Change notification switches
    description: |
      Switches a channel of a switchable category ON or OFF (spec 15 AC-27). While OFF, deliveries of that
      category and channel are recorded as `suppressed` (reason `preference`) and the in-app row is still
      created (AC-28). Locked categories cannot be sent. Errors: 400 `VALIDATION_FAILED` (unknown channel
      for the category).
    tags: [Notifications]
    x-permission:
      audience: user
      ownership: self
    x-covers: ['15 AC-27', '15 AC-28']
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/NotificationPreferencesUpdateRequest'}
    responses:
      '200':
        description: The updated preferences.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/NotificationPreferences'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/notification-preferences/unsubscribe:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: unsubscribeNotificationEmail
    summary: One-click email unsubscribe (no login)
    description: |
      Used by the landing page `/notifications/unsubscribe?token=` and as the RFC 8058 one-click target of
      the `List-Unsubscribe` header (the mail client POSTs `List-Unsubscribe=One-Click` as a form with the
      token in the query string). Turns the email switch of the token's category OFF (spec 15 AC-30, AC-8).
      Idempotent. Errors: 422 `NOTIFICATION_UNSUBSCRIBE_LINK_INVALID` (invalid or older than 30 days →
      `t_unsubscribe_link_invalid`).
    tags: [Notifications]
    security: []
    x-permission:
      audience: public
      notes: the signed token identifies the user and category; valid 30 days
    x-covers: ['15 AC-30']
    x-rate-limit: 30 requests / 10 min per IP
    parameters:
      - name: token
        in: query
        required: false
        description: Token for the one-click form POST (mail clients cannot send JSON). JSON callers send it in the body.
        schema: {type: string, maxLength: 512}
    requestBody:
      required: false
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/NotificationUnsubscribeRequest'}
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              List-Unsubscribe: {type: string, const: One-Click}
    responses:
      '200':
        description: The email switch is OFF (`t_unsubscribed_success`).
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/NotificationUnsubscribeResult'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

# ═════════════════════════════════ Push tokens (spec 15 AC-20…AC-22) ═════════════════════════════════
/push-tokens/{installationId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: installationId
      in: path
      required: true
      description: Random id of this app installation (SecureStore), the same the app uses as its device id.
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  put:
    operationId: putPushToken
    summary: Register or refresh this installation's push token
    description: |
      Stores one token per installation (user, installation, platform, token, language, app version,
      last seen; spec 15 AC-20). If another user registered the same installation or token before, it
      moves to the caller. Called after the OS permission is granted, at every app start and when the
      app language changes. Tokens unseen for 90 days are removed and tokens Expo reports as unregistered
      are disabled by the push worker (AC-22).
    tags: [Notifications]
    x-permission:
      audience: user
      ownership: self (the installation becomes the caller's)
    x-covers: ['15 AC-20']
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/PushTokenPutRequest'}
    responses:
      '200':
        description: Stored.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/PushToken'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
  delete:
    operationId: deletePushToken
    summary: Remove this installation's push token (logout)
    description: The app calls it before `logout` (spec 15 AC-21). Tokens of banned, deleted or "log out everywhere" accounts are removed server-side by D1's operations. Idempotent (unknown installation → 204). Allowed for restricted users.
    tags: [Notifications]
    x-permission:
      audience: restricted-user
      ownership: self; another user's installation is ignored (204)
    x-covers: ['15 AC-21']
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}

# ═════════════════════════════════ SendGrid event webhook (spec 15 AC-11) ═════════════════════════════════
/webhooks/sendgrid:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: handleSendGridWebhook
    summary: SendGrid Event Webhook (bounces, spam reports, delivery status)
    description: |
      Verifies the signed Event Webhook (ECDSA public key from `.env`, headers
      `X-Twilio-Email-Event-Webhook-Signature` / `-Timestamp`, max 10 minutes old), stores the events
      and answers 200 quickly; processing is asynchronous and idempotent by `sg_event_id`.
      Effects: delivery-log status updates (spec 15 AC-4); a hard `bounce` or `spamreport` marks the
      address undeliverable on the user (later non-security emails → `suppressed`, reason
      `undeliverable`; security emails still attempted; the mark is cleared when the email changes or is
      re-verified; staff see the warning on the user page, AC-11). Unknown message ids are ignored.
      Errors: 403 `WEBHOOK_SENDGRID_SIGNATURE_INVALID`. Not blocked by maintenance mode.
    tags: [Webhooks]
    security: []
    x-permission:
      audience: webhook
      notes: verified by SendGrid's signed Event Webhook
    x-covers: ['15 AC-11']
    parameters:
      - name: X-Twilio-Email-Event-Webhook-Signature
        in: header
        required: true
        schema: {type: string}
      - name: X-Twilio-Email-Event-Webhook-Timestamp
        in: header
        required: true
        schema: {type: string}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/SendGridEventBatch'}
    responses:
      '200':
        description: Accepted (empty body).
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

# ═════════════════════════════════ Analytics ingestion (ADR-012) ═════════════════════════════════
/analytics/events:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: ingestAnalyticsEvents
    summary: Send a batch of first-party analytics events
    description: |
      Mobile posts `app_open` and `screen_view`; the Next.js server posts `page_view` for web requests
      (ADR-012 §1). The API enriches on its own server: user agent → device, OS, browser (bots dropped);
      IP → country and city from the local GeoIP database or the edge country header; the IP itself is
      kept only as a daily-salted hash and never sent to any third party (spec 16 AC-67, Q-055).
      **Client IP (normative, ADR-013 §14–§19, SEC-01):** for app and browser calls the IP is the one Caddy
      sets in `X-MyTask-Client-IP` (trusted only from Caddy); the edge country comes only from Caddy's
      `X-MyTask-Client-Country`. When the Next.js server posts a visitor's `page_view`, it calls the API on
      the internal network (not through Caddy) and passes the visitor's IP and user agent in
      `X-MyTask-Visitor-IP` / `X-MyTask-Visitor-UA` together with `X-MyTask-Service-Auth` (the
      `INTERNAL_SERVICE_TOKEN` from `.env`). The API accepts those headers only with a valid credential and
      only from the internal network, never through Caddy (which strips them); otherwise they are ignored
      and the caller's own address is used. `X-Forwarded-For` and `CF-*` headers are never read. Server
      events (registration, login, gig view, order paid…) are recorded by the API itself. Raw events are
      kept 90 days, daily aggregates permanently.
      Rate limit: 120 requests per minute per client IP (for Next.js calls with a valid credential: per
      visitor IP), batches of at most 50 events.
    tags: [Analytics]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission:
      audience: optional-user
      ownership: none; a signed-in caller's user id is attached to the events
    x-covers: ['16 AC-66', '16 AC-67']
    x-jobs: [analytics-rollup]
    x-rate-limit: 120 requests / 1 min per client IP (ADR-013 §14–§19; per visitor IP for credentialed Next.js calls)
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/AnalyticsEventBatchRequest'}
    responses:
      '202':
        description: Queued.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/AnalyticsIngestResult'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

# ═════════════════════════════════ Staff auth (spec 16 A; spec 01 AC-29, AC-51) ═════════════════════════════════
/admin/auth/login:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: adminLogin
    summary: Staff login (username or email + password)
    description: |
      Staff identities are separate from user accounts (spec 16 AC-2): user credentials never open the
      admin. Legacy `admins` bcrypt hashes are verified and rehashed to Argon2id (ADR-002 §3). Checks in
      order: IP ban (S-064; `403 STAFF_IP_BANNED`, spec 01 AC-51), reCAPTCHA when S-061 is ON, password,
      account `active` with a password set. Every failure answers `401 STAFF_LOGIN_FAILED` and counts
      towards the IP ban. When S-060 is ON and the device is not trusted (trigger S-124, trust S-059), the
      answer is `202` with an email-code challenge (EV-06; spec 01 AC-29); otherwise `200` with the
      session (host-only cookies `__Host-mt_staff_at`, `__Secure-mt_staff_rt`, 12-hour session). The device id
      is the long-lived host-only cookie `__Host-mt_staff_did` on `admin.mytask.ge` set by the API. The IP for
      the ban is the client IP of ADR-013 §14–§19 (a spoofed forwarding header cannot move or cause a ban).
      In production no tokens are returned in the body (SEC-17, `AdminAuthSession`).
    tags: [Admin Auth]
    security: []
    x-permission:
      audience: public
      notes: staff login; the only public audience allowed under /admin besides the other /admin/auth operations
    x-covers: ['16 AC-2', '01 AC-29', '01 AC-51']
    x-settings: [S-060, S-061, S-064, S-124, S-059, S-057]
    x-rate-limit: S-064 failed staff logins per IP (default 3) → IP banned from the staff login
    x-notifications: [EV-06]
    x-audit: staff.login
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/AdminAuthLoginRequest'}
    responses:
      '200':
        description: Logged in (cookies set).
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/AdminAuthSession'}
      '202':
        description: Email code required.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/AdminAuthTwoFactorChallenge'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

/admin/auth/2fa/verify:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: adminVerifyTwoFactor
    summary: Complete staff login with the emailed code
    description: |
      Correct code within S-057 → session and the device (and IP) trusted for S-059 days (spec 01 AC-29, AC-23
      rules). Errors: 422 `STAFF_TWO_FACTOR_CODE_INVALID`, `STAFF_TWO_FACTOR_CODE_EXPIRED`,
      `STAFF_TWO_FACTOR_TOO_MANY_ATTEMPTS` (S-058); 404 unknown challenge.
      Cap across challenges (ADR-002 §5, SEC-03): 10 wrong codes for one staff account within one hour (login
      and re-authentication codes together) → code checks refused for S-063 minutes with
      `429 STAFF_TWO_FACTOR_LOCKED` (messageKey `t_2fa_locked` with `minutes`), and the staff member gets the
      security email EV-129 once per lock (spec 01 AC-54); every wrong login code also counts as a failed
      staff login towards the S-064 IP ban.
    tags: [Admin Auth]
    security: []
    x-permission:
      audience: public
      notes: bound to the challenge of a correct password
    x-covers: ['16 AC-2', '01 AC-29', '01 AC-54']
    x-settings: [S-057, S-058, S-059, S-063, S-064]
    x-notifications: [EV-129]
    x-rate-limit: 'S-058 wrong codes per challenge; 10 wrong codes per staff account per hour across challenges → blocked S-063 minutes (STAFF_TWO_FACTOR_LOCKED); wrong codes count towards the S-064 IP ban'
    x-audit: staff.login
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/AdminAuthTwoFactorVerifyRequest'}
    responses:
      '200':
        description: Logged in (cookies set).
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/AdminAuthSession'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

/admin/auth/2fa/resend:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: adminResendTwoFactorCode
    summary: Send a new staff login code
    description: 'New code, the old one stops working; 60 s cooldown, at most 5 codes per account in 15 minutes (spec 01 AC-27 applied to staff). Errors: 429 `STAFF_TWO_FACTOR_RESEND_WAIT` (`t_2fa_resend_wait`).'
    tags: [Admin Auth]
    security: []
    x-permission:
      audience: public
      notes: bound to an open challenge
    x-covers: ['16 AC-2', '01 AC-29']
    x-rate-limit: 1 per 60 s and 5 per 15 min per staff account
    x-notifications: [EV-06]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/AdminAuthTwoFactorResendRequest'}
    responses:
      '202':
        description: Code sent.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/AdminAuthTwoFactorChallenge'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

/admin/auth/refresh:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: adminRefreshSession
    summary: Refresh the staff access token
    description: Rotates the refresh token (`__Secure-mt_staff_rt` cookie or body). Reuse of an old refresh token revokes the session family (ADR-002 §1). Never extends the session beyond 12 hours after login (spec 16 AC-2); disabled staff get 401.
    tags: [Admin Auth]
    security: []
    x-permission:
      audience: public
      notes: authenticated by the refresh token itself
    x-covers: ['16 AC-2']
    requestBody:
      required: false
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/AdminAuthRefreshRequest'}
    responses:
      '200':
        description: New tokens (cookies set).
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/AdminAuthSession'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}

/admin/auth/logout:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: adminLogout
    summary: Staff logout
    description: Ends the current staff session (refresh token revoked, `sid` on the deny-list, cookies cleared). Idempotent.
    tags: [Admin Auth]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: '@self'
      ownership: own session only
    x-covers: ['16 AC-2']
    x-audit: staff.logout
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}

/admin/auth/reauth:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: adminReauthenticate
    summary: Re-authenticate for high-risk actions (15 minutes)
    description: |
      Confirms the password, or the emailed 2FA code when S-060 is ON (get it with
      `adminRequestReauthCode`), and opens a 15-minute window in which operations marked
      `x-permission.stepUp` run (spec 16 AC-7, `t_reauth_required`). Without it those operations answer
      `403 REAUTH_REQUIRED`. The window is stored against this **session id**, not the staff account: other
      sessions of the same staff member do not inherit it, and it ends with the session (ADR-002 §6).
      Throttle (SEC-04): wrong passwords and codes count per staff account; after S-062 within 15 minutes
      every password/code check of the account answers `429 RATE_LIMITED` (`t_too_many_login_attempts`)
      for S-063 minutes (spec 01 AC-55); wrong codes also count towards the SEC-03 cap (`429
      STAFF_TWO_FACTOR_LOCKED`, `t_2fa_locked`, EV-129; spec 01 AC-54).
      Errors: 422 `STAFF_CURRENT_PASSWORD_WRONG`, `STAFF_TWO_FACTOR_CODE_*`; 429.
    tags: [Admin Auth]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: '@self'
      ownership: own session only
    x-covers: ['16 AC-7', '01 AC-54', '01 AC-55']
    x-settings: [S-060, S-062, S-063]
    x-notifications: [EV-129]
    x-rate-limit: 'S-062 wrong passwords or codes per staff account in 15 minutes → password/code checks refused for S-063 minutes (429 RATE_LIMITED, SEC-04)'
    x-audit: staff.reauth
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/AdminAuthReauthRequest'}
    responses:
      '200':
        description: Re-authenticated.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/AdminAuthReauthResult'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

/admin/auth/reauth/code:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: adminRequestReauthCode
    summary: Email a re-authentication code
    description: Only when S-060 is ON (else `422 BUSINESS_RULE_VIOLATION`). Same limits as login codes (60 s cooldown, 5 per 15 min).
    tags: [Admin Auth]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: '@self'
      ownership: own session only
    x-covers: ['16 AC-7']
    x-audit: staff.reauth_code.request
    x-settings: [S-060, S-057]
