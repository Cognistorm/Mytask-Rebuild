    description: '"Retry" of the delivery log (spec 16 AC-69). Queues one new attempt of the same email (same template, locale and recipient; still subject to suppression rules). Errors: 409 `STATE_CONFLICT` (not a failed email). Permission per spec 16 AC-69 (see D6 handoff about ADR-008 `system.queues.write`).'
