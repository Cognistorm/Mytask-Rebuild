  post:
    operationId: adminRequestMyEmailChange
    summary: Change own email (confirmation link to the new address)
    description: 'The email changes only when the link sent to the new address is opened (`adminConfirmEmailChange`, spec 16 AC-6). Errors: 409 `DUPLICATE` (address used by another staff account).'
