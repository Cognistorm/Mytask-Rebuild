  get:
    operationId: adminListNotificationDeliveries
    summary: Notification delivery log
    description: Email, push and SMS delivery records of the last 90 days, newest first, with failed and suppressed filters (spec 16 AC-69, spec 15 AC-4, AC-28, AC-34). `totalCount` feeds the "failed deliveries" counter (AC-17).
    tags: [Admin System]
    security:
      - staffBearer: []
      - staffCookie: []
