/admin/me/password:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: adminChangeMyPassword
    summary: Change own password (with the current password)
    description: 'Spec 16 AC-6. Other sessions of the staff member end (deny-listed at once), the current one stays, trusted devices are forgotten. Throttle (SEC-04): wrong current passwords count per staff account with the re-authentication checks; after S-062 within 15 minutes → `429 RATE_LIMITED` for S-063 minutes (spec 01 AC-55). Errors: 400 `VALIDATION_FAILED` (R-A2, confirmation); 422 `STAFF_CURRENT_PASSWORD_WRONG`; 429.'
    tags: [Admin Auth]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: '@self'
      ownership: self
    x-covers: ['16 AC-6', '01 AC-55']
    x-settings: [S-062, S-063]
    x-rate-limit: 'S-062 wrong passwords or codes per staff account in 15 minutes → password/code checks refused for S-063 minutes (429 RATE_LIMITED, SEC-04)'
    x-audit: staff.password.change
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/AdminMePasswordChangeRequest'}
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

/admin/me/email-change:
