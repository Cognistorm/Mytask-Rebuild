    description: 'Lets the set-password page show the "expired link" state (spec 16 Screens). Errors: 422 `STAFF_PASSWORD_LINK_EXPIRED`; unknown token → 404.'
    tags: [Admin Auth]
    security: []
    x-permission:
      audience: public
