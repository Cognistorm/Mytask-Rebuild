      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/admin/fee-rules/{feeRuleCode}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: feeRuleCode
      in: path
      required: true
      description: Stable rule code, e.g. `withdrawal.standard` (versions share it).
      schema: {type: string, pattern: '^[a-z_]+(\.[a-z_]+)+$', maxLength: 100}
  get:
    operationId: adminGetFeeRule
    summary: Get the current version of a fee rule
    tags: [Admin Settings]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: settings.read
      ownership: none
    x-covers: ['16 AC-46']
    responses:
      '200':
        description: The rule.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/FeeRule'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  put:
    operationId: adminUpdateFeeRule
    summary: Save a new version of a fee rule
    description: |
      Validates the values (spec 16 AC-47: percent 0–100 with at most 2 decimals, fixed 0–100,000 GEL,
      payer allowed for the purpose), requires a reason and re-authentication (AC-7), stores a new version
      effective immediately (P-123); transactions created earlier keep their version (00 AC-9, 05 AC-39);
      audited; EV-124 to every S-100 address (AC-56). Errors: 400 `VALIDATION_FAILED`; 409 `STATE_CONFLICT`
      (`expectedVersion` outdated, EC-3); 422 `FEE_REQUIRES_PAYMENT_FLOW` (switching S-016 ON, AC-49).
      A checkout quoted before the change answers `QUOTE_CHANGED` (EC-4, D3).
    tags: [Admin Settings]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: fees.write
      ownership: none
      stepUp: true
    x-covers: ['16 AC-47', '16 AC-49', '16 AC-56', '00 AC-9', '05 AC-39']
    x-notifications: [EV-124]
    x-audit: fee_rule.update
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/FeeRuleUpdateRequest'}
    responses:
      '200':
        description: New version stored.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/FeeRule'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

