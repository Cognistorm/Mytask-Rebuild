      '403': {$ref: '../components/responses.yaml#/Forbidden'}
  post:
    operationId: adminCreateFeeRule
    summary: Add a fee rule for a supported purpose (created OFF)
    description: 'The new rule is always created OFF (spec 16 AC-49, 00 §4.2); `enabled: true` → 400. Audited; EV-124 to S-100. Errors: 409 `DUPLICATE` (code exists).'
