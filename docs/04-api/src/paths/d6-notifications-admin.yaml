            schema: {$ref: '../schemas/d6.yaml#/AdminMe'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
  patch:
    operationId: adminUpdateMe
    summary: Edit own name and admin language
    tags: [Admin Auth]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: '@self'
      ownership: self
    x-covers: ['16 AC-6', '16 AC-76']
    x-audit: staff.profile.update
