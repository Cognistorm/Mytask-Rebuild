    summary: Confirm a staff email change from the link
    description: 'Opens the link sent to the new address by `adminRequestMyEmailChange` (spec 16 AC-6); the new email becomes active. Errors: 422 `STAFF_PASSWORD_LINK_EXPIRED` (expired or used link); 409 `DUPLICATE` (address taken meanwhile); 404 unknown token.'
