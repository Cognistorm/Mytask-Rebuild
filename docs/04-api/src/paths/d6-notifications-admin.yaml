      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

/admin/auth/password-set:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: adminSetPassword
    summary: Set a staff password from an invitation or reset link
    description: 'Single-use link (invitation 48 h, spec 16 AC-3; reset S-055). Password rule R-A2 of spec 01. On success the link is deleted, all sessions of that staff member end and trusted devices are forgotten (spec 01 AC-31 applied to staff); the staff member then logs in. Errors: 400 `VALIDATION_FAILED` (`t_password_validation_message`, confirmation mismatch); 422 `STAFF_PASSWORD_LINK_EXPIRED`; 404 unknown token.'
