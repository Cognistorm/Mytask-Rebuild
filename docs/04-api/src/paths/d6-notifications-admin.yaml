      ownership: none
      notes: the permission is chosen by the row's area (registry, ADR-005 §1); `permission` shows the area of S-121/S-122/S-103; S-128 is in area `payments` (Owner 2026-09-30 Q-137) and S-129 in area `withdrawals` (Q-144)
