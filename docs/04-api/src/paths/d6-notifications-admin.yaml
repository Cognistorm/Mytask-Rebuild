# ═════════════════════════════════ Settings register (spec 16 I, O) ═════════════════════════════════
/admin/settings:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: adminListSettings
    summary: List the settings register
    description: |
      All register rows grouped by area (spec 16 AC-51; fixed list, not paginated), searchable by id, key or
      meaning (`q`). Secret rows show only "set / not set" (AC-54). S-110 and S-127 are returned only to
      holders of `settings.custom_code.write` (AC-72). Fee rules S-010…S-018 appear read-only with
      `area: fees` (edited in `/admin/fee-rules`). Every row of the register S-001…S-129 is `registerStatus: approved` since the Owner gate of 2026-09-30 (P-135 and S-128 accepted, Q-111/Q-137; S-129 added, Q-144); `proposed` is kept for rows added later and not yet accepted.
    tags: [Admin Settings]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: settings.read
      ownership: none; custom-code rows need settings.custom_code.write in addition (hidden otherwise)
    x-covers: ['16 AC-51', '16 AC-54', '16 AC-72']
    parameters:
      - name: area
        in: query
        required: false
        schema: {$ref: '../schemas/d6.yaml#/SettingArea'}
      - name: q
        in: query
        required: false
        schema: {type: string, maxLength: 100}
    responses:
      '200':
        description: Register rows.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/SettingList'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/admin/settings/{key}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: key
      in: path
      required: true
      description: Register key, e.g. `escrow.auto_release.hours`.
      schema: {type: string, pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)+$', maxLength: 100}
  get:
    operationId: adminGetSetting
    summary: Get one register row
    description: S-110/S-127 → 404 without `settings.custom_code.write` (spec 16 AC-72). Viewing a secret row's status is audited (AC-14).
    tags: [Admin Settings]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: settings.read
      ownership: none; custom-code rows need settings.custom_code.write in addition (404 otherwise)
    x-covers: ['16 AC-51', '16 AC-54', '16 AC-72']
    x-audit: setting.secret_status.read
    responses:
      '200':
        description: The row.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/SettingEntry'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  patch:
    operationId: adminUpdateSetting
    summary: Change one register row
    description: |
      The only write path for settings (ADR-005 §4). Exactly one permission is checked per call: the
      write permission of the row's area (`x-permission.permissionBy`, spec 16 "Settings areas").
      Validation per register row (00 AC-10; out of range → `400 VALIDATION_FAILED` with
      `t_setting_invalid_value`, old value kept). `expectedVersion` → `409 STATE_CONFLICT` if someone
      else saved first (EC-3). Effective for web, mobile and API within 60 seconds, no deployment
      (00 AC-8, P-123); audited with old/new (secrets never written); V rows get a new version.
      Row-specific rules:
      - **Re-authentication** (AC-7) within 15 minutes in the same staff session for S-100, S-110, S-127,
        S-065…S-069 and (Owner 2026-09-30, Q-145) the plan prices S-008/S-009 and the security rows S-052,
        S-053, S-056…S-064, S-124 → else `403 REAUTH_REQUIRED` (`stepUpFor`; spec 16 EC-13).
      - **Critical rows** (S-025, S-033, S-056, S-060, S-065…S-069, S-100, S-110, S-127) send EV-124 to every
        S-100 address; for S-100 to the old and the new list (AC-55, AC-56; spec 15 AC-31).
      - **S-100**: at least one valid address (00 EC-9); test email with `adminSendTestEmail`.
      - **Social login** S-065…S-069 (type `structured`; ADR-005 §8, Owner 2026-09-30 Q-155 (a)): the request
        value is `SettingSocialProviderUpdate` `{isEnabled, clientId, clientSecret?}`, the response value
        `SettingSocialProviderValue` with `clientSecret: {isSet, updatedAt}`. `clientSecret` is write-only:
        omitted → the stored secret is kept; a string → replaces it; `null` → clears it. The secret is never
        returned, logged or audited (the audit row carries `isEnabled` and `clientId` old/new and, for the
        secret, only `isSet` before/after and whether it was replaced). Enabling a provider — or keeping it
        enabled — without a `clientId` and a stored secret after the change → `422 BUSINESS_RULE_VIOLATION`
        and nothing is saved (00 EC-10, AC-54). Re-authentication, critical row and EV-124 as above; one
        change = one version, one audit row, one EV-124.
      - **S-102** ON without an SMS provider → `422 BUSINESS_RULE_VIOLATION` `t_sms_provider_not_configured` (spec 15 AC-26).
      - **S-110** (value `CustomCodeValue`) and **S-127**: Super-admin only (`settings.custom_code.write`,
        non-grantable); every external host in the code must be in S-127 and S-127 cannot drop a host
        still used → `422 CUSTOM_CODE_HOST_NOT_ALLOWED` with `details.hosts` (AC-74, EC-10); full
        before/after audited; `enabled: false` = "Disable custom code" (AC-75).
      - **S-127 fixed-code vendors only** (spec 16 AC-74a, R-A10; Owner 2026-09-30 Q-146 (c)): the value is
        `CustomCodeAllowedHostsValue`; every host added by the save must carry `fixedCodeConfirmed: true`
        (the Super-admin ticked `t_custom_code_fixed_vendor_confirm`: the host serves fixed vendor code such
        as an analytics or advertising pixel, version-pinned where possible, not a tag manager) → else `422
        CUSTOM_CODE_FIXED_VENDOR_REQUIRED` (`details.hosts`, messageKey `t_custom_code_fixed_vendor_required`)
        and nothing is saved. The API stores `confirmedBy` / `confirmedAt` per host (kept for hosts already
        in the list) and audits them. Isolating custom code in its own origin is a Phase 3 study (ADR-013 §7).
      - **S-129** `withdrawals.security_change_pause_hours` (area `withdrawals`, integer ≥ 0; spec 14 AC-21,
        EC-11): the new value applies to every later withdrawal request, including pauses already running.
      - **S-121** → `422 SETTING_MANAGED_ELSEWHERE` (use `adminUpdateMaintenance`); fee rows S-010…S-018 →
        `422 SETTING_MANAGED_ELSEWHERE` (use `/admin/fee-rules`).
      - Switching a toggle OFF blocks new items only (00 AC-11, EC-1); the confirmation text is client-side.
      - **S-025** OFF → ON: in the same database transaction as the setting change, every funded, unpaused
        escrow whose auto-release deadline has passed gets a fresh S-026 period from now
        (`auto_release_set_reason = reenabled`); deadlines still in the future are kept, paused items stay
