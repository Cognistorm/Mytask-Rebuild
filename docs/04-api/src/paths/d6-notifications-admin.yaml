    description: Every rule (S-010…S-018 and later ones) with purpose, payer, type, value, plan scope, enabled, effective from, version, changed by (spec 16 AC-46). Read-only for staff without `fees.write`. Promo codes never reduce fees; there is no promo field (AC-50).
