# ═════════════════════════════════ Analytics dashboards (analytics.read) ═════════════════════════════════
/admin/analytics/{widget}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: widget
      in: path
      required: true
      schema: {$ref: '../schemas/d6.yaml#/AnalyticsWidget'}
    - name: period
      in: query
      required: false
      schema:
        allOf: [{$ref: '../schemas/d6.yaml#/AnalyticsPeriod'}]
        default: last_30_days
    - name: from
      in: query
      required: false
      description: Required when `period=custom`.
      schema: {$ref: '../components/schemas.yaml#/DateOnly'}
    - name: to
      in: query
      required: false
      description: Required when `period=custom`.
      schema: {$ref: '../components/schemas.yaml#/DateOnly'}
    - name: granularity
      in: query
      required: false
      description: Time-series widgets only (default day up to 90 days, else week).
      schema: {$ref: '../schemas/d6.yaml#/AnalyticsGranularity'}
  get:
    operationId: adminGetAnalyticsWidget
    summary: Data of one analytics widget
    description: 'Period 7/30/90/365 days or custom, compared with the previous period (spec 16 AC-66, P-120). First-party aggregates only; no IP anywhere; legacy aggregates flagged; GeoIP attribution included (AC-67).'
    tags: [Admin Analytics]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: analytics.read
      ownership: none
    x-covers: ['16 AC-66', '16 AC-67']
    responses:
      '200':
        description: Widget data.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/AnalyticsWidgetResult'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/admin/analytics/{widget}/export:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: widget
      in: path
      required: true
      schema: {$ref: '../schemas/d6.yaml#/AnalyticsWidget'}
    - name: period
      in: query
      required: false
      schema:
        allOf: [{$ref: '../schemas/d6.yaml#/AnalyticsPeriod'}]
        default: last_30_days
    - name: from
      in: query
      required: false
      schema: {$ref: '../components/schemas.yaml#/DateOnly'}
    - name: to
      in: query
      required: false
      schema: {$ref: '../components/schemas.yaml#/DateOnly'}
    - name: granularity
      in: query
      required: false
      schema: {$ref: '../schemas/d6.yaml#/AnalyticsGranularity'}
  get:
    operationId: adminExportAnalyticsWidget
    summary: Export one widget as CSV
    description: Aggregates only, no personal data, so no re-authentication; audited with the filter (spec 16 AC-66, AC-77).
    tags: [Admin Analytics]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: analytics.read
      ownership: none
    x-covers: ['16 AC-66', '16 AC-77']
    x-audit: analytics.export
    responses:
      '200':
        description: CSV file.
        content:
          text/csv:
            schema: {type: string}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

# ═════════════════════════════════ System (spec 16 N) ═════════════════════════════════
/admin/system/logs:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: adminListSystemLogs
    summary: System logs (warnings, errors, fatal; 30 days)
    description: Level, source (api, worker, websocket), message, request id, time, redacted context, with filters (spec 16 AC-68). There is no download of raw log files and no public URL for logs (Q-054, ADR-013).
    tags: [Admin System]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: system.logs.read
      ownership: none
    x-covers: ['16 AC-68']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/AdminLimit'
      - $ref: '../components/parameters.yaml#/CreatedFrom'
      - $ref: '../components/parameters.yaml#/CreatedTo'
      - name: level
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../schemas/d6.yaml#/SystemLogLevel'}
      - name: source
        in: query
        required: false
        schema: {$ref: '../schemas/d6.yaml#/SystemLogSource'}
      - name: requestId
        in: query
        required: false
        schema: {type: string, maxLength: 100}
      - name: q
        in: query
        required: false
        schema: {type: string, maxLength: 200}
    responses:
      '200':
        description: A page of log entries.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/SystemLogEntryPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/admin/system/health:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: adminGetSystemHealth
    summary: Job and queue health, last BOG callback
    description: Each background job with last success, last error and processed count (red after 15 minutes without success for minute jobs), queue sizes, last BOG callback time, email failure rate (spec 16 AC-69, P-121). The delivery log is `adminListNotificationDeliveries`. Problems trigger EV-125 from the health-check job (spec 15 AC-39).
    tags: [Admin System]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: system.health.read
      ownership: none
    x-covers: ['16 AC-69']
    responses:
      '200':
        description: Health snapshot.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/SystemHealth'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/admin/system/caches/refresh:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: adminRefreshCaches
    summary: Refresh caches (public pages, settings, translations)
    description: Revalidates public page caches, the settings cache and the translation cache; audited (spec 16 AC-71, P-121). Idempotent.
    tags: [Admin System]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: settings.system.write
      ownership: none
    x-covers: ['16 AC-71']
    x-audit: system.caches.refresh
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/SystemCacheRefreshResult'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/admin/system/maintenance:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: adminGetMaintenance
    summary: Get maintenance mode state
    tags: [Admin System]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: settings.read
      ownership: none
    x-covers: ['16 AC-70']
    x-settings: [S-121]
    responses:
      '200':
        description: State.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/MaintenanceState'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
  put:
    operationId: adminUpdateMaintenance
    summary: Switch maintenance mode ON or OFF
    description: |
      ON with headline and message (ka/en): the website and app show the maintenance screen (web 503 with
      `Retry-After`, user API `503 MAINTENANCE`); admin, BOG callback, health, jobs and notifications keep
      working (spec 16 AC-70, EC-8). Switching ON sends EV-122 `Admin/SiteIsDown` to every S-100 address
      with who and when, without any secret (spec 15 AC-37, P-112). OFF reopens everything. Audited.
      Errors: 409 `STATE_CONFLICT` (`expectedVersion` outdated).
    tags: [Admin System]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: settings.system.write
      ownership: none
    x-covers: ['16 AC-70', '15 AC-37']
    x-settings: [S-121, S-100]
    x-notifications: [EV-122]
    x-audit: system.maintenance.update
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d6.yaml#/MaintenanceUpdateRequest'}
    responses:
      '200':
        description: Saved.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/MaintenanceState'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/admin/system/maintenance/preview-links:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  post:
    operationId: adminCreateMaintenancePreviewLink
    summary: Link that lets this browser preview the public site during maintenance
    description: |
      Any signed-in staff member (spec 16 AC-70 "staff logged in to the admin"). No shared secret (P-112).
      Refused with `409 STATE_CONFLICT` when maintenance is OFF. Rules (P2-B5 item 2, SEC-24):
      - The link carries a random token of at least 128 bits. Only its SHA-256 hash is stored (Redis), bound
        to the creating staff member's **session id**; it is **single-use** and valid **5 minutes**.
      - Opening the link on `mytask.ge` consumes the token, sets the bypass cookie and immediately redirects
        (303) to the same path **without the token**, so the token does not leak through `Referer`, history or
        logs (the proxy and API loggers also redact the token parameter).
      - The bypass cookie is HttpOnly, Secure, SameSite=Lax, host-only (`__Host-mt_preview`), holds a new
        random value whose hash is bound server-side to the staff session id, and stops working when that
        session ends (logout, expiry, revocation, staff disabled) or maintenance is switched OFF.
      - It grants only the maintenance bypass for public pages and user API calls of that browser: no staff
        rights and no user rights.
    tags: [Admin System]
    security:
      - staffBearer: []
      - staffCookie: []
    x-permission:
      audience: staff
      permission: '@self'
      ownership: own browser session only
    x-covers: ['16 AC-70']
    x-audit: system.maintenance.preview
    responses:
      '201':
        description: Link created.
        content:
          application/json:
            schema: {$ref: '../schemas/d6.yaml#/MaintenancePreviewLink'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
