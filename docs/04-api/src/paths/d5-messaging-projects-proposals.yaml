      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: adminRejectProject
    summary: Reject a pending project with a reason
    description: |
      Spec 10 AC-13: `pending_approval` → `rejected` with the reason (required, ≤ 1,000, shown to the
      owner); the owner gets EV-59 (`YourProjectRejected` email with the reason +
      `t_ur_project_needs_changes`) and can edit the project, which sends it back to review
      (`updateProject`). First decision wins (`409 STATE_CONFLICT`, `t_item_already_decided`). Audited.
    tags: [Admin Projects]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: projects.moderate
      ownership: none
    x-covers: ['10 AC-13', '16 AC-19', '16 AC-22']
    x-audit: project.reject
    x-notifications: [EV-59]
    x-emits: [project.status_changed]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../components/schemas.yaml#/StaffReasonRequest'}
    responses:
      '200':
        description: The rejected project.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/AdminProject'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/admin/projects/{projectId}/hide:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: projectId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: adminHideProject
    summary: Hide a project (moderation)
    description: |
      Spec 10 AC-14 (P-75): with an **internal** reason. The project becomes `hidden` (previous status
      kept for unhide): non-owners get 404, it leaves explore lists, open proposals can no longer be
      awarded, and the owner sees `t_project_hidden_by_staff`. Refused with `409 PROJECT_PAYMENT_OPEN`
      while a contract payment is paid and not yet completed or refunded. Also used by the reports queue
      shortcut "hide project" (spec 16 AC-28). Already hidden → `409 STATE_CONFLICT`. Audited.
