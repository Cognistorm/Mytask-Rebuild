            schema: {$ref: '../schemas/d5.yaml#/AdminProject'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/admin/projects/{projectId}/approve:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: projectId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: adminApproveProject
    summary: Approve a pending project
    description: |
      Spec 10 AC-12: `pending_approval` → `active`; it appears in explore lists; the owner gets EV-58
      (`YourProjectApproved` email + `t_ur_project_title_has_been_approved` in-app/push); on the
      project's **first** activation the category email EV-56 is queued once (AC-19, AC-20). First
      decision wins: if another staff member already decided → `409 STATE_CONFLICT` with
      `messageKey: t_item_already_decided` (spec 16 AC-19). Audited.
    tags: [Admin Projects]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: projects.moderate
      ownership: none
    x-covers: ['10 AC-12', '10 AC-19', '10 AC-20', '16 AC-19', '16 AC-22']
    x-audit: project.approve
    x-notifications: [EV-56, EV-58]
    x-emits: [project.status_changed]
    x-jobs: [email]
    requestBody:
      required: false
      content:
        application/json:
          schema: {$ref: '../components/schemas.yaml#/StaffOptionalNoteRequest'}
    responses:
      '200':
        description: The approved project.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/AdminProject'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/admin/projects/{projectId}/reject:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
