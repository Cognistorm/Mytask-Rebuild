# D5 — paths for specs 08 (messaging), 10 (projects), 11 (proposals and hiring), plus the spec 16 ACs
# delegated to D5 (19, 22, 23, 31, 38, 65). Written by the P2-B4 D5 group run, 2026-09-29.
# Conventions: docs/04-api/CONVENTIONS.md. Realtime events: src/events/d5.yaml.
#
# Cross-group boundaries (CONVENTIONS §5):
# - Every thread (Inbox, order-item delivery thread, project thread, custom-offer thread, refund thread)
#   is a D5 conversation; other groups embed ConversationRef and use the reserved operations below.
# - Paying a contract is D3's checkout (CheckoutTarget purpose `contract_payment`); delivery, revision
#   requests and completion are D4's `/escrows/{escrowId}` operations. D5 writes neither.
# - Reports are created here (projects, proposals); the one staff queue is D6 `/admin/reports`.

# ═════════════════════════ Conversations (spec 08) ═════════════════════════
/conversations:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: listConversations
    summary: List the caller's Inbox (direct conversations)
    description: |
      The Inbox list (spec 08 AC-19): the caller's **direct** conversations only (item threads never
      appear, R-M2, AC-28), newest message first, **30 per load** (default `limit` 30). Conversations
      without any message and conversations the caller removed from their list (until a new message
      arrives, AC-26) are not listed. "Saved messages" is listed like a contact (`isSavedMessages`).
      `q` searches only the caller's own contacts by username or full name (contains, case-insensitive;
      nobody outside the caller's conversations is found, AC-21). `favorite=true` returns the Favourites
      row (AC-20). Online dots come from `counterpart.user.isOnline` (server-set, AC-17).
      Errors: 403 ACCOUNT_RESTRICTED (spec 08 AC-5).
    tags: [Conversations]
    x-permission:
      audience: user
      ownership: caller's own direct conversations only
    x-covers: ['08 AC-4', '08 AC-17', '08 AC-19', '08 AC-20', '08 AC-21']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: q
        in: query
        required: false
        description: Search text (username or full name of the other participant).
        schema: {type: string, minLength: 1, maxLength: 100}
      - name: favorite
        in: query
        required: false
        description: '`true` = only favourite contacts.'
        schema: {type: boolean}
    responses:
      '200':
        description: One page of the Inbox.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/ConversationSummaryPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
  post:
    operationId: createConversation
    summary: Open (find or start) the direct conversation with a user
    description: |
      Opens the caller's direct conversation with another user (profile "Contact me", gig "Contact
      seller", project "Chat now", proposal card chat, `/inbox/u/{username}`; spec 08 AC-1). Idempotent:
      if it exists it is returned with `200`; otherwise it is created and returned with `201` (it appears
      in the Inbox list only after the first message). Target = the caller → "Saved messages" (AC-4).
      `projectId` opens the conversation with the project's client without revealing a masked username
      to the caller beforehand (spec 10 AC-17, spec 02 AC-41). Chat is **not** Premium-gated (Q-069b,
      AC-2). A **new** conversation with a banned, deleted, restricted or pending account is refused with
      `422 CONVERSATION_RECIPIENT_UNAVAILABLE` (`t_user_cannot_receive_messages`); an existing one is
      returned read-only (AC-3, P-69).
      Anti-abuse limit (SEC-23, CONVENTIONS §14): at most 20 **new** conversations (answers `201`) per user per
      hour; opening an existing one (`200`) is not counted.
      Errors: 403 ACCOUNT_RESTRICTED; 404 NOT_FOUND (unknown username, project not visible to the
      caller); 422 CONVERSATION_RECIPIENT_UNAVAILABLE; 429 RATE_LIMITED.
    tags: [Conversations]
    x-permission:
      audience: user
      ownership: none (any active user may open a conversation with any other active or verified user, R-M1)
    x-covers: ['08 AC-1', '08 AC-2', '08 AC-3', '08 AC-4']
    x-rate-limit: 20 new conversations per user per hour; returning an existing one is not counted (SEC-23)
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/ConversationCreateRequest'}
    responses:
      '200':
        description: The existing conversation.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Conversation'}
      '201':
        description: The conversation was created.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Conversation'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

/conversations/lookup:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: lookupConversation
    summary: Find the caller's direct conversation with a user (legacy Inbox links)
    description: |
      Read-only lookup used by the web to redirect legacy Chatify links `/inbox/{legacyUserId}` (301 to
      `/inbox/{conversationId}`, url-map §5) and to resolve `/inbox/u/{username}` without creating
      anything. Give exactly one of `legacyUserId` or `username`. `404` when the caller has no
      conversation with that user (the web then goes to `/inbox`, or calls `createConversation`).
    tags: [Conversations]
    x-permission:
      audience: user
      ownership: caller's own direct conversations only; others get 404
    x-covers: []
    x-covers-note: Legacy URL support (url-map §5 `/inbox/{id}` → `/inbox/{conversationId}`); the chat ACs are covered by createConversation / getConversation.
    parameters:
      - name: legacyUserId
        in: query
        required: false
        description: Legacy numeric user id of the other participant (Chatify `/inbox/{id}`).
        schema: {type: integer, format: int64, minimum: 1}
      - name: username
        in: query
        required: false
        schema: {type: string, minLength: 1, maxLength: 60}
    responses:
      '200':
        description: The conversation.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Conversation'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/conversations/unread-summary:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: getConversationUnreadSummary
    summary: Unread badge of the Inbox
    description: |
      The header / Inbox tab badge (spec 08 AC-18): number of Inbox conversations with at least one
      unseen message. Updated in real time by `conversation.unread_count_changed`; clients re-read it on
      app resume and socket reconnect. The app icon badge also adds unread notifications (D6, spec 15
      AC-25).
    tags: [Conversations]
    x-permission:
      audience: user
      ownership: self
    x-covers: ['08 AC-18']
    responses:
      '200':
        description: Badge value.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/ConversationUnreadSummary'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/conversations/{conversationId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: conversationId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: getConversation
    summary: Get a conversation or item thread (participants only)
    description: |
      Any kind: the Inbox conversation (header, info panel, read-only state, offer buttons) or an item
      thread (order item 06 AC-40/41, project 11 AC-40, custom offer 12 AC-24, refund 13 AC-21), which
      the item page links through its `ConversationRef` (spec 08 AC-28). Only the participants may read
      it; everyone else gets `404` (never 403). The client joins the socket room
      `conversation:{conversationId}` after this call (same policy, realtime.md §3).
      Read-only (AC-3, AC-33, thread closed): `isReadOnly`, `readOnlyReason`, `canSend = false`.
      "Create an offer" / "Request an offer" (AC-27): `offerActions` (S-034).
    tags: [Conversations]
    x-permission:
      audience: user
      ownership: participant of the conversation; others get 404
    x-covers: ['08 AC-1', '08 AC-3', '08 AC-17', '08 AC-22', '08 AC-27', '08 AC-28', '08 AC-33', '11 AC-40', '06 AC-41']
    x-settings: [S-034, S-094]
    responses:
      '200':
        description: The conversation.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Conversation'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  patch:
    operationId: updateConversation
    summary: Star or unstar a contact (Favourites)
    description: Per-user setting on a direct conversation (spec 08 AC-20). Refused with `409 STATE_CONFLICT` for item threads.
    tags: [Conversations]
    x-permission:
      audience: user
      ownership: participant of the conversation; others get 404
    x-covers: ['08 AC-20']
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/ConversationUpdateRequest'}
    responses:
      '200':
        description: The updated conversation.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Conversation'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/conversations/{conversationId}/remove-from-list:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: conversationId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: removeConversationFromList
    summary: Remove a conversation from my Inbox list
    description: |
      "Remove from my list" (`t_remove_from_my_list`, spec 08 AC-26, P-67): hides the direct conversation
      for the caller only; nothing is deleted, the other person keeps it, and it comes back when a new
      message arrives. Refused with `409 STATE_CONFLICT` for item threads.
    tags: [Conversations]
    x-permission:
      audience: user
      ownership: participant of the conversation; others get 404
    x-covers: ['08 AC-26']
    x-emits: [conversation.updated]
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/conversations/{conversationId}/read:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: conversationId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: markConversationRead
    summary: Mark messages as seen up to a message
    description: |
      Called by web and mobile only while the conversation is actually shown (open conversation, web tab
      or app in the foreground; spec 08 AC-15, R-M5). Seen is one-way: an older id than the stored one
      is ignored. Emits `conversation.read` (ticks turn "seen" for the sender) and the new badge value.
      Staff reads never mark messages as seen.
    tags: [Conversations]
    x-permission:
      audience: user
      ownership: participant of the conversation; others get 404
    x-covers: ['08 AC-15', '08 AC-18']
    x-emits: [conversation.read, conversation.unread_count_changed, badge.updated]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/ConversationReadRequest'}
    responses:
      '200':
        description: The caller's read state.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/ConversationReadState'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/conversations/{conversationId}/messages:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: conversationId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: listConversationMessages
    summary: List messages of a conversation (participants only)
    description: |
      Without `after`: newest first, **30 per page** (default `limit` 30), older pages with `cursor` while
      scrolling up (spec 08 AC-14); clients show them oldest-to-newest with date separators.
      With `after` (a message id the client already has): messages newer than it, **oldest first** — used
      after a socket reconnect or app resume to fetch what was missed (ADR-007 §4, EC-9).
      Deleted and hidden messages keep their place with `state` and no content (AC-25, AC-31). Offer and
      request cards are `offer_card` / `request_card` messages whose details come from D4 (AC-27).
    tags: [Conversations]
    x-permission:
      audience: user
      ownership: participant of the conversation; others get 404
    x-covers: ['08 AC-14', '08 AC-15', '08 AC-25', '08 AC-27', '08 AC-28', '11 AC-40']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: after
        in: query
        required: false
        description: Return only messages newer than this message id, oldest first (catch-up).
        schema: {$ref: '../components/schemas.yaml#/Uuid'}
    responses:
      '200':
        description: One page of messages.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/MessagePage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  post:
    operationId: createConversationMessage
    summary: Send a message (Inbox or item thread)
    description: |
      One write path for every thread (ADR-007 §2). Stores the message with a server id (UUIDv7) and time,
      then emits `message.created` to the conversation room after commit (spec 08 AC-6). Idempotent by
      `clientMessageId` (per sender): a retry returns the stored message with `200` and never creates a
      duplicate.

      Rules by conversation kind:
      - `direct` (spec 08): text ≤ 5,000 characters (`t_message_too_long`) and/or one attachment; empty
        text without a file → `VALIDATION_FAILED` `t_enter_your_message` (AC-7). Attachments only while
        S-094 is ON, else `403 FEATURE_DISABLED` (`details.settingId` S-094, AC-9); the file must be a
        `ready` `chat_attachment` of the caller for this conversation (type in S-095 ∪ S-096, size ≤
        S-097, checked at upload, AC-8). Saved messages never notify.
      - `order_item` (06 AC-40/41), `project` (11 AC-40), `custom_offer` (12 AC-24): text only, 1–750
        characters, only while the item is open (awaiting payment/in progress/delivered/revision requested
        for contracts; in progress/delivered/revision for order items and offers); afterwards
        `403 CONVERSATION_READ_ONLY`.
      - `refund` (13 AC-21): text only, 1–750, while the request is pending, rejected by the seller or
        disputed; buyer and freelancer write, staff use `adminCreateConversationMessage`.
      Read-only conversations (other account inactive or deleted, AC-3, AC-33) → `403 CONVERSATION_READ_ONLY`.

      Notifications (spec 15, sent by the notification worker after commit): direct → EV-48 email only
      when the recipient has no open web/app connection, at most once per 10 minutes per sender →
      recipient pair, in the recipient's language (AC-23) and EV-49 push without the text when S-101 is
      ON and the app is not in the foreground, collapsed per conversation (AC-24); order thread → EV-45
      (buyer writes) / EV-46 (freelancer writes); project thread → EV-77; offer thread → EV-89; refund
      thread → EV-100 (email throttled 10 minutes per sender per request) and EV-101 while disputed.
      No in-app notification rows for direct messages (spec 08 "Notifications triggered").
      A new message returns a conversation removed from the recipient's list (AC-26).
      Errors: 400 VALIDATION_FAILED; 403 ACCOUNT_RESTRICTED, CONVERSATION_READ_ONLY, FEATURE_DISABLED;
      404 NOT_FOUND; 422 FILE_NOT_READY, FILE_PURPOSE_MISMATCH; 429 RATE_LIMITED (`t_sending_too_fast`,
      more than 30 messages per minute, AC-12).
    tags: [Conversations]
    x-permission:
      audience: user
      ownership: participant of the conversation (for item threads, the buyer/client or freelancer of the item); others get 404
      notes: attachments need S-094 ON (checked only when `attachmentFileId` is sent)
    x-covers: ['08 AC-3', '08 AC-6', '08 AC-7', '08 AC-8', '08 AC-9', '08 AC-12', '08 AC-23', '08 AC-24', '08 AC-28', '11 AC-40', '06 AC-40', '12 AC-24', '13 AC-21']
    x-rate-limit: 30 messages / 1 min per user (spec 08 AC-12, P-66)
    x-settings: [S-094, S-095, S-096, S-097, S-101]
    x-notifications: [EV-45, EV-46, EV-48, EV-49, EV-77, EV-89, EV-100, EV-101]
    x-emits: [message.created, conversation.updated, conversation.unread_count_changed, badge.updated]
    x-jobs: [email, push, in-app-realtime]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/MessageCreateRequest'}
    responses:
      '200':
        description: Replay of an earlier send with the same `clientMessageId` (the stored message).
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Message'}
      '201':
        description: The message was stored.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Message'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

/conversations/{conversationId}/messages/{messageId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: conversationId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
    - name: messageId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  delete:
    operationId: deleteConversationMessage
    summary: Delete an own message the recipient has not seen yet
    description: |
      Sender "Delete" (spec 08 AC-25, P-67, R-M8): allowed only for the caller's own visible message that
      the other participant has **not seen**; afterwards `409 MESSAGE_ALREADY_SEEN`
      (`t_message_seen_cannot_delete`, also when seen was stored first in a race, EC-4). Nothing is
      destroyed: both users see `t_message_deleted`, the attachment is no longer downloadable by them,
      and staff still see the original marked "deleted by sender". Emits `message.updated`.
    tags: [Conversations]
    x-permission:
      audience: user
      ownership: sender of the message (participant); others get 404
    x-covers: ['08 AC-25']
    x-emits: [message.updated]
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/conversations/{conversationId}/attachments:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: conversationId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: listConversationAttachments
    summary: List files shared in a conversation (info panel)
    description: 'Info panel "Shared photos" (`t_shared_photos`, empty `t_nothing_shared_yet`; spec 08 AC-22): visible attachments of the conversation, newest first. `type=image` (default) lists images only.'
    tags: [Conversations]
    x-permission:
      audience: user
      ownership: participant of the conversation; others get 404
    x-covers: ['08 AC-22']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum: [image, file, all]
          default: image
    responses:
      '200':
        description: One page of attachments.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/MessageAttachmentItemPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

# ═════════════════════════ Projects (spec 10) ═════════════════════════
/projects:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: listProjects
    summary: List the caller's own projects (Buying → Projects)
    description: |
      Buying → Projects (spec 10 AC-23): the caller's projects (all statuses except `deleted`), newest
      first, with status, budget, active proposals, views (AC-21), posted date, the current contract
      (Pay, Leave a review) and the next `actions`. Filter chips map to `status` values: pending approval
      → `pending_approval`; active → `active`; hired/in progress → `hired`; completed → `completed`;
      closed/refunded → `closed`, `refunded`; rejected → `rejected` (hidden projects appear under "all").
      Public browsing lists ("Latest projects", explore by category/skill) are D2's search (spec 03 AC-32…AC-34).
    tags: [Projects]
    x-permission:
      audience: user
      ownership: project owner (client) — the caller's own projects only
      toggles: [S-075]
    x-covers: ['10 AC-21', '10 AC-23']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../schemas/d5.yaml#/ProjectStatus'}
    responses:
      '200':
        description: One page of the caller's projects.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/ProjectListItemPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
  post:
    operationId: createProject
    summary: Post a project
    description: |
      Post form of spec 10 (AC-2…AC-10). Validation: title and description per `ProjectTitleInput` /
      `ProjectDescriptionInput` (Georgian-field character set of spec 00 R-5.3a, PROPOSED P-136; English
      without Georgian letters); category must be a project category; skills of that category only, each
      once, at most S-076 (`t_max_allowed_skills_reached`); thumbnail a `ready` `project_thumbnail` file
      (jpg/jpeg/png ≤ S-078 MB); budget min ≥ 1.00 GEL (`t_budget_min_too_low`) and min < max
      (`t_max_project_price_must_be_greater`). No budget type (always fixed, Q-035), no promotions (X-03),
      no posting payment while S-016 is OFF (AC-10).
      Creates a unique random 6-digit `pid` (retry on collision, R-P8) and a slug from the Georgian title.
      Status: `active` when S-072 is ON (launch; `t_ur_project_created_success`), else `pending_approval`
      (`t_ur_project_created_and_pending_approval`, admin email EV-57 to every S-100 address, AC-11).
      On first activation the category email EV-56 is queued once (AC-19).
      Plan limit (AC-9): open projects (pending approval + active without accepted award) ≥ S-003
      (Standard) / S-004 (Premium) → `422 PLAN_LIMIT_REACHED` (`t_plan_project_limit_reached`;
      unlimited by default).
      Errors: 400 VALIDATION_FAILED; 403 ACCOUNT_RESTRICTED, FEATURE_DISABLED (S-075); 422
      PLAN_LIMIT_REACHED, FILE_NOT_READY, FILE_PURPOSE_MISMATCH.
    tags: [Projects]
