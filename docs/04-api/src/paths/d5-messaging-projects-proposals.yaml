    operationId: lookupProject
    summary: Get a project page by its public number (pid)
    description: |
      Same result and visibility rules as `getProject`, looked up by the 6-digit `pid` of
      `/project/{pid}/{slug}` (CONVENTIONS §3.1). The web answers 301 to the current slug when the
      requested slug differs from `slug`, and to `/project/{pid}/{slug}` when the slug is missing (spec 10
      AC-15, url-map §4.2).
    tags: [Projects]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission:
      audience: optional-user
      ownership: public for active, closed, hired, completed and refunded projects; owner only for pending, rejected and hidden; others get 404
      toggles: [S-075]
    x-covers: ['10 AC-15', '10 AC-16']
    parameters:
      - name: pid
        in: query
        required: true
        schema: {type: string, pattern: '^[0-9]{6}$'}
    responses:
      '200':
        description: The project page.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Project'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/projects/{projectId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: projectId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: getProject
    summary: Get a project page
    description: |
      The project page (spec 10 AC-15…AC-18). Visible to anyone when active, closed, hired, completed or
      refunded; only to the owner when pending approval (`t_project_pending_approval_notice`), rejected
      or hidden (`t_project_hidden_by_staff`); `404` for everyone else and for deleted projects (staff use
      `adminGetProject`). English requests without English text return the Georgian content with
      `contentLocale: ka` (HTTP 200, AC-16). The client's username is masked unless the viewer is the
      owner or has active Premium (R-P6, 02 AC-41); the average of active proposals is shown only to the
      owner and Premium users (P-78). `viewer` tells what the caller may do: bid (or why not, AC-18;
      spec 11 AC-1, AC-2, AC-7), see proposals (spec 11 AC-10), edit, close, delete, report.
    tags: [Projects]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission:
      audience: optional-user
      ownership: public for active, closed, hired, completed and refunded projects; owner only for pending, rejected and hidden; others get 404
      toggles: [S-075]
    x-covers: ['10 AC-11', '10 AC-14', '10 AC-15', '10 AC-16', '10 AC-17', '10 AC-18', '11 AC-1', '11 AC-10']
    responses:
      '200':
        description: The project page.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Project'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  patch:
    operationId: updateProject
    summary: Edit an own project
    description: |
      Allowed while the project is `pending_approval`, `rejected`, or `active` **with no award** (none
      waiting, none accepted) (spec 10 AC-24, P-74); otherwise `409 STATE_CONFLICT` (AC-27, EC-8
      `t_order_status_changed`). Same validation as `createProject`. After saving: back to
      `pending_approval` when S-072 is OFF (`t_ur_project_updated_and_pending_approval`, EV-57), else it
      stays (or becomes, for rejected projects) `active` (`t_ur_project_updated_successfully`). `pid` never
      changes; a changed Georgian title changes `slug` and the old URL redirects (301). Proposals keep
      their amounts. Never sends a second category email (AC-20).
      Errors: 400 VALIDATION_FAILED; 403 ACCOUNT_RESTRICTED, FEATURE_DISABLED; 404; 409 STATE_CONFLICT;
      422 FILE_NOT_READY.
    tags: [Projects]
    x-permission:
      audience: user
      ownership: project owner (client); others get 404
      toggles: [S-075]
    x-covers: ['10 AC-3', '10 AC-4', '10 AC-5', '10 AC-6', '10 AC-7', '10 AC-11', '10 AC-13', '10 AC-20', '10 AC-24', '10 AC-27']
    x-settings: [S-072, S-075, S-076, S-078]
    x-notifications: [EV-57]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/ProjectUpdateRequest'}
    responses:
      '200':
        description: The updated project (owner view).
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Project'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}
  delete:
    operationId: deleteProject
    summary: Delete an own project without proposals
    description: |
      Allowed only for a project with no proposals (other than withdrawn ones) and no payment, in status
      `pending_approval`, `rejected` or `active` (spec 10 AC-26, P-75). The project becomes `deleted`: it
      leaves every list and its page answers 404 for everyone except staff (kept for audit, reports stay,
      EC-10). With proposals → `422 PROJECT_HAS_PROPOSALS` (close it instead); hired, completed, refunded
      → `409 STATE_CONFLICT` (AC-27).
    tags: [Projects]
    x-permission:
      audience: user
      ownership: project owner (client); others get 404
      toggles: [S-075]
    x-covers: ['10 AC-26', '10 AC-27']
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '422': {$ref: '../components/responses.yaml#/UnprocessableEntity'}

/projects/{projectId}/close:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: projectId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: closeProject
    summary: Close an own project for proposals
    description: |
      "Close project" (spec 10 AC-25, P-75): an `active` project with no **accepted** award becomes
      `closed` (`t_project_closed_success`): no new proposals, a pending award is revoked exactly as
      `revokeAward` (the freelancer gets EV-67 `t_award_withdrawn`), the page stays public with
      `t_this_project_is_closed_for_bidding`, it leaves "Latest projects" lists, and it cannot be
      reopened. Compare-and-set: if the award was accepted meanwhile → `409 STATE_CONFLICT`
      (`t_order_status_changed`, EC-8); hired, completed or refunded → `409` (AC-27).
    tags: [Projects]
    x-permission:
      audience: user
      ownership: project owner (client); others get 404
      toggles: [S-075]
    x-covers: ['10 AC-25', '10 AC-27']
    x-notifications: [EV-67]
    x-emits: [project.status_changed, award.status_changed]
    responses:
      '200':
        description: The closed project (owner view).
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Project'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/projects/{projectId}/views:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: projectId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: recordProjectView
    summary: Count a visit of a project page
    description: |
      Sent by the web page (in the browser, not during SSR) and the app when a project page is shown
      (spec 10 AC-21). Counted at most once per `visitorId` per project per 15 minutes; requests
      recognised as bots (user agent) are not counted; the owner's own views are not counted. Always
      answers `204` for visible projects (no information about whether it counted). No third-party IP
      lookup (Q-055).
    tags: [Projects]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission:
      audience: optional-user
      ownership: none (any visitor of a visible project; hidden/pending projects of others → 404)
      toggles: [S-075]
    x-covers: ['10 AC-21']
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/ProjectViewCreateRequest'}
    responses:
      '204': {$ref: '../components/responses.yaml#/NoContent'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/projects/{projectId}/reports:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: projectId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: createProjectReport
    summary: Report a project
    description: |
      Spec 10 AC-22: a logged-in non-owner reports a visible project with a reason (`reason_1…6`) and a
      description (1–1,500). Saved into the one staff queue (D6 `adminListReports`, P-118) and
      `Admin/ProjectReported` (EV-60) goes to every S-100 address. The owner gets `403 FORBIDDEN`
      (`t_u_cannot_report_ur_own_projects`); a second report by the same user while the first is not yet
      reviewed gets `409 DUPLICATE` (`t_u_already_reported_this_project`). Guests get 401 (clients show
      `t_pls_login_or_register_report_project`). Success text `t_we_have_received_bid_report_success`.
      Anti-abuse limit (SEC-23, CONVENTIONS §14): 10 reports per user per hour across the four report
      operations → `429 RATE_LIMITED`.
    tags: [Projects]
    x-permission:
      audience: user
      ownership: any logged-in user except the project owner
    x-covers: ['10 AC-22']
    x-notifications: [EV-60]
    x-rate-limit: 10 reports per user per hour, shared by createUserReport, createGigReport, createProjectReport and createProposalReport (SEC-23)
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/ProjectReportCreateRequest'}
    responses:
      '201':
        description: The report was saved.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/ProjectReport'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

/projects/{projectId}/proposals:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: projectId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: listProjectProposals
    summary: List the proposals of a project (who sees what is enforced here)
    description: |
      Proposals section of the project page (spec 11 AC-10, AC-11). The project owner and users with
      active Premium get every **active** proposal (with the "Awarded" chip) → `visibility: all`
      (staff use `adminListProposals`). Everyone else (guests, Standard users) gets only their own
      proposal on this project in any status, if any → `visibility: own_only`; they see the count from
      `getProject` and `t_warning_bids_limit`. Migrated sealed/sponsored proposals are listed like every
      other proposal; upgrades do not exist (AC-8, X-04).
      Sort (AC-11): `newest` (default), `oldest`, `fastest` (fewest days), `cheapest` (lowest amount);
      ties newest first.
    tags: [Proposals]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission:
      audience: optional-user
      ownership: project visible to the caller (see getProject); details only for the owner and active Premium users, own proposal for its author
      toggles: [S-075]
    x-covers: ['10 AC-17', '11 AC-8', '11 AC-10', '11 AC-11']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum: [newest, oldest, fastest, cheapest]
          default: newest
    responses:
      '200':
        description: One page of proposals.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/ProposalPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  post:
    operationId: createProposal
    summary: Send a proposal (Premium only)
    description: |
      "Bid on this project" (spec 11 AC-1…AC-7). **Active Premium is required at request time**, whatever
      the client sends → `403 PREMIUM_REQUIRED` (AC-2, R-H1, EC-1). Refusals (AC-7, R-1.3):
      own project → `403 FORBIDDEN` `t_u_cant_submit_bids_to_urself`; a non-withdrawn proposal of the caller
      exists → `409 DUPLICATE` `t_u_already_submitted_a_bid_to_this_project`; the caller declined an award
      on this project → `409 DUPLICATE` (P-82; see handoff for the message); award waiting or accepted →
      `409 STATE_CONFLICT` `t_u_cant_submit_bids_to_this_project`; project not active →
      `409 STATE_CONFLICT` `t_project_not_active_to_send_proposals`.
      Validation (AC-3, AC-4): amount ≥ 1.00 GEL, ≤ 10 characters, inside budget min…max inclusive
      (`t_pls_insert_bid_value_between_budget`, field `amount`); days 1–365 (`t_validator_proposal_days`);
      revisions 0…S-041 (`t_validator_revisions_range`); message 1–3,500 plain text.
      Status: `active` when S-073 is ON (launch; `t_ur_bid_has_been_posted`; client gets EV-61), else
      `pending_approval` (`t_ur_bid_has_been_posted_pending_approval`; EV-62 to every S-100 address; the
      client is notified only on approval) (AC-6).
    tags: [Proposals]
    x-permission:
      audience: user
      ownership: any user except the project owner
      plan: premium
      toggles: [S-075]
    x-covers: ['11 AC-1', '11 AC-2', '11 AC-3', '11 AC-4', '11 AC-6', '11 AC-7', '00 AC-7']
    x-settings: [S-041, S-073, S-075]
    x-notifications: [EV-61, EV-62]
    x-emits: [proposal.status_changed]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/ProposalCreateRequest'}
    responses:
      '201':
        description: The created proposal.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Proposal'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/projects/{projectId}/proposal-earnings:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: projectId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: getProposalEarnings
    summary: '"Paid to you" preview for a proposal amount'
    description: |
      Computes P′ = amount − freelancer project commission with the Commission & Fee module (S-015,
      ADR-005) for the proposal form (spec 11 AC-5, `t_bid_paid_to_you_tooltip`); today P′ = amount.
      Clients never compute fees. No state change; not Premium-gated (the form itself is).
    tags: [Proposals]
    x-permission:
      audience: user
      ownership: none (project visible to the caller)
      toggles: [S-075]
    x-covers: ['11 AC-5']
    x-settings: [S-015]
    parameters:
      - name: amount
        in: query
        required: true
        description: Proposal amount in integer tetri (Money.amount).
        schema: {type: integer, format: int64, minimum: 1}
    responses:
      '200':
        description: The preview.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/ProposalEarningsPreview'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

# ═════════════════════════ Proposals (spec 11) ═════════════════════════
/proposals:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: listProposals
    summary: List the caller's own proposals (Selling → Proposals)
    description: |
      Selling → Proposals (spec 11 AC-14): the caller's proposals newest first, **42 per page** (default
      `limit` 42), with project, amount, days, revisions, `displayStatus` (pending approval, active,
      awarded, accepted, declined, rejected, withdrawn, hire canceled, not selected) and actions (Edit,
      Withdraw) in `viewer`. Empty: `t_no_proposals_yet`.
    tags: [Proposals]
    x-permission:
      audience: user
      ownership: author of the proposals (caller's own only)
    x-covers: ['11 AC-14']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../schemas/d5.yaml#/ProposalStatus'}
    responses:
      '200':
        description: One page of the caller's proposals (`visibility` is always `own_only`).
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/ProposalPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/proposals/{proposalId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: proposalId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: getProposal
    summary: Get a proposal
    description: |
      The author sees their proposal in any status (edit form, spec 11 AC-12); the project owner and
      users with active Premium see it while it is active or awarded/accepted (spec 11 AC-10). Everyone
      else gets `404`. Also resolves `/seller/proposals/{proposalUid}/edit` via `uid`.
    tags: [Proposals]
    security: [{}, {userBearer: []}, {userCookie: []}]
    x-permission:
      audience: optional-user
      ownership: author (any status); project owner and active Premium users (active/awarded/accepted); others get 404
    x-covers: ['11 AC-10']
    responses:
      '200':
        description: The proposal.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Proposal'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  patch:
    operationId: updateProposal
    summary: Edit an own proposal (Premium only)
    description: |
      Spec 11 AC-12 (P-81, P-83): the author's proposal in `pending_approval`, `active` or `rejected`, on a
      project that is active with no award; otherwise `409 STATE_CONFLICT`. Requires active Premium
      (`403 PREMIUM_REQUIRED`, EC-2). Same validation as `createProposal`. The proposal returns to
      `pending_approval` when S-073 is OFF (EV-62); a rejected proposal becomes active again when S-073
      is ON. The client is **not** notified again (P-83).
    tags: [Proposals]
    x-permission:
      audience: user
      ownership: author of the proposal; others get 404
      plan: premium
      toggles: [S-075]
    x-covers: ['11 AC-3', '11 AC-4', '11 AC-12']
    x-settings: [S-041, S-073]
    x-notifications: [EV-62]
    x-emits: [proposal.status_changed]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/ProposalUpdateRequest'}
    responses:
      '200':
        description: The updated proposal.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Proposal'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/proposals/{proposalId}/withdraw:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: proposalId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: withdrawProposal
    summary: Withdraw an own proposal
    description: |
      "Withdraw proposal" (spec 11 AC-13, P-82): the author's proposal that is not awarded (pending,
      active or rejected) becomes `withdrawn`; it leaves the project's list and counts and stays in the
      author's list. The author may send a new proposal while the project is open. Premium is not
      required. Awarded, accepted or declined proposals → `409 STATE_CONFLICT` (decline the award
      instead); a concurrent award wins by compare-and-set (EC-3, `t_order_status_changed`).
    tags: [Proposals]
    x-permission:
      audience: user
      ownership: author of the proposal; others get 404
    x-covers: ['11 AC-13']
    x-emits: [proposal.status_changed]
    responses:
      '200':
        description: The withdrawn proposal.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Proposal'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/proposals/{proposalId}/reports:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: proposalId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: createProposalReport
    summary: Report a proposal
    description: |
      Spec 11 AC-15: a logged-in user who can see an **active** proposal and is not its author reports it
      with a reason (`reason_1…4`) and a description (1–1,500). Saved into the one staff queue (D6
      `adminListReports`); `Admin/BidReported` (EV-65) goes to every S-100 address. The author gets
      `403 FORBIDDEN` (`t_u_cannot_report_ur_own_bids`); a second unreviewed report by the same user
      `409 DUPLICATE` (`t_u_already_reported_this_bid`). Success `t_we_have_received_bid_report_success`.
      Anti-abuse limit (SEC-23, CONVENTIONS §14): 10 reports per user per hour across the four report
      operations → `429 RATE_LIMITED`.
    tags: [Proposals]
    x-permission:
      audience: user
      ownership: a user who can see the proposal (owner, Premium), except its author; others get 404
    x-covers: ['11 AC-15']
    x-notifications: [EV-65]
    x-rate-limit: 10 reports per user per hour, shared by createUserReport, createGigReport, createProjectReport and createProposalReport (SEC-23)
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/ProposalReportCreateRequest'}
    responses:
      '201':
        description: The report was saved.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/ProposalReport'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}
      '429': {$ref: '../components/responses.yaml#/TooManyRequests'}

# ═════════════════════════ Awards (spec 11 AC-16…AC-24) ═════════════════════════
/awards:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: listAwards
    summary: List awards of the caller (as freelancer or client)
    description: |
      `role=freelancer` (default): the awarded proposals of Selling → Projects with the countdown to
      `expiresAt` and Accept / Decline (spec 11 AC-24); `role=client`: awards the caller made. Filter
      `status` (e.g. `pending`). 42 per page (default `limit` 42).
    tags: [Proposals]
    x-permission:
      audience: user
      ownership: freelancer or client of the award (caller's own only)
    x-covers: ['11 AC-24']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum: [freelancer, client]
          default: freelancer
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../schemas/d5.yaml#/AwardStatus'}
    responses:
      '200':
        description: One page of awards.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/AwardPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
  post:
    operationId: createAward
    summary: Award a proposal (project owner)
    description: |
      "Award" (spec 11 AC-16…AC-19, R-H4). The owner of an `active` project awards an `active` proposal:
      the proposal becomes `awarded` with `expiresAt` = now + S-027 hours (stored with
      `acceptanceHours`; later S-027 changes do not touch it, AC-23), the project shows "Awarded —
      waiting for the freelancer", new proposals are closed, and the freelancer gets EV-66 stating the
      deadline (`:hours`). If another award is pending it is replaced (`moved`): that proposal returns to
      `active` and its freelancer gets EV-67 `t_award_withdrawn` (AC-17). Re-awarding the same proposal
      later gets a fresh deadline (EC-9).
      Refusals (AC-19): owner restricted → `403 ACCOUNT_RESTRICTED`; project closed, hidden or not active,
      or an award already accepted → `409 STATE_CONFLICT` `t_project_is_not_open_for_bid`; proposal not
      active → `409 STATE_CONFLICT` `t_this_bid_is_not_active_yet`. Concurrent withdraw → compare-and-set
      (EC-3).
    tags: [Proposals]
    x-permission:
      audience: user
      ownership: project owner (client) of the proposal's project; others get 404
      toggles: [S-075]
    x-covers: ['10 AC-14', '11 AC-16', '11 AC-17', '11 AC-19', '11 AC-23']
    x-settings: [S-027]
    x-notifications: [EV-66, EV-67]
    x-emits: [award.status_changed, proposal.status_changed]
    x-jobs: [award-expiry]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/AwardCreateRequest'}
    responses:
      '201':
        description: The award.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Award'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/awards/{awardId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: awardId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: getAward
    summary: Get an award (freelancer or client)
    description: The accept / decline dialog with its countdown (spec 11 AC-20, AC-21, AC-24), opened from Selling → Projects or the EV-66 notification link.
    tags: [Proposals]
    x-permission:
      audience: user
      ownership: freelancer or client of the award; others get 404
    x-covers: ['11 AC-24']
    responses:
      '200':
        description: The award.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Award'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/awards/{awardId}/revoke:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: awardId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: revokeAward
    summary: Revoke a pending award (project owner)
    description: |
      "Revoke" (spec 11 AC-18): only the project owner, only while the award is `pending`; the ownership
      check runs before anything changes. The award becomes `revoked`, the proposal returns to `active`,
      proposals reopen, and the freelancer gets EV-67 `t_award_withdrawn`. Not pending →
      `409 STATE_CONFLICT` (`t_this_bid_is_not_awarded_to_revoke_it`). Success
      `t_u_have_success_revoked_this_bid`.
    tags: [Proposals]
    x-permission:
      audience: user
      ownership: project owner (client) of the award; others get 404
    x-covers: ['11 AC-18']
    x-notifications: [EV-67]
    x-emits: [award.status_changed, proposal.status_changed]
    responses:
      '200':
        description: The revoked award.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Award'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/awards/{awardId}/accept:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: awardId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: acceptAward
    summary: Accept an award (freelancer) — creates the contract
    description: |
      "Accept" (spec 11 AC-20, BR-059): in one transaction the award becomes `accepted`, the proposal
      `accepted`, a contract is created in `awaiting_payment` with a snapshot (amount P, days, revisions,
      fee rule versions for P′ and Fb, client and freelancer) and its single payment line
      (`contract_payments` sequence 1, kind `full`), the project becomes `hired`, and the project thread
      (conversation kind `project`) is created. The client gets EV-69 linking to the payment page. No
      milestone request; Premium is not required. Returns the contract.
      After `expiresAt` → `409 AWARD_EXPIRED` (`t_award_expired`) even if the sweeper has not run (AC-22);
      not pending (revoked, moved, declined) → `409 STATE_CONFLICT`; the first of accept/sweeper to lock
      the award wins (EC-4).
    tags: [Proposals]
    x-permission:
      audience: user
      ownership: freelancer of the award; others get 404
    x-covers: ['11 AC-20', '11 AC-22']
    x-notifications: [EV-69]
    x-emits: [award.status_changed, proposal.status_changed, contract.status_changed]
    responses:
      '200':
        description: The created contract (awaiting payment).
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Contract'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/awards/{awardId}/decline:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: awardId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: declineAward
    summary: Decline an award with a reason (freelancer)
    description: |
      "Decline" (spec 11 AC-21, P-85): before the deadline, with one reason of `reason_1, _2, _4…_8`
      (reason 3 is not offered). The award and the proposal become `declined` (the proposal leaves the
      list), the project returns to `active` (open for proposals), and the client gets EV-70 with the
      reason. The freelancer cannot send a new proposal on this project (P-82). After the deadline →
      `409 AWARD_EXPIRED`; not pending → `409 STATE_CONFLICT`.
    tags: [Proposals]
    x-permission:
      audience: user
      ownership: freelancer of the award; others get 404
    x-covers: ['11 AC-21']
    x-notifications: [EV-70]
    x-emits: [award.status_changed, proposal.status_changed, project.status_changed]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/AwardDeclineRequest'}
    responses:
      '200':
        description: The declined award.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Award'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

# ═════════════════════════ Contracts (spec 11) ═════════════════════════
/contracts:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: listContracts
    summary: List the caller's project contracts
    description: |
      `role=freelancer` (default): contracts of Selling → Projects (awaiting payment, in progress with
      expected delivery date and "Late", delivered with the auto-release date when S-025 is ON, revision
      requested, completed, refunded) with the next `actions` (spec 11 AC-24); `role=client`: the
      caller's contracts as project owner. 42 per page (default `limit` 42), newest first.
    tags: [Contracts]
    x-permission:
      audience: user
      ownership: client or freelancer of the contracts (caller's own only)
    x-covers: ['11 AC-24']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum: [freelancer, client]
          default: freelancer
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../schemas/d5.yaml#/ContractStatus'}
    responses:
      '200':
        description: One page of contracts.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/ContractListItemPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/contracts/lookup:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: lookupContract
    summary: Get the caller's contract of a project by pid (work pages)
    description: |
      Resolves the work pages `/account/projects/{pid}` (client) and `/seller/projects/{pid}` (freelancer)
      (url-map §5; spec 11 AC-41, AC-42) to the project's current, non-canceled contract. Same schema and
      rules as `getContract`; `404` when the caller is not its client or freelancer (AC-43) or there is
      no contract.
    tags: [Contracts]
    x-permission:
      audience: user
      ownership: client or freelancer of the contract; others get 404
    x-covers: ['11 AC-41', '11 AC-42', '11 AC-43']
    parameters:
      - name: pid
        in: query
        required: true
        schema: {type: string, pattern: '^[0-9]{6}$'}
    responses:
      '200':
        description: The contract.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Contract'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/contracts/{contractId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: contractId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: getContract
    summary: Get a project contract (client or freelancer only)
    description: |
      The client's and the freelancer's work pages (spec 11 AC-41, AC-42): header (project, freelancer,
      amount, delivery days, revisions left from `payments[0].escrow`, expected delivery date, "Late"
      AC-34), status timeline, the single payment line with its escrow and latest payment, the project
      thread (`conversation`), reviews, and the caller's next `actions`. Everyone else gets `404`
      (AC-27, AC-43; fixes R-018). After payment the client has no pending or escrow amount of their
      own; the page shows "Paid" (AC-31).
      Related operations (other groups): pay → D3 `createCheckoutQuote` / `createPayment` with
      `CheckoutTarget {purpose: contract_payment, contractPaymentId}` (AC-26…AC-30); deliveries,
      revisions, completion → D4 `listEscrowDeliveries`, `createEscrowDelivery`,
      `createEscrowRevisionRequest`, `completeEscrow` on `payments[0].escrow.id` (AC-32…AC-39); refunds
      and unblock → D4 `createRefundRequest`, `createUnblockRequest` (spec 13); reviews → D2
      `createReview` (AC-44).
    tags: [Contracts]
    x-permission:
      audience: user
      ownership: client or freelancer of the contract; others get 404
    x-covers: ['11 AC-26', '11 AC-27', '11 AC-34', '11 AC-40', '11 AC-41', '11 AC-42', '11 AC-43', '11 AC-44']
    responses:
      '200':
        description: The contract.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Contract'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/contracts/{contractId}/cancel:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: contractId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: cancelContract
    summary: Cancel the hire before payment (client or freelancer)
    description: |
      "Cancel hire" (spec 11 AC-25, P-86): only while the contract is `awaiting_payment`. The contract
      becomes `canceled`, the proposal `hire_canceled`, the project returns to `active` (other proposals
      unchanged), no money moves (no ledger entry), and the other side gets EV-71 (`t_hire_canceled`,
      email + in-app + push). While a card payment for the contract is pending at BOG →
      `409 CONTRACT_PAYMENT_IN_PROGRESS` (`t_payment_in_progress`, EC-5); already paid or canceled →
      `409 STATE_CONFLICT` (`t_order_status_changed`). A card payment verified after the cancel is
      credited to the client's wallet as unapplied (D3, spec 11 AC-30).
    tags: [Contracts]
    x-permission:
      audience: user
      ownership: client or freelancer of the contract; others get 404
    x-covers: ['11 AC-25']
    x-notifications: [EV-71]
    x-emits: [contract.status_changed, project.status_changed, proposal.status_changed]
    responses:
      '200':
        description: The canceled contract.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/Contract'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

# ═════════════════════════ Admin — conversations (spec 08 AC-29…AC-31, spec 16 AC-65) ═════════════════════════
/admin/conversations:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: adminListConversations
    summary: Staff search of conversations and threads
    description: |
      Admin → Conversations (spec 08 AC-29, spec 16 AC-65): every conversation of every kind, newest
      activity first. `q` matches username, full name or e-mail of either participant (contains,
      case-insensitive); filter by `kind` and date (`createdFrom`/`createdTo` on the last message);
      `userId` = conversations of one user (spec 16 AC-31 "Conversations" tab). Listing shows no message
      text; opening one is `adminGetConversation` (audited).
    tags: [Admin Conversations]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: chat.read
      ownership: none
    x-covers: ['08 AC-29', '16 AC-31', '16 AC-65']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/AdminLimit'
      - $ref: '../components/parameters.yaml#/UserIdFilter'
      - $ref: '../components/parameters.yaml#/CreatedFrom'
      - $ref: '../components/parameters.yaml#/CreatedTo'
      - name: q
        in: query
        required: false
        schema: {type: string, minLength: 1, maxLength: 254}
      - name: kind
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../components/schemas.yaml#/ConversationKind'}
    responses:
      '200':
        description: One page of conversations.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/AdminConversationSummaryPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/admin/conversations/{conversationId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: conversationId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: adminGetConversation
    summary: Open a conversation read-only (audited)
    description: |
      Read-only staff view of any conversation (spec 08 AC-29, spec 16 AC-38 item threads, AC-65).
      **Every call writes an audit entry** (staff member, permission used, conversation, time, IP, user
      agent, request id and the optional `reason`, `t_admin_access_reason`; spec 08 AC-30, spec 16 AC-14).
      The entries are listed per conversation and per staff member in D6's audit viewer (target type
      `conversation`). Staff reads never mark messages as seen and staff are never participants.
      Permission: `chat.read`; for `refund` threads `refunds.thread.write` is accepted instead (spec 16
      AC-40, P-114: support staff read and write refund threads) — exactly one of them is checked,
      chosen by the stored conversation kind (see handoff). Every kind is listed in the map; a kind that is
      not in the map is denied (`403`), never given a fallback (ADR-010 §2, P2-B5 item 13).
    tags: [Admin Conversations]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: chat.read
      permissionBy:
        attribute: kind of the conversation
        map: {direct: chat.read, order_item: chat.read, project: chat.read, custom_offer: chat.read, refund: refunds.thread.write}
      ownership: none
    x-covers: ['08 AC-29', '08 AC-30', '16 AC-38', '16 AC-65', '06 AC-41']
    x-audit: conversation.open
    parameters:
      - name: reason
        in: query
        required: false
        description: Optional reason for opening, stored in the audit entry.
        schema: {type: string, maxLength: 1000}
    responses:
      '200':
        description: The conversation.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/AdminConversation'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}

/admin/conversations/{conversationId}/messages:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: conversationId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: adminListConversationMessages
    summary: Read the messages of a conversation (audited)
    description: |
      All messages with their original text and attachments, including those deleted by the sender
      (`deletedBySenderAt`, `t_deleted_by_sender`) and hidden by staff (`hiddenByStaffAt`,
      `t_hidden_by_staff`) (spec 08 AC-25, AC-29, AC-31). Newest first, 30 per page by default in the
      viewer (`limit`). Each call is audited like `adminGetConversation` (sensitive read, spec 16 AC-14).
      Same permission rule as `adminGetConversation`.
    tags: [Admin Conversations]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: chat.read
      permissionBy:
        attribute: kind of the conversation
        map: {direct: chat.read, order_item: chat.read, project: chat.read, custom_offer: chat.read, refund: refunds.thread.write}
      ownership: none
    x-covers: ['08 AC-25', '08 AC-29', '08 AC-31', '16 AC-65']
    x-audit: conversation.read_messages
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/AdminLimit'
    responses:
      '200':
        description: One page of messages.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/AdminConversationMessagePage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
  post:
    operationId: adminCreateConversationMessage
    summary: Write "as MyTask" in a refund/dispute thread
    description: |
      Staff messages exist only in `refund` threads (spec 13 AC-19, AC-21; spec 16 AC-40; spec 08 AC-30:
      staff cannot post into direct conversations or other threads → `403 FORBIDDEN`). Allowed while the
      refund request is pending, rejected by the seller or disputed; afterwards `409 STATE_CONFLICT`
      (read-only). Users see the sender as "MyTask". Text only, 1–750 characters; idempotent by
      `clientMessageId`. Both parties get EV-100 (email throttled 10 minutes per sender per request).
      Audited.
    tags: [Admin Conversations]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: refunds.thread.write
      ownership: none (refund threads only)
    x-covers: ['08 AC-30', '16 AC-65', '13 AC-19', '13 AC-21']
    x-audit: conversation.staff_message
    x-notifications: [EV-100]
    x-emits: [message.created, conversation.updated, conversation.unread_count_changed, badge.updated]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../schemas/d5.yaml#/AdminConversationMessageCreateRequest'}
    responses:
      '200':
        description: Replay of an earlier send with the same `clientMessageId`.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/AdminConversationMessage'}
      '201':
        description: The message was stored.
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/AdminConversationMessage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}
      '404': {$ref: '../components/responses.yaml#/NotFound'}
      '409': {$ref: '../components/responses.yaml#/Conflict'}

/admin/conversations/{conversationId}/messages/{messageId}/hide:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: conversationId
