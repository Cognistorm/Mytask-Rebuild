# ═════════════════════════ Admin — projects (spec 10 AC-11…AC-14, spec 16 AC-19, AC-22, AC-31) ═════════════════════════
/admin/projects:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
  get:
    operationId: adminListProjects
    summary: Project moderation queue and project list
    description: |
      The project queue is `status=pending_approval` with the default `sort=oldest`, 50 per page (spec
      16 AC-19, AC-22); the same operation lists projects in any status (incl. hidden and deleted) for
      the user page tab "Projects and proposals" (`userId` = owner, AC-31). Filters: date
      (`createdFrom`/`createdTo`), owner (`userId`), `projectCategoryId`, `q` (title or pid). Returns
      `totalCount` (queue counter, spec 16 AC-17). Empty queue: `t_admin_queue_empty`.
    tags: [Admin Projects]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: projects.moderate
      ownership: none
    x-covers: ['16 AC-19', '16 AC-22', '16 AC-31']
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/AdminLimit'
      - $ref: '../components/parameters.yaml#/UserIdFilter'
      - $ref: '../components/parameters.yaml#/CreatedFrom'
      - $ref: '../components/parameters.yaml#/CreatedTo'
      - name: status
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items: {$ref: '../schemas/d5.yaml#/ProjectStatus'}
      - name: projectCategoryId
        in: query
        required: false
        schema: {$ref: '../components/schemas.yaml#/Uuid'}
      - name: q
        in: query
        required: false
        schema: {type: string, minLength: 1, maxLength: 100}
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum: [oldest, newest]
          default: oldest
    responses:
      '200':
        description: One page of projects (with `totalCount`).
        content:
          application/json:
            schema: {$ref: '../schemas/d5.yaml#/AdminProjectListItemPage'}
      '400': {$ref: '../components/responses.yaml#/BadRequest'}
      '401': {$ref: '../components/responses.yaml#/Unauthorized'}
      '403': {$ref: '../components/responses.yaml#/Forbidden'}

/admin/projects/{projectId}:
  parameters:
    - $ref: '../components/parameters.yaml#/AcceptLanguage'
    - name: projectId
      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  get:
    operationId: adminGetProject
    summary: Project detail for staff (queue detail)
    description: The content as the public would see it (both languages) plus the owner summary — plan, ID verification, open reports, earlier rejections (spec 16 AC-19, AC-22). Any status, including deleted projects kept for audit (spec 10 AC-26, EC-10).
    tags: [Admin Projects]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: projects.moderate
      ownership: none
