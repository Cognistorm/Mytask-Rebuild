      in: path
      required: true
      schema: {$ref: '../components/schemas.yaml#/Uuid'}
  post:
    operationId: adminUnhideProject
    summary: Unhide a hidden project
    description: 'Restores the status the project had before it was hidden (`statusBeforeHidden`, spec 10 AC-14). Not hidden → `409 STATE_CONFLICT`. Audited.'
    tags: [Admin Projects]
    security: [{staffBearer: []}, {staffCookie: []}]
    x-permission:
      audience: staff
      permission: projects.moderate
      ownership: none
    x-covers: ['10 AC-14', '16 AC-22']
    x-audit: project.unhide
    x-emits: [project.status_changed]
    requestBody:
      required: false
      content:
        application/json:
          schema: {$ref: '../components/schemas.yaml#/StaffOptionalNoteRequest'}
    responses:
      '200':
        description: The restored project.
