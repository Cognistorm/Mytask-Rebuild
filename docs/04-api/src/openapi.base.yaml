components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User access token (JWT, EdDSA/Ed25519, `aud = user`, 15 minutes; ADR-002 §1). Used by the mobile
        apps and by the Next.js server for SSR. Refresh with `refreshSession`.
    userCookie:
      type: apiKey
      in: cookie
      name: __Host-mt_at
      description: |
        Browser session on `mytask.ge`: HttpOnly, Secure, SameSite=Lax, host-only (no `Domain`) access-token
        cookie set by the API, Path `/` (refresh cookie `__Secure-mt_rt`, host-only, Path `/api/v1/auth`).
        Unsafe methods also need `X-MyTask-Client: web` and an `Origin` exactly equal to the site origin
        (CSRF, ADR-002 §2).
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff access token (`aud = staff`). User tokens are refused on staff operations and vice versa (ADR-002 §2, ADR-010 §1). Sent by the admin app's own server (the token read from the staff cookie) and by API tests; staff tokens are returned in bodies only when `STAFF_BODY_TOKENS_ENABLED=true`, which production refuses (SEC-17).
    staffCookie:
      type: apiKey
      in: cookie
      name: __Host-mt_staff_at
      description: |
        Admin browser session on `admin.mytask.ge` (host-only cookie, Path `/`; refresh cookie
        `__Secure-mt_staff_rt`, host-only, Path `/api/v1/admin/auth`). Unsafe methods also need
        `X-MyTask-Client: admin` and an `Origin` exactly equal to the admin origin. In production the admin
        host is cookie-only: staff tokens are never returned in response bodies (ADR-002 §2, SEC-17).
