# Hand-written head of the contract. scripts/build-root.mjs adds `paths` and `components`
# ($refs into src/paths/*.yaml, src/schemas/*.yaml, src/components/*.yaml) and writes
# src/openapi.root.yaml, which Redocly lints and bundles into docs/04-api/openapi.yaml.
# Only the solution-architect edits this file (CLAUDE.md golden rule 2, ADR-014).
openapi: 3.1.0
info:
  title: MyTask.ge API
  version: 1.3.2
  summary: One API for the MyTask.ge website, mobile apps (iOS, Android) and admin panel.
  description: |
    **Status: approved by the Owner 2026-09-30 as the contract** (Phase 2 gate, version 1.0.0, including
    the Owner's gate answers Q-109…Q-121, Q-137, Q-144…Q-146). From now on every change needs an ADR in
    `docs/03-architecture/adr/` and a handoff to the backend, web and mobile engineers (CLAUDE.md rule 2).
    Changes since approval (all additive): **1.1.0** mobile version gate (ADR-018, Q-153); **1.2.0**
    social-login settings S-065…S-069 as `structured` values `SettingSocialProviderValue` /
    `SettingSocialProviderUpdate` (ADR-005 §8, Q-155) and the trusted-email rule of `completeSocialLogin`
    (ADR-002 §7, Q-156); **1.2.1** (descriptions only) staff-login IP bans: canonical spelling and
    automatic IPv6 bans per /64 prefix (ADR-002 §6, SEC-57, SEC-60); **1.2.2** (descriptions only) `register`
    limit 10 per IP per hour (Q-157, SEC-35); **1.2.3** (descriptions only) register rows S-131/S-132, the EV-02
    switch and hourly cap (Q-159); **1.2.4** (descriptions only) reCAPTCHA action and host per form (SEC-47); **1.3.0** new error
    `422 CUSTOM_CODE_HOST_DENIED` on `adminUpdateSetting` / `adminRestoreSettingVersion` (built-in
    tag-manager deny list, ADR-019 §3, Q-158 (a)); **1.3.1** `Me.countryCode` and `MeUpdateRequest.countryCode`
    marked deprecated (no country field in account settings, ADR-021, Owner 2026-10-02); **1.3.2** `x-rate-limit`
    30 saves per user per hour on `createPortfolioItem` / `updatePortfolioItem` with `429` (ADR-022, SEC-69), and
    "every attempt counts" on the shared report limit (I-31).

    **The contract is the law** (CLAUDE.md). Web (`apps/web`), mobile (`apps/mobile`) and admin
    (`apps/admin`) use only this API through the generated `packages/types` + `packages/api-client`
    (ADR-014). Business rules and permission checks live only in the API.

    Binding conventions: `docs/04-api/CONVENTIONS.md`. Realtime events: `docs/04-api/realtime.md`.
    Coverage (spec AC → operation): `docs/04-api/README.md`.

    ## Global rules
    - **Base path** `/api/v1`. Additive changes only within v1; clients ignore unknown fields and treat
      unknown enum values as "other" (ADR-014 §5).
    - **Language**: send `Accept-Language: ka|en` (default `ka`). Error messages and content are localized;
      missing English content falls back to Georgian with `contentLocale: "ka"` (ADR-006).
    - **Errors**: every non-2xx body is `{ code, message, details }` (schema `Error`); `code` is stable,
      `message` localized. `X-Request-Id` is on every response.
    - **Money**: `{ amount, currency }` with `amount` in integer **tetri** and `currency` = `GEL`
      (ADR-003). Clients never compute prices, fees or totals; they display API values.
    - **Dates**: ISO 8601 UTC with `Z`.
    - **Lists**: cursor pagination `?cursor=&limit=` → `{ data, nextCursor }`.
    - **Money operations** require `Idempotency-Key` (ADR-003 §6).
    - **Auth** (ADR-002): Ed25519 JWT access token (15 min) + rotating opaque refresh token.
      Mobile and server-side rendering send `Authorization: Bearer`; browsers use host-only HttpOnly
      cookies set by the API (`__Host-mt_at`, `__Secure-mt_rt`, `__Host-mt_did`; admin `__Host-mt_staff_at`,
      `__Secure-mt_staff_rt`). A revoked session stops working at once (deny-list, ADR-002 §1).
    - **CSRF** (ADR-002 §2): every POST/PUT/PATCH/DELETE that is not sent with `Authorization: Bearer`,
      including the public auth operations (register, login, 2FA, refresh, logout, social login, password
      and email links), must send `X-MyTask-Client` (`web` on `mytask.ge`, `admin` on `admin.mytask.ge`)
      and, when it carries a cookie, is a `web`/`admin` client or has an `Origin` header, an `Origin` that
      **exactly equals** the origin of the host it was sent to (no same-site or suffix matching); otherwise
      `403 CSRF_CHECK_FAILED`. Request bodies are `application/json` (else `400 VALIDATION_FAILED`, code
      `unsupported_content_type`); the only exception is the RFC 8058 one-click unsubscribe form POST.
    - **Client IP** (ADR-013 §14–§19): every "per IP" rule uses the one client IP set by the edge proxy;
      `X-Forwarded-For` and similar headers sent by clients are ignored.
    - **Account state** (any authenticated user operation, not listed per operation): a restricted user gets
      `403 ACCOUNT_RESTRICTED` except on operations whose `x-permission.audience` is `restricted-user`
      (restriction notice, appeals incl. `appeal_file` uploads, `/me`, logout, own notifications); a call
      made with a session that was ended by a ban gets `403 ACCOUNT_SUSPENDED` (`t_account_suspended`,
      spec 01 AC-45) and the client returns to the login screen.
    - **Staff** endpoints (`/admin/*`) are served on the admin host only, accept only staff-audience tokens,
      and each declares one RBAC permission in `x-permission.permission` (ADR-010, spec 16).
    - **Maintenance** (S-121): user endpoints answer `503 MAINTENANCE`; admin, webhooks and health keep working.
    - **Mobile version gate** (ADR-018): the apps send `X-MyTask-App-Version` (parameter `XMyTaskAppVersion`); responses
      to `ios`/`android` carry `X-Min-App-Version` (S-130); an older app gets `426 APP_VERSION_UNSUPPORTED`
      (`details.minVersion`, `details.platform`). Always served: health, public config, i18n bundles, BOG webhook.

    ## Vendor extensions used on operations
    `x-permission` (who may call; required), `x-covers` (spec ACs covered; required), `x-money`
    (money/points operation; requires `Idempotency-Key`), `x-rate-limit`, `x-notifications`
    (spec 15 events emitted), `x-emits` (realtime events), `x-settings` (register rows read),
    `x-audit` (audit-log action written). Definitions: CONVENTIONS.md §6.
  contact:
    name: MyTask.ge (Owner)
    url: https://mytask.ge/help/contact
  license:
    name: Proprietary. All rights reserved.
    identifier: LicenseRef-MyTask-Proprietary

servers:
  - url: http://localhost:3000/api/v1
    description: Local development (docker compose + pnpm dev). Serves both public and /admin operations.
  - url: https://staging.mytask.ge/api/v1
    description: Staging, public host (placeholder until Phase 5; basic-auth in front, noindex).
  - url: https://admin.staging.mytask.ge/api/v1
    description: Staging, admin host (placeholder). Use only for /admin/* operations.
  - url: https://mytask.ge/api/v1
    description: Production, public host (web same-origin, mobile). /admin/* is NOT served here.
  - url: https://admin.mytask.ge/api/v1
    description: Production, admin host (ADR-010). Use only for /admin/* operations (staff tokens, host-only cookies).

# Default: a signed-in user. Public, staff and webhook operations override `security` (CONVENTIONS §6.2).
security:
  - userBearer: []
  - userCookie: []

