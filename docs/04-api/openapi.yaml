paths:
  /admin/files:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: adminCreateFileUpload
      summary: Staff upload slot for public media
      description: |
        Same flow as `createFileUpload` for the staff purposes `category_image`, `blog_image` and
        `home_logo` (other purposes are refused with `422 FILE_PURPOSE_MISMATCH`). The required permission
        depends on the purpose (see `x-permission.permissionByPurpose`); exactly one permission is checked
        per call (spec 16 AC-9).
      tags:
        - Admin Files
      security:
        - staffBearer: []
        - staffCookie: []
      x-permission:
        audience: staff
        permission: catalog.write
        permissionByPurpose:
          category_image: catalog.write
          blog_image: content.write
          home_logo: content.write
        ownership: none
      x-covers: []
      x-covers-note: Infrastructure for spec 16 AC-60 (category image) and AC-63 (blog, home logos).
      x-audit: file.upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: Upload slot created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: fileId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: adminGetFile
      summary: Get a staff-uploaded file (status polling)
      tags:
        - Admin Files
      security:
        - staffBearer: []
        - staffCookie: []
      x-permission:
        audience: staff
        permission: '@self'
        ownership: files uploaded by the calling staff member only; others get 404
      x-covers: []
      x-covers-note: Infrastructure (ADR-009).
      responses:
        '200':
          description: The file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/files/{fileId}/complete:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: fileId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: adminCompleteFileUpload
      summary: Confirm a staff direct upload finished
      tags:
        - Admin Files
      security:
        - staffBearer: []
        - staffCookie: []
      x-permission:
        audience: staff
        permission: '@self'
        ownership: files uploaded by the calling staff member only; others get 404
      x-covers: []
      x-covers-note: Infrastructure (ADR-009).
      responses:
        '202':
          description: Scan queued; current file state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /files:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    post:
      operationId: createFileUpload
      summary: Request an upload slot (presigned POST)
      description: |
        Step 1 of the upload flow (ADR-009 §3). The API checks that the caller may upload for `purpose`
        (and `context`, e.g. only the freelancer of an escrow may upload a `delivery`), validates the
        declared size and type against the purpose's register rows (S-077…S-099, S-037…S-040), creates a
        `pending` file and returns a presigned POST limited to one `quarantine/` key, the declared content
        type and a size range. The client uploads directly to storage, then calls `completeFileUpload`.
        Unused pending files are deleted by a cleanup job after 24 hours.
      tags:
        - Files
      x-permission:
        audience: user
        ownership: caller becomes the file owner; purpose policy decides (e.g. delivery → freelancer of `context.escrowId`; chat_attachment → participant of `context.conversationId`; kyc_document → self)
      x-covers: []
      x-covers-note: Infrastructure for every upload AC; each group cites this operation in its coverage rows (e.g. 04 gallery, 06 delivery file, 08 attachments).
      x-settings:
        - S-037
        - S-038
        - S-039
        - S-040
        - S-077
        - S-078
        - S-079
        - S-080
        - S-081
        - S-082
        - S-083
        - S-084
        - S-085
        - S-086
        - S-087
        - S-088
        - S-089
        - S-090
        - S-091
        - S-092
        - S-093
        - S-094
        - S-095
        - S-096
        - S-097
        - S-098
        - S-099
      x-rate-limit: 60 requests / 10 min per user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: Upload slot created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: fileId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: getFile
      summary: Get an own file (status polling)
      description: Returns the caller's own file, e.g. to poll `scanning` → `ready` / `rejected` after `completeFileUpload`.
      tags:
        - Files
      x-permission:
        audience: user
        ownership: file owner only; others get 404
      x-covers: []
      x-covers-note: Infrastructure (ADR-009 §3).
      responses:
        '200':
          description: The file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteFile
      summary: Delete an own unattached file
      description: Removes an own file that is not yet attached to anything (e.g. the user removed it in a form before saving). Attached files are removed through the owning resource's operation. Refused with `409 STATE_CONFLICT` when attached.
      tags:
        - Files
      x-permission:
        audience: user
        ownership: file owner only; others get 404
      x-covers: []
      x-covers-note: Infrastructure (ADR-009).
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /files/{fileId}/complete:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: fileId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: completeFileUpload
      summary: Confirm the direct upload finished
      description: |
        Step 2 of the upload flow. Queues the scan job (magic bytes, size, ClamAV, image re-encoding with
        EXIF removal, ADR-009 §3.5). Returns the file in status `scanning`; poll `getFile` or wait for the
        realtime event `file.processed` (realtime.md). Idempotent: calling it again for a file already
        `scanning`/`ready` returns the current state.
      tags:
        - Files
      x-permission:
        audience: user
        ownership: file owner only; others get 404
      x-covers: []
      x-covers-note: Infrastructure (ADR-009 §3).
      x-emits:
        - file.processed
      responses:
        '202':
          description: Scan queued; current file state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /files/{fileId}/download:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: fileId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: getFileDownload
      summary: Download a private file (302 or JSON with a short-lived signed URL)
      description: |
        Policy check, then a presigned GET valid about 5 minutes with `Content-Disposition: attachment`
        and the original name (ADR-009 §4). `mode=redirect` (default, web links with cookies) answers
        `302`; `mode=json` (mobile, which authenticates with a Bearer header and then opens the URL in
        the system viewer) answers `200 {url, expiresAt}`. Who may download depends on
        where the file is attached: the owner; the buyer and freelancer of the escrow (deliveries,
        requirement files, offer attachments); the two participants of a conversation (chat
        attachments); the uploader only for KYC documents and appeal files. Everyone else gets `404`
        (never 403, so files cannot be probed). Staff never use this operation: they use the owning
        group's `/admin/...` download operation, which checks their permission and writes the audit log.
      tags:
        - Files
      x-permission:
        audience: user
        ownership: file owner, or a party of the resource the file is attached to (see description); others get 404
      x-covers:
        - 02 AC-39
        - 06 AC-24
        - 08 AC-10
        - 11 AC-35
        - 12 AC-12
        - 12 AC-33
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum:
              - redirect
              - json
            default: redirect
      responses:
        '200':
          description: '`mode=json`: the signed URL.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrl'
        '302':
          $ref: '#/components/responses/FoundRedirect'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User access token (JWT, EdDSA/Ed25519, `aud = user`, 15 minutes; ADR-002 §1). Used by the mobile
        apps and by the Next.js server for SSR. Refresh with `refreshSession`.
    userCookie:
      type: apiKey
      in: cookie
      name: mt_at
      description: |
        Browser session on `mytask.ge`: HttpOnly, Secure, SameSite=Lax access-token cookie set by the API
        (refresh cookie `mt_rt`, path `/api/v1/auth`). Unsafe methods also need `X-MyTask-Client: web` and a
        same-site `Origin` (CSRF, ADR-002 §2).
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff access token (`aud = staff`). User tokens are refused on staff operations and vice versa (ADR-002 §2, ADR-010 §1).
    staffCookie:
      type: apiKey
      in: cookie
      name: mt_staff_at
      description: |
        Admin browser session on `admin.mytask.ge` (host-only cookie; refresh cookie `mt_staff_rt`, path
        `/api/v1/admin/auth`). Unsafe methods also need `X-MyTask-Client: admin` and the admin `Origin`.
  schemas:
    ActorRef:
      type: object
      description: Who did something (timelines, audit, messages). `system` = background job (auto-release, expiry…).
      required:
        - type
        - user
        - staff
      properties:
        type:
          type: string
          enum:
            - user
            - staff
            - system
        user:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        staff:
          oneOf:
            - $ref: '#/components/schemas/StaffSummary'
            - type: 'null'
          description: Only filled in admin responses; user-facing responses show staff as "MyTask" with `staff = null`.
    Attachment:
      type: object
      description: A private file attached to something (delivery, message, offer, project, appeal). Download with `getFileDownload` (users) or the owning group's admin download operation (staff).
      required:
        - fileId
        - fileName
        - contentType
        - sizeBytes
      properties:
        fileId:
          $ref: '#/components/schemas/Uuid'
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
    AutoReleasePauseReason:
      type: string
      enum:
        - revision_requested
        - refund_open
        - dispute_open
        - auto_release_off
      description: Why the 72h auto-release clock is not running (spec 06 AC-29…; `auto_release_off` = S-025 is OFF, derived, not stored).
    BasisPoints:
      type: integer
      minimum: 0
      maximum: 10000
      description: A percentage in basis points (250 = 2.5%). Applied with integer maths, rounded half up to the tetri (R-3.8).
    BillingPeriod:
      type: string
      enum:
        - monthly
        - yearly
    CategoryRef:
      type: object
      description: Reference to a gig category (any level) or project category / skill. Full objects are owned by D2.
      required:
        - id
        - slug
        - name
        - contentLocale
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
        name:
          type: string
        contentLocale:
          $ref: '#/components/schemas/ContentLocale'
    CheckoutTarget:
      description: |
        What a checkout pays for. The discriminator `purpose` selects the variant. Used by D3's
        `createCheckoutQuote` and `createPayment`. D4 and D5 do not define their own pay endpoints: they
        reference these operations (CONVENTIONS §5.4).
      oneOf:
        - $ref: '#/components/schemas/GigOrderCheckoutTarget'
        - $ref: '#/components/schemas/ContractPaymentCheckoutTarget'
        - $ref: '#/components/schemas/CustomOfferCheckoutTarget'
        - $ref: '#/components/schemas/TopupCheckoutTarget'
        - $ref: '#/components/schemas/SubscriptionCheckoutTarget'
      discriminator:
        propertyName: purpose
        mapping:
          gig_order: '#/components/schemas/GigOrderCheckoutTarget'
          contract_payment: '#/components/schemas/ContractPaymentCheckoutTarget'
          custom_offer: '#/components/schemas/CustomOfferCheckoutTarget'
          topup: '#/components/schemas/TopupCheckoutTarget'
          subscription: '#/components/schemas/SubscriptionCheckoutTarget'
    CommonErrorCode:
      type: string
      description: Cross-cutting error codes (HTTP status in brackets). See CONVENTIONS §7.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - CSRF_CHECK_FAILED
        - ACCOUNT_RESTRICTED
        - REAUTH_REQUIRED
        - FEATURE_DISABLED
        - PREMIUM_REQUIRED
        - PLAN_LIMIT_REACHED
        - NOT_FOUND
        - STATE_CONFLICT
        - DUPLICATE
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - BUSINESS_RULE_VIOLATION
        - INSUFFICIENT_FUNDS
        - FILE_NOT_READY
        - FILE_TYPE_NOT_ALLOWED
        - FILE_TOO_LARGE
        - FILE_PURPOSE_MISMATCH
        - RATE_LIMITED
        - APP_VERSION_UNSUPPORTED
        - MAINTENANCE
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
      x-enumDescriptions:
        VALIDATION_FAILED: '[400] Request body/params invalid or malformed. `details.fields` lists each field.'
        UNAUTHENTICATED: '[401] No valid access token (missing, expired, revoked, wrong audience). Clients refresh once, then send the user to login.'
        FORBIDDEN: '[403] Authenticated but not allowed (ownership, role, missing staff permission in `details.permission`).'
        CSRF_CHECK_FAILED: '[403] Cookie-authenticated unsafe request without `X-MyTask-Client: web|admin` or with a foreign `Origin` (ADR-002 §2).'
        ACCOUNT_RESTRICTED: '[403] The user is restricted (spec 01 R-A8); only restriction/appeal operations are allowed.'
        REAUTH_REQUIRED: '[403] Staff high-risk action without re-authentication in the last 15 minutes (spec 16 AC-7). Call `adminReauthenticate`, then retry.'
        FEATURE_DISABLED: '[403] A register toggle is OFF (spec 00 AC-11). `details.settingId` names it.'
        PREMIUM_REQUIRED: '[403] The action needs Premium (e.g. proposals, Q-020).'
        PLAN_LIMIT_REACHED: '[422] A plan limit S-001…S-007 is reached (`details.limit`, `details.settingId`).'
        NOT_FOUND: '[404] The resource does not exist or the caller may not know it exists.'
        STATE_CONFLICT: '[409] The resource is not in a state that allows this action (already decided, status changed, concurrent update). `details.currentState` when safe to reveal.'
        DUPLICATE: '[409] A unique value is already taken or the same thing was already submitted (e.g. second report).'
        IDEMPOTENCY_KEY_REQUIRED: '[400] Money operation called without `Idempotency-Key`.'
        IDEMPOTENCY_KEY_REUSED: '[422] Same `Idempotency-Key` sent with a different request body (ADR-003 §6).'
        IDEMPOTENCY_IN_PROGRESS: '[409] The first request with this key is still being processed; retry after `Retry-After`.'
        BUSINESS_RULE_VIOLATION: '[422] Generic rule refusal when no more specific code exists; `details.messageKey` carries the spec text.'
        INSUFFICIENT_FUNDS: '[422] Available balance (or points) too low (spec 05 AC-19/20, spec 14, spec 05 AC-42/43).'
        FILE_NOT_READY: '[422] A referenced file is not `ready` (still scanning or rejected, ADR-009 §3.6).'
        FILE_TYPE_NOT_ALLOWED: '[422] File type not allowed for this purpose (settings register).'
        FILE_TOO_LARGE: '[422] File size above the purpose limit (settings register).'
        FILE_PURPOSE_MISMATCH: '[422] A file uploaded for another purpose or by another owner was referenced.'
        RATE_LIMITED: '[429] Too many requests; see `Retry-After`.'
        APP_VERSION_UNSUPPORTED: '[426] Mobile app older than `X-Min-App-Version` (ADR-014 §5); the app asks the user to update.'
        MAINTENANCE: '[503] Maintenance mode S-121 is ON (spec 16 AC-70). Not returned for admin, webhooks or health.'
        SERVICE_UNAVAILABLE: '[503] A dependency is down; retry later.'
        INTERNAL_ERROR: '[500] Unexpected error; `X-Request-Id` identifies it in the logs.'
    ContentLocale:
      type: string
      enum:
        - ka
        - en
      description: |
        The language the returned content fields are actually in. Equals the requested `Accept-Language`
        unless the English translation is missing, in which case it is `ka` and clients show
        `t_content_shown_in_georgian` (ADR-006 §6, Q-023).
    ContractPaymentCheckoutTarget:
      type: object
      description: The one escrow payment of an accepted project contract (spec 11 "One escrow payment").
      required:
        - purpose
        - contractPaymentId
      properties:
        purpose:
          type: string
          const: contract_payment
        contractPaymentId:
          $ref: '#/components/schemas/Uuid'
    ConversationKind:
      type: string
      enum:
        - direct
        - order_item
        - project
        - custom_offer
        - refund
      description: data-model §3.N / spec 08 R-M2.
    ConversationRef:
      type: object
      description: Link from a resource to its thread (order item delivery thread, project thread, offer thread, refund/dispute thread). Messages are read and written through D5's `/conversations/{conversationId}/messages`.
      required:
        - id
        - kind
        - unreadCount
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/ConversationKind'
        unreadCount:
          type: integer
          minimum: 0
          description: For the caller; 0 in admin responses.
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      description: ISO 3166-1 alpha-2 country code.
    Currency:
      type: string
      const: GEL
      description: The only currency (P-13).
    CursorPage:
      type: object
      description: |
        Base shape of every list response (CONVENTIONS §8). Concrete lists are named `<Item>Page` and use
        `allOf: [{$ref: CursorPage}, {properties: {data: {type: array, items: {$ref: <Item>}}}}]`.
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items: {}
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        totalCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Only present when the operation documents that it returns a total (e.g. admin queue counters); otherwise omitted.
    CustomOfferCheckoutTarget:
      type: object
      description: Accept-and-pay of a sent custom offer (spec 12 "Buyer's answer").
      required:
        - purpose
        - customOfferId
      properties:
        purpose:
          type: string
          const: custom_offer
        customOfferId:
          $ref: '#/components/schemas/Uuid'
    D1ErrorCode:
      type: string
      x-stub: true
      description: |
        Domain error codes of D1 (CONVENTIONS §7.3). The D1 run replaces this stub with
        `enum: [...]` plus `x-enumDescriptions` ("[HTTP status] meaning; messageKey t_..."), using only
        the D1 errorPrefixes from src/ownership.yaml, and removes `x-stub`.
    D2ErrorCode:
      type: string
      x-stub: true
      description: |
        Domain error codes of D2 (CONVENTIONS §7.3). The D2 run replaces this stub with
        `enum: [...]` plus `x-enumDescriptions` ("[HTTP status] meaning; messageKey t_..."), using only
        the D2 errorPrefixes from src/ownership.yaml, and removes `x-stub`.
    D3ErrorCode:
      type: string
      x-stub: true
      description: |
        Domain error codes of D3 (CONVENTIONS §7.3). The D3 run replaces this stub with
        `enum: [...]` plus `x-enumDescriptions` ("[HTTP status] meaning; messageKey t_..."), using only
        the D3 errorPrefixes from src/ownership.yaml, and removes `x-stub`.
    D4ErrorCode:
      type: string
      x-stub: true
      description: |
        Domain error codes of D4 (CONVENTIONS §7.3). The D4 run replaces this stub with
        `enum: [...]` plus `x-enumDescriptions` ("[HTTP status] meaning; messageKey t_..."), using only
        the D4 errorPrefixes from src/ownership.yaml, and removes `x-stub`.
    D5ErrorCode:
      type: string
      x-stub: true
      description: |
        Domain error codes of D5 (CONVENTIONS §7.3). The D5 run replaces this stub with
        `enum: [...]` plus `x-enumDescriptions` ("[HTTP status] meaning; messageKey t_..."), using only
        the D5 errorPrefixes from src/ownership.yaml, and removes `x-stub`.
    D6ErrorCode:
      type: string
      x-stub: true
      description: |
        Domain error codes of D6 (CONVENTIONS §7.3). The D6 run replaces this stub with
        `enum: [...]` plus `x-enumDescriptions` ("[HTTP status] meaning; messageKey t_..."), using only
        the D6 errorPrefixes from src/ownership.yaml, and removes `x-stub`.
    DateOnly:
      type: string
      format: date
      description: Calendar date `YYYY-MM-DD`, interpreted in `Asia/Tbilisi` unless the operation says otherwise.
      examples:
        - '2026-09-28'
    EmailAddress:
      type: string
      format: email
      maxLength: 254
    Error:
      type: object
      description: |
        The one error body for every non-2xx response (CONVENTIONS §7). `code` is stable and machine-readable
        (clients branch on it). `message` is localized by `Accept-Language` from the spec's `t_*` key.
        `details` is always an object (possibly empty).
      required:
        - code
        - message
        - details
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable, localized (ka|en). Never parsed by clients.
        details:
          $ref: '#/components/schemas/ErrorDetails'
      examples:
        - code: PLAN_LIMIT_REACHED
          message: თქვენი გეგმის ლიმიტი ამოწურულია
          details:
            messageKey: t_gig_limit_reached
            limit: 1
            settingId: S-001
    ErrorCode:
      description: |
        Every error code the API can return. Common codes are listed in `CommonErrorCode`; each group adds its
        domain codes (with its reserved prefixes, CONVENTIONS §7.3) to its own `D<n>ErrorCode` enum in
        `src/schemas/d<n>.yaml`. Clients must treat an unknown code like `INTERNAL_ERROR` for display purposes.
      anyOf:
        - $ref: '#/components/schemas/CommonErrorCode'
        - $ref: '#/components/schemas/D1ErrorCode'
        - $ref: '#/components/schemas/D2ErrorCode'
        - $ref: '#/components/schemas/D3ErrorCode'
        - $ref: '#/components/schemas/D4ErrorCode'
        - $ref: '#/components/schemas/D5ErrorCode'
        - $ref: '#/components/schemas/D6ErrorCode'
    ErrorDetails:
      type: object
      description: Well-known optional members; operations may document additional members for specific codes.
      additionalProperties: true
      properties:
        messageKey:
          type: string
          pattern: ^t_[a-z0-9_]+$
          description: The i18n key of `message` (packages/i18n), for clients that render from their own bundle.
        fields:
          type: array
          description: Field errors for `VALIDATION_FAILED`.
          items:
            $ref: '#/components/schemas/FieldError'
        permission:
          type: string
          description: Missing staff permission for `FORBIDDEN` on admin operations (spec 16 AC-9).
        settingId:
          type: string
          pattern: ^S-[0-9]{3}$
          description: Register row behind `FEATURE_DISABLED` / `PLAN_LIMIT_REACHED` / limits.
        limit:
          type: integer
          description: The limit that was hit, when relevant.
        retryAfterSeconds:
          type: integer
          minimum: 0
        currentState:
          type: string
          description: Current status of the resource for `STATE_CONFLICT`.
    EscrowCloseReason:
      type: string
      enum:
        - completed_by_buyer
        - auto_release
        - admin_release
        - unblock_approved
        - dispute_release
        - canceled_before_start
        - refund_accepted_by_seller
        - refund_accepted_by_admin
        - dispute_refund
        - legacy_settlement
    EscrowKind:
      type: string
      enum:
        - gig_order_item
        - contract_payment
        - custom_offer
        - legacy_hold
    EscrowStatus:
      type: string
      enum:
        - funded
        - released
        - refunded
      description: data-model §4.2. `funded` = money is on HOLD for the freelancer.
    EscrowSummary:
      type: object
      description: |
        The protected unit of money and work behind every paid item (data-model §3.I). Embedded by D4 (order
        items, custom offers) and D5 (contracts). Escrow operations (`/escrows/…`: deliveries, revision
        requests, completion) are owned by D4 and shared by all three item types.
      required:
        - id
        - kind
        - status
        - amount
        - fundedAt
        - closedAt
        - closeReason
        - revisionsAllowed
        - revisionsUsed
        - deliveryCount
        - lastDeliveredAt
        - autoReleaseAt
        - autoReleasePausedReason
        - refundOpen
        - disputeOpen
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/EscrowKind'
        status:
          $ref: '#/components/schemas/EscrowStatus'
        amount:
          $ref: '#/components/schemas/Money'
          description: Freelancer amount P′ held (funded amount). Buyers never see an escrow balance of their own (Q-008).
        fundedAt:
          $ref: '#/components/schemas/Timestamp'
        closedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        closeReason:
          oneOf:
            - $ref: '#/components/schemas/EscrowCloseReason'
            - type: 'null'
        revisionsAllowed:
          type: integer
          minimum: 0
        revisionsUsed:
          type: integer
          minimum: 0
        deliveryCount:
          type: integer
          minimum: 0
        lastDeliveredAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        autoReleaseAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Deadline of the automatic release (S-026 snapshot), null when not running.
        autoReleasePausedReason:
          oneOf:
            - $ref: '#/components/schemas/AutoReleasePauseReason'
            - type: 'null'
        refundOpen:
          type: boolean
        disputeOpen:
          type: boolean
    FeeLine:
      type: object
      description: One fee computed by the Commission & Fee module (ADR-005 §6), snapshotted with its rule version. Used in quotes, receipts, withdrawals and admin previews.
      required:
        - feeCode
        - payer
        - amount
        - feeRuleVersionId
      properties:
        feeCode:
          type: string
          description: fee_rules.code, e.g. `card_surcharge.bog`, `withdrawal.standard`, `gig_order.commission`.
        payer:
          type: string
          enum:
            - buyer
            - freelancer
        amount:
          $ref: '#/components/schemas/Money'
        rate:
          oneOf:
            - $ref: '#/components/schemas/BasisPoints'
            - type: 'null'
          description: Percent rules only; null for fixed fees.
        feeRuleVersionId:
          $ref: '#/components/schemas/Uuid'
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: JSON pointer-like path of the request field, e.g. `title.ka`, `items[2].gigId`.
        code:
          type: string
          description: Validation code, e.g. `required`, `too_long`, `too_short`, `pattern`, `out_of_range`, `not_allowed`, `georgian_letters_not_allowed`.
        message:
          type: string
          description: Localized.
        messageKey:
          type: string
          pattern: ^t_[a-z0-9_]+$
    File:
      type: object
      description: |
        An uploaded file. Only `ready` files can be attached (ADR-009 §3.6). Public images expose `image`
        (CDN variants); private files are downloaded through `getFileDownload` (302 to a short-lived
        signed URL after a policy check).
      required:
        - id
        - purpose
        - status
        - fileName
        - contentType
        - sizeBytes
        - rejectReason
        - image
        - createdAt
        - readyAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        purpose:
          $ref: '#/components/schemas/FilePurpose'
        status:
          $ref: '#/components/schemas/FileStatus'
        fileName:
          type: string
        contentType:
          type: string
          description: Detected type once scanned; declared type before.
        sizeBytes:
          type: integer
          format: int64
        rejectReason:
          type:
            - string
            - 'null'
          description: Localized reason when `rejected` (type mismatch, virus, too large).
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageVariants'
            - type: 'null'
          description: Set for ready public images only.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        readyAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    FileProcessedEvent:
      type: object
      description: 'Foundation event `file.processed` (room `user:{ownerUserId}` or `staff:{staffId}`): the scan of an upload finished (`ready` or `rejected`).'
      required:
        - file
      properties:
        file:
          $ref: '#/components/schemas/File'
    FilePurpose:
      type: string
      description: |
        Upload purpose (data-model §3.Q). The purpose decides bucket, allowed types and size (settings
        register S-077…S-099, S-037…S-040) and who may attach the file where. User purposes use
        `createFileUpload`; staff purposes (`category_image`, `blog_image`, `home_logo`) use
        `adminCreateFileUpload`.
      enum:
        - avatar
        - gig_image
        - gig_thumbnail
        - gig_document
        - portfolio_image
        - category_image
        - blog_image
        - project_thumbnail
        - project_file
        - delivery
        - chat_attachment
        - offer_attachment
        - appeal_file
        - kyc_document
        - home_logo
    FileStatus:
      type: string
      enum:
        - pending
        - scanning
        - ready
        - rejected
        - deleted
    FileUploadRequest:
      type: object
      required:
        - purpose
        - fileName
        - sizeBytes
        - contentType
      properties:
        purpose:
          $ref: '#/components/schemas/FilePurpose'
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        contentType:
          type: string
          maxLength: 127
          examples:
            - image/jpeg
        context:
          type:
            - object
            - 'null'
          description: |
            Optional context the policy needs, e.g. `{escrowId}` for a delivery (only the freelancer of that
            escrow may upload), `{conversationId}` for a chat attachment. Keys are camelCase ids.
          additionalProperties:
            type: string
    FileUploadTicket:
      type: object
      description: A presigned POST (direct upload to S3-compatible storage, `quarantine/` prefix). The client sends a `multipart/form-data` POST to `url` with every `fields` entry followed by the file field `file`, then calls `completeFileUpload`.
      required:
        - file
        - upload
      properties:
        file:
          $ref: '#/components/schemas/File'
        upload:
          type: object
          required:
            - url
            - method
            - fields
            - expiresAt
          properties:
            url:
              $ref: '#/components/schemas/HttpUrl'
            method:
              type: string
              const: POST
            fields:
              type: object
              additionalProperties:
                type: string
            expiresAt:
              $ref: '#/components/schemas/Timestamp'
    GigOrderCheckoutTarget:
      type: object
      description: |
        `source = cart`: check out the caller's server-side cart (spec 06 AC-6…AC-9; the cart lines are
        re-validated). `source = order`: pay again for an existing order still awaiting payment, at its
        stored prices (spec 06 AC-11); `orderId` required.
      required:
        - purpose
        - source
      properties:
        purpose:
          type: string
          const: gig_order
        source:
          type: string
          enum:
            - cart
            - order
        orderId:
          $ref: '#/components/schemas/Uuid'
          description: Required when `source = order`.
    GigRef:
      type: object
      description: Minimal gig reference (cart lines, order items, reviews, reports). Full gig objects are owned by D2.
      required:
        - id
        - uid
        - slug
        - title
        - contentLocale
        - thumbnail
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        uid:
          type: string
          description: Legacy public id (20 chars) used in `/service/{slug}` (P-33).
        slug:
          type: string
        title:
          type: string
        contentLocale:
          $ref: '#/components/schemas/ContentLocale'
        thumbnail:
          oneOf:
            - $ref: '#/components/schemas/ImageVariants'
            - type: 'null'
    HttpUrl:
      type: string
      format: uri
      pattern: ^https?://
    ImageVariants:
      type: object
      description: Public, processed image (bucket `public-media`, ADR-009). URLs are stable CDN URLs; no auth needed.
      required:
        - fileId
        - thumb
        - medium
        - large
        - width
        - height
      properties:
        fileId:
          $ref: '#/components/schemas/Uuid'
        thumb:
          $ref: '#/components/schemas/HttpUrl'
        medium:
          $ref: '#/components/schemas/HttpUrl'
        large:
          $ref: '#/components/schemas/HttpUrl'
        width:
          type:
            - integer
            - 'null'
        height:
          type:
            - integer
            - 'null'
    Locale:
      type: string
      enum:
        - ka
        - en
      description: Language code. `ka` (Georgian) is the default and the fallback (Q-023).
    LocalizedString:
      type: object
      description: |
        A translatable text as edited by staff or an owner (both languages at once). Used in **write**
        requests and in **admin** reads. Public reads return the single resolved string plus `contentLocale`
        (CONVENTIONS §11). `ka` is required; `en` may be null (then readers get the Georgian text).
      required:
        - ka
        - en
      properties:
        ka:
          type: string
        en:
          type:
            - string
            - 'null'
    Money:
      type: object
      description: An amount of money. `amount` is an integer number of **tetri** (1 GEL = 100 tetri); no floats anywhere (ADR-003). May be negative only where the operation says so (e.g. migrated negative balances, ledger lines).
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int64
          description: Integer tetri.
          examples:
            - 10250
        currency:
          $ref: '#/components/schemas/Currency'
      examples:
        - amount: 10250
          currency: GEL
    NextCursor:
      type:
        - string
        - 'null'
      description: Opaque cursor for the next page, or null when this is the last page. Pass it back unchanged as `?cursor=`.
    PaymentMethod:
      type: string
      enum:
        - bog_card
        - wallet
        - bank_transfer
      description: Points are not a payment method (Q-052); Premium with points has its own operation (D3).
    PaymentPurpose:
      type: string
      enum:
        - gig_order
        - contract_payment
        - custom_offer
        - topup
        - subscription
        - subscription_renewal
      description: data-model §3.J. `subscription_renewal` is created only by the renewal job.
    PaymentStatus:
      type: string
      enum:
        - created
        - pending
        - paid
        - paid_unapplied
        - failed
        - expired
        - canceled
        - rejected
      description: data-model §4.3. Only `paid` and `paid_unapplied` have money effects.
    PaymentSummary:
      type: object
      description: Minimal payment view embedded by other groups (e.g. an order awaiting payment shows its last payment). Full payment and receipt schemas are owned by D3.
      required:
        - id
        - purpose
        - method
        - status
        - total
        - createdAt
        - paidAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        purpose:
          $ref: '#/components/schemas/PaymentPurpose'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        total:
          $ref: '#/components/schemas/Money'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        paidAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    PlanCode:
      type: string
      enum:
        - standard
        - premium
      description: User plan (spec 00 §2). Every user is buyer and freelancer (Q-013); the plan only changes limits and Premium features.
    ProjectRef:
      type: object
      description: Minimal project reference. Full project objects are owned by D5.
      required:
        - id
        - pid
        - slug
        - title
        - contentLocale
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        pid:
          type: string
          pattern: ^[0-9]{6}$
          description: Legacy public number used in `/project/{pid}/{slug}`.
        slug:
          type: string
        title:
          type: string
        contentLocale:
          $ref: '#/components/schemas/ContentLocale'
    RealtimeEnvelope:
      type: object
      description: |
        Every Socket.IO event payload is wrapped in this envelope (docs/04-api/realtime.md). `data` is the
        event's payload schema named `<EventName>Event` in the owning group's schema file.
      required:
        - event
        - id
        - occurredAt
        - data
      properties:
        event:
          type: string
          pattern: ^[a-z_]+(\.[a-z_]+)+$
          examples:
            - message.created
        id:
          $ref: '#/components/schemas/Uuid'
          description: Event id (deduplicate on reconnect).
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
    ReportTargetType:
      type: string
      enum:
        - user
        - gig
        - project
        - proposal
      description: The four reportable things (spec 16 AC-28, one queue P-118). Creation endpoints live with the owning resource (CONVENTIONS §5.5).
    ReviewRef:
      type: object
      description: Embedded on order items, contracts and offers to show whether a review exists (spec 07). Full review objects are owned by D2.
      required:
        - id
        - rating
        - authorRole
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        rating:
          type: integer
          minimum: 1
          maximum: 5
        authorRole:
          type: string
          enum:
            - buyer
            - freelancer
    SignedUrl:
      type: object
      description: A short-lived presigned download URL (ADR-009 §4). Never cache it; request a new one when expired.
      required:
        - url
        - expiresAt
      properties:
        url:
          $ref: '#/components/schemas/HttpUrl'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    StaffOptionalNoteRequest:
      type: object
      description: Body for staff decisions where a note is optional (approve, publish…).
      properties:
        note:
          type:
            - string
            - 'null'
          maxLength: 1000
    StaffReasonRequest:
      type: object
      description: Body for staff decisions that need a reason (reject, remove, hide, ban…). Shown to the owner unless the operation says it is internal (spec 16 AC-19).
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    StaffSummary:
      type: object
      description: A staff member as shown in admin views and audit entries. Users never see staff identities; to users staff appear as "MyTask".
      required:
        - id
        - username
        - fullName
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        username:
          type: string
        fullName:
          type: string
    SubscriptionCheckoutTarget:
      type: object
      description: Premium purchase by card (spec 09; ADR-016 for mobile, S-126).
      required:
        - purpose
        - plan
        - billingPeriod
      properties:
        purpose:
          type: string
          const: subscription
        plan:
          type: string
          const: premium
        billingPeriod:
          $ref: '#/components/schemas/BillingPeriod'
        promoCode:
          type:
            - string
            - 'null'
          maxLength: 64
    Timestamp:
      type: string
      format: date-time
      pattern: Z$
      description: ISO 8601 date-time in UTC with the `Z` suffix. Clients format it in `Asia/Tbilisi` or the device zone.
      examples:
        - '2026-09-28T10:00:00Z'
    TopupCheckoutTarget:
      type: object
      description: Wallet top-up of `amount` A (credited amount; limits S-023/S-024 apply to A, spec 05 AC-21/22).
      required:
        - purpose
        - amount
      properties:
        purpose:
          type: string
          const: topup
        amount:
          $ref: '#/components/schemas/Money'
    UserSummary:
      type: object
      description: |
        Minimal public view of another user, embedded wherever a user appears (seller, buyer, author, other
        party). Owned by D1 for semantics. `username` may be masked on project pages (BR-015, spec 02
        "Username masking"), then `usernameMasked` is true and the profile link must not be shown.
      required:
        - id
        - username
        - usernameMasked
        - avatar
        - isPremium
        - isIdVerified
        - isOnline
        - countryCode
        - isDeleted
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        username:
          type: string
        usernameMasked:
          type: boolean
        avatar:
          oneOf:
            - $ref: '#/components/schemas/ImageVariants'
            - type: 'null'
        isPremium:
          type: boolean
          description: Shows the Premium / "Featured" mark (Q-069).
        isIdVerified:
          type: boolean
          description: KYC approved (spec 02 AC-36).
        isOnline:
          type: boolean
          description: Active in the last 10 minutes (BR-012).
        countryCode:
          oneOf:
            - $ref: '#/components/schemas/CountryCode'
            - type: 'null'
        isDeleted:
          type: boolean
          description: Deleted accounts are shown with a neutral label (spec 08 "Deleted users").
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 generated by the API (data-model §1). Never shown to users as an order number.
      examples:
        - 01927b3e-6c1a-7d2e-9f10-3a4b5c6d7e8f
    WorkItemRef:
      type: object
      description: |
        Reference to a paid unit of work (gig order item, project contract payment, custom offer). Used by
        payments, transactions, HOLD lists, refunds, unblock requests, reviews and notifications to link to
        the item without depending on another group's full schema. `displayId` is what users see
        (order item uid, project pid, offer uid).
      required:
        - type
        - id
        - displayId
        - title
        - escrowId
        - orderId
        - contractId
        - project
        - gig
      properties:
        type:
          $ref: '#/components/schemas/WorkItemType'
        id:
          $ref: '#/components/schemas/Uuid'
          description: order item id, contract payment id or custom offer id (by `type`).
        displayId:
          type: string
        title:
          type: string
          description: Snapshot title (gig title, project title, offer description excerpt).
        escrowId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Null while awaiting payment (no escrow exists before a verified payment, ADR-003 §7).
        orderId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Set for `order_item`.
        contractId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Set for `contract_payment`.
        project:
          oneOf:
            - $ref: '#/components/schemas/ProjectRef'
            - type: 'null'
        gig:
          oneOf:
            - $ref: '#/components/schemas/GigRef'
            - type: 'null'
    WorkItemType:
      type: string
      enum:
        - order_item
        - contract_payment
        - custom_offer
      description: The three things a buyer pays for and that own one escrow each (data-model §3.I).
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Response language: `ka` (default) or `en`. Anything else is treated as `ka`. Localizes error
        `message`s and content fields; content missing in English falls back to Georgian with
        `contentLocale: ka` (ADR-006 §2, §6). **Every path item declares this parameter** at path-item level.
      schema:
        type: string
        enum:
          - ka
          - en
        default: ka
    AdminLimit:
      name: limit
      in: query
      required: false
      description: Page size for admin lists (spec 16 AC-19, AC-30 use 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CreatedFrom:
      name: createdFrom
      in: query
      required: false
      description: Inclusive lower bound (UTC).
      schema:
        type: string
        format: date-time
    CreatedTo:
      name: createdTo
      in: query
      required: false
      description: Exclusive upper bound (UTC).
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page's `nextCursor`. Omit for the first page.
      schema:
        type: string
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every money operation (CONVENTIONS §9, ADR-003 §6). A client-generated UUID (v4 or v7),
        one per user intent (e.g. one per press of "Pay"). The API keeps (key, caller, operation, body hash,
        response) for 24 hours: a repeat with the same body replays the stored response with
        `Idempotent-Replayed: true`; a repeat with a different body is refused with
        `422 IDEMPOTENCY_KEY_REUSED`; a repeat while the first is still running gets
        `409 IDEMPOTENCY_IN_PROGRESS`.
      schema:
        type: string
        minLength: 16
        maxLength: 100
        pattern: ^[A-Za-z0-9-]+$
    Limit:
      name: limit
      in: query
      required: false
      description: Page size for user-facing lists. Default 20 unless the operation description states the spec's page size (e.g. 40 transactions, spec 05 AC-31).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserIdFilter:
      name: userId
      in: query
      required: false
      description: Admin lists only. Restricts the list to items where this user takes part (as owner, buyer, freelancer or author, per operation). Feeds the user page tabs (spec 16 AC-31).
      schema:
        type: string
        format: uuid
    XMyTaskClient:
      name: X-MyTask-Client
      in: header
      required: false
      description: |
        Which client calls. Sent on every request by `packages/api-client`. Required on cookie-authenticated
        unsafe requests (CSRF defence, ADR-002 §2; missing → `403 CSRF_CHECK_FAILED`). Reference it
        explicitly only on operations whose **behaviour** depends on it (e.g. `createPayment`, ADR-016 §3).
      schema:
        type: string
        enum:
          - web
          - admin
          - ios
          - android
  responses:
    BadRequest:
      description: '`VALIDATION_FAILED` (field errors in `details.fields`) or `IDEMPOTENCY_KEY_REQUIRED`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_FAILED
            message: შეამოწმეთ მონიშნული ველები
            details:
              fields:
                - field: title.ka
                  code: too_short
                  message: სათაური ძალიან მოკლეა
                  messageKey: t_title_too_short
    Conflict:
      description: '`STATE_CONFLICT`, `DUPLICATE`, `IDEMPOTENCY_IN_PROGRESS` or a documented domain code (e.g. `QUOTE_CHANGED`).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`FORBIDDEN` (ownership/role/staff permission), `CSRF_CHECK_FAILED`, `ACCOUNT_RESTRICTED`, `REAUTH_REQUIRED`, `FEATURE_DISABLED`, `PREMIUM_REQUIRED` or a documented domain code.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FoundRedirect:
      description: 302 redirect to `Location` (e.g. a short-lived signed download URL, ADR-009 §4). Never cached.
      headers:
        Location:
          $ref: '#/components/headers/Location'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    NoContent:
      description: Done; no body.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    NotFound:
      description: '`NOT_FOUND`. Also used instead of 403 when the caller must not learn that the resource exists (e.g. hidden project for non-owners).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: '`MAINTENANCE` (S-121 ON) or `SERVICE_UNAVAILABLE`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: '`RATE_LIMITED` (or a documented domain throttle code). Wait `Retry-After` seconds.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '`UNAUTHENTICATED`: missing, expired or revoked token, or a token of the wrong audience (user vs staff).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: 'Valid request refused by a business rule: `BUSINESS_RULE_VIOLATION`, `PLAN_LIMIT_REACHED`, `INSUFFICIENT_FUNDS`, `IDEMPOTENCY_KEY_REUSED`, `FILE_*` or a documented domain code.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    ContentLanguage:
      description: Language of the localized parts of the response (`ka` or `en`).
      schema:
        type: string
        enum:
          - ka
          - en
    ETag:
      description: Entity tag for conditional GET (`If-None-Match` → 304).
      schema:
        type: string
    IdempotentReplayed:
      description: '`true` when this response is a stored replay of an earlier request with the same `Idempotency-Key`.'
      schema:
        type: boolean
    Location:
      description: Redirect target.
      schema:
        type: string
        format: uri
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    XRequestId:
      description: Request id, also in the logs and shown on client error screens (ADR-015).
      schema:
        type: string
