# GENERATED by `npm run bundle` in docs/04-api from docs/04-api/src (Redocly bundle). DO NOT EDIT BY HAND.
# The contract is the law (CLAUDE.md). Only the solution-architect changes docs/04-api/src, with an ADR after approval.
openapi: 3.1.0
info:
  title: MyTask.ge API
  version: 1.0.0-draft
  summary: One API for the MyTask.ge website, mobile apps (iOS, Android) and admin panel.
  description: |
    **The contract is the law** (CLAUDE.md). Web (`apps/web`), mobile (`apps/mobile`) and admin
    (`apps/admin`) use only this API through the generated `packages/types` + `packages/api-client`
    (ADR-014). Business rules and permission checks live only in the API.

    Binding conventions: `docs/04-api/CONVENTIONS.md`. Realtime events: `docs/04-api/realtime.md`.
    Coverage (spec AC → operation): `docs/04-api/README.md`.

    ## Global rules
    - **Base path** `/api/v1`. Additive changes only within v1; clients ignore unknown fields and treat
      unknown enum values as "other" (ADR-014 §5).
    - **Language**: send `Accept-Language: ka|en` (default `ka`). Error messages and content are localized;
      missing English content falls back to Georgian with `contentLocale: "ka"` (ADR-006).
    - **Errors**: every non-2xx body is `{ code, message, details }` (schema `Error`); `code` is stable,
      `message` localized. `X-Request-Id` is on every response.
    - **Money**: `{ amount, currency }` with `amount` in integer **tetri** and `currency` = `GEL`
      (ADR-003). Clients never compute prices, fees or totals; they display API values.
    - **Dates**: ISO 8601 UTC with `Z`.
    - **Lists**: cursor pagination `?cursor=&limit=` → `{ data, nextCursor }`.
    - **Money operations** require `Idempotency-Key` (ADR-003 §6).
    - **Auth** (ADR-002): Ed25519 JWT access token (15 min) + rotating opaque refresh token.
      Mobile and server-side rendering send `Authorization: Bearer`; browsers use HttpOnly cookies set by
      the API. Cookie-authenticated POST/PUT/PATCH/DELETE must send `X-MyTask-Client: web` (or `admin`)
      and a same-site `Origin`, otherwise `403 CSRF_CHECK_FAILED`.
    - **Staff** endpoints (`/admin/*`) are served on the admin host only, accept only staff-audience tokens,
      and each declares one RBAC permission in `x-permission.permission` (ADR-010, spec 16).
    - **Maintenance** (S-121): user endpoints answer `503 MAINTENANCE`; admin, webhooks and health keep working.
    - **Mobile version gate**: responses carry `X-Min-App-Version`; older apps get `426 APP_VERSION_UNSUPPORTED`.

    ## Vendor extensions used on operations
    `x-permission` (who may call; required), `x-covers` (spec ACs covered; required), `x-money`
    (money/points operation; requires `Idempotency-Key`), `x-rate-limit`, `x-notifications`
    (spec 15 events emitted), `x-emits` (realtime events), `x-settings` (register rows read),
    `x-audit` (audit-log action written). Definitions: CONVENTIONS.md §6.
  contact:
    name: MyTask.ge (Owner)
    url: https://mytask.ge/help/contact
  license:
    name: Proprietary. All rights reserved.
    identifier: LicenseRef-MyTask-Proprietary
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (docker compose + pnpm dev). Serves both public and /admin operations.
  - url: https://staging.mytask.ge/api/v1
    description: Staging, public host (placeholder until Phase 5; basic-auth in front, noindex).
  - url: https://admin.staging.mytask.ge/api/v1
    description: Staging, admin host (placeholder). Use only for /admin/* operations.
  - url: https://mytask.ge/api/v1
    description: Production, public host (web same-origin, mobile). /admin/* is NOT served here.
  - url: https://admin.mytask.ge/api/v1
    description: Production, admin host (ADR-010). Use only for /admin/* operations (staff tokens, host-only cookies).
