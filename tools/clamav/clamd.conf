# clamd configuration for the local `scan` profile (ADR-009 §6). Mounted over the image's default
# /etc/clamav/clamd.conf by docker-compose.yml; production uses the same limits (Phase 6, DevOps).
#
# Size limits (Q-154, Owner 2026-09-30): appeal videos may be 100 MB, and clamd's defaults (25 MB stream,
# 100 MB file/scan) would refuse or skip them. The API streams each upload with INSTREAM, so
# StreamMaxLength must be above the largest upload; MaxScanSize also counts unpacked archive content.
StreamMaxLength 110M
MaxFileSize 110M
MaxScanSize 400M

# The image's own settings (clamav/clamav 1.5 docker defaults), kept so the entrypoint and healthcheck work.
Foreground yes
User clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
PidFile /tmp/clamd.pid
DatabaseDirectory /var/lib/clamav
LogTime yes
LogFile /var/log/clamav/clamd.log

# A file that cannot be fully scanned (e.g. an archive bomb above MaxScanSize) is reported as
# "Heuristics.Limits.Exceeded FOUND" and rejected, never passed as clean.
AlertExceedsMax yes
