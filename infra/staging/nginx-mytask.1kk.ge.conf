# MyTask STAGING — mytask.1kk.ge. Mirrors infra/caddy/Caddyfile (ADR-013 §14–§19) plus noindex.
# No basic auth except on the test inbox (Owner 2026-10-06: the 1kk.ge space is used only by the Owner). Staff panel under /admin on the
# same host (Owner 2026-10-06): it has its own staff login; staff cookies are separate (`__Host-mt_staff_*`).
# Upstreams (loopback only): web [::1]:3310, admin [::1]:3320, api 127.0.0.1:3300, SeaweedFS S3 8333
# (public-media read only), Mailpit UI 8025. The Next.js apps listen on localhost = ::1 (BUG-01, README).
# TLS: Let's Encrypt via certbot (auto-renew). On a fresh server, install the site without the TLS lines first,
# then run `certbot --nginx -d mytask.1kk.ge --redirect`.

upstream mytask_web { server [::1]:3310; keepalive 8; }
upstream mytask_admin { server [::1]:3320; keepalive 8; }
upstream mytask_api { server 127.0.0.1:3300; keepalive 8; }

server {
    server_name mytask.1kk.ge;

    client_max_body_size 25m;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Edge rule: never forward client-sent proxy/identity headers; set the one canonical client-IP header.
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header Connection         "";
    proxy_set_header X-Forwarded-For    "";
    proxy_set_header X-Forwarded-Proto  "";
    proxy_set_header X-Forwarded-Host   "";
    proxy_set_header X-Real-IP          "";
    proxy_set_header Forwarded          "";
    proxy_set_header True-Client-IP     "";
    proxy_set_header CF-Connecting-IP   "";
    proxy_set_header X-MyTask-Client-Country "";
    proxy_set_header X-MyTask-Service-Auth   "";
    proxy_set_header X-MyTask-Client-IP $remote_addr;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Staff panel (Next.js basePath /admin). Staff API calls go to /api/v1/admin/* below.
    location = /admin {
        proxy_pass http://mytask_admin;
    }
    location /admin/ {
        proxy_pass http://mytask_admin;
    }

    location /api/ {
        proxy_pass http://mytask_api;
    }

    location /ws {
        proxy_pass http://mytask_api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Processed public images (CDN role in production): anonymous read of the public-media bucket.
    location /media/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8333/public-media/;
        proxy_set_header Authorization "";
    }

    # Test inbox (all staging emails land here, nothing is sent out). Kept behind basic auth: it holds password-reset
    # and verification links for every staging account, the Super-admin included.
    location /__mail/ {
        auth_basic           "MyTask staging inbox";
        auth_basic_user_file /etc/nginx/mytask-staging.htpasswd;
        proxy_pass http://127.0.0.1:8025;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://mytask_web;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mytask.1kk.ge/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mytask.1kk.ge/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = mytask.1kk.ge) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name mytask.1kk.ge;
    return 404; # managed by Certbot
}
