# MyTask STAGING — mytask.1kk.ge. Mirrors infra/caddy/Caddyfile (ADR-013 §14–§19) plus basic auth + noindex (ADR-015 §2).
# Upstreams (loopback only): web [::1]:3310, api 3300, SeaweedFS S3 8333 (public-media read only), Mailpit UI 8025.

# Basic auth for everyone, except API calls that already carry a Bearer token (the API checks those itself).
map $http_authorization $mytask_staging_auth {
    "~^Bearer "   off;
    default       "MyTask staging";
}

upstream mytask_web { server [::1]:3310; keepalive 8; }   # web listens on localhost = ::1 (BUG-01)
upstream mytask_api { server 127.0.0.1:3300; keepalive 8; }

server {
    listen 80;
    server_name mytask.1kk.ge;

    client_max_body_size 25m;
    server_tokens off;

    auth_basic           $mytask_staging_auth;
    auth_basic_user_file /etc/nginx/mytask-staging.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Edge rule: never forward client-sent proxy/identity headers; set the one canonical client-IP header.
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header Connection         "";
    proxy_set_header X-Forwarded-For    "";
    proxy_set_header X-Forwarded-Proto  "";
    proxy_set_header X-Forwarded-Host   "";
    proxy_set_header X-Real-IP          "";
    proxy_set_header Forwarded          "";
    proxy_set_header True-Client-IP     "";
    proxy_set_header CF-Connecting-IP   "";
    proxy_set_header X-MyTask-Client-Country "";
    proxy_set_header X-MyTask-Service-Auth   "";
    proxy_set_header X-MyTask-Client-IP $remote_addr;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Staff API only on the admin host (not deployed on staging yet).
    location /api/v1/admin/ { return 404; }

    location /api/ {
        proxy_pass http://mytask_api;
    }

    location /ws {
        proxy_pass http://mytask_api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Processed public images (CDN role in production): anonymous read of the public-media bucket.
    location /media/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8333/public-media/;
        proxy_set_header Authorization "";
    }

    # Test inbox (all staging emails land here, nothing is sent out).
    location /__mail/ {
        proxy_pass http://127.0.0.1:8025;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://mytask_web;
    }
}
