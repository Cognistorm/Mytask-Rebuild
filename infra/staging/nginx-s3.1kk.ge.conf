# MyTask STAGING object storage — s3.1kk.ge = the browsers' S3 endpoint (S3_PUBLIC_ENDPOINT, ADR-009/ADR-017).
# Browsers upload with presigned POSTs and download private files with presigned GETs signed for this host; every
# other call needs the S3 keys (anonymous: read public-media only, infra/staging/server-setup.sh).
# Host is passed unchanged because presigned GET signatures include it. No client forwarding headers.
# TLS: Let's Encrypt via certbot. On a fresh server, install without the TLS lines, then
# `certbot --nginx -d s3.1kk.ge --redirect`.

server {
    server_name s3.1kk.ge;

    server_tokens off;
    # Uploads up to 110 MB (Q-154 / tools/clamav limits), streamed straight to SeaweedFS.
    client_max_body_size 110m;
    proxy_request_buffering off;
    proxy_buffering off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:8333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Forwarded-For   "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host  "";
        proxy_set_header X-Real-IP         "";
        proxy_set_header Forwarded         "";
        proxy_read_timeout 300s;
    }

    listen 80;
}
